<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA PERSEVERANCIA | COCINA HERNÁN</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0e0e0e;color:#fff;padding:10px}
header{background:#c0392b;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.layout{display:grid;grid-template-columns:360px 1fr;gap:12px;margin-top:10px}
.panel{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:12px}
.titulo{color:#ff9900;font-weight:bold;font-size:12px;margin-bottom:10px}
.card{border:2px solid #e67e22;border-left:6px solid #e67e22;background:#242424;border-radius:8px;padding:10px;margin-bottom:10px}
.plano{display:flex;flex-direction:column;gap:16px}
.zona{background:#111;border:1px solid #222;border-radius:10px;padding:12px}
.zona-titulo{font-size:11px;color:#888;font-weight:bold;letter-spacing:1px;margin-bottom:10px;display:block}
.grilla-salon{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grilla-vereda{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grilla-canal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mesa-box{background:#1e1e1e;border:2px solid #333;border-radius:8px;padding:10px;min-height:110px;transition:.2s}
.mesa-box.ocupada{border-color:#e74c3c;background:#2a1a1a;box-shadow:0 0 8px rgba(231,76,60,.3)}
.mesa-nombre{font-size:11px;font-weight:bold;display:flex;justify-content:space-between;border-bottom:1px solid #333;padding-bottom:5px}
.item{font-size:11px;padding:2px 0;display:flex;justify-content:space-between}
.btn-resumen{background:#1a5276;border:1px solid #2980b9;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:bold}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:999}
.modal-box{background:#1e1e1e;border:1px solid #444;border-radius:10px;padding:18px;width:92%;max-width:500px;max-height:85vh;overflow:auto}
</style>
</head>
<body>
<header><h1>🔥 HERNÁN - COCINA <span id="reloj" style="font-size:12px"></span></h1><button class="btn-resumen" onclick="abrirResumen()">📊 RESUMEN (<span id="cantResumen">0</span>)</button></header>
<div class="layout">
<aside class="panel"><div class="titulo">🍳 ORDEN DE LLEGADA - FIFO <span id="total" style="float:right;color:#fff">0</span></div><div id="listaFIFO"></div></aside>
<main class="panel"><div class="titulo">📍 PLANO DEL LOCAL</div><div class="plano" id="plano"></div></main>
</div>
<div class="modal" id="modalResumen"><div class="modal-box"><div style="display:flex;justify-content:space-between"><h3 style="color:#ff9900">📊 RESUMEN CERRADAS</h3><button onclick="cerrarResumen()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div id="contResumen" style="margin-top:10px"></div><button onclick="localStorage.setItem('resumen_hernan_v5','[]');location.reload()" style="width:100%;background:#c0392b;border:none;padding:10px;border-radius:6px;color:#fff;font-weight:bold;margin-top:12px">🗑️ LIMPIAR RESUMEN</button></div></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU", authDomain: "parrilla-la-perseveranci-f3f54.firebaseapp.com", databaseURL: "https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com", projectId: "parrilla-la-perseveranci-f3f54", storageBucket: "parrilla-la-perseveranci-f3f54.firebasestorage.app", messagingSenderId: "899082319184", appId: "1:899082319184:web:9876161963705785efe855" };
firebase.initializeApp(firebaseConfig); const db=firebase.database();
setInterval(()=>document.getElementById('reloj').textContent=new Date().toLocaleTimeString('es-AR'),1000);
const ZONAS = { "SALÓN PRINCIPAL": {mesas:["Salón - Mesa 1","Salón - Mesa 2","Salón - Mesa 3","Salón - Mesa 4"], clase:"grilla-salon"}, "VEREDA": {mesas:["Vereda - Mesa 5","Vereda - Mesa 6","Vereda - Mesa 7"], clase:"grilla-vereda"}, "CANAL MOSTRADOR / DELIVERY": {mesas:["Canal - Mostrador","Canal - Pickup","Canal - Delivery"], clase:"grilla-canal"} };
let anterior={}; let resumen=JSON.parse(localStorage.getItem('resumen_hernan_v5')||'[]');
function saveResumen(){localStorage.setItem('resumen_hernan_v5',JSON.stringify(resumen)); document.getElementById('cantResumen').textContent=resumen.length}
db.ref('comandas_activas').on('value', snap=>{
  const data=snap.val()||{}; const porMesa={};
  Object.values(data).forEach(cmd=>{
    if(!cmd||!cmd.mesa||cmd.mesa==='undefined') return;
    const m=String(cmd.mesa).trim(); if(!porMesa[m]) porMesa[m]={mesa:m,items:[],total:0,timestamp:cmd.timestamp||Date.now(),estado:cmd.estado||'PENDIENTE'};
    porMesa[m].items.push(...(cmd.items||[])); porMesa[m].total+=Number(cmd.total||0);
  });
  // detectar cerradas -> pasan a resumen y desaparecen
  Object.keys(anterior).forEach(m=>{ if(!porMesa[m]){ resumen.unshift({mesa:m,items:anterior[m].items,total:anterior[m].total,hora:new Date().toLocaleTimeString('es-AR')}); if(resumen.length>100) resumen.pop(); } });
  anterior=JSON.parse(JSON.stringify(porMesa)); saveResumen(); render(porMesa);
});
function render(porMesa){
  const fifo=document.getElementById('listaFIFO'); const plano=document.getElementById('plano'); fifo.innerHTML=''; plano.innerHTML='';
  const orden=Object.values(porMesa).sort((a,b)=>a.timestamp-b.timestamp); document.getElementById('total').textContent=orden.length;
  if(orden.length===0) fifo.innerHTML='<p style="color:#666;text-align:center;margin-top:20px">Sin comandas<br>Esperando a Mariana</p>';
  orden.forEach((g,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<div style="display:flex;justify-content:space-between"><b style="color:#ff9900">#${String(i+1).padStart(3,'0')} 📍 ${g.mesa}</b><small style="background:#000;padding:2px 6px;border-radius:4px;border:1px solid #00ff66;color:#00ff66">${g.estado}</small></div><div style="margin-top:8px">${g.items.map(it=>`<div class=item><span>${it.nombre}</span><b style=color:#00ff66>x${it.cantidad}</b></div>`).join('')}</div><small style=color:#888>Total $${g.total.toLocaleString('es-AR')}</small>`; fifo.appendChild(d); });
  Object.entries(ZONAS).forEach(([titulo,info])=>{ const zona=document.createElement('div'); zona.className='zona'; zona.innerHTML=`<span class=zona-titulo>${titulo}</span><div class="${info.clase}"></div>`; const grilla=zona.querySelector('div'); info.mesas.forEach(mesaId=>{ const g=porMesa[mesaId]; const box=document.createElement('div'); box.className='mesa-box'+(g?' ocupada':''); box.innerHTML=g?`<div class=mesa-nombre><span>${mesaId}</span><span style=color:#e74c3c>● OCUPADA</span></div><div style=margin-top:6px>${g.items.map(it=>`• ${it.cantidad}x ${it.nombre}`).join('<br>')}</div>`:`<div class=mesa-nombre><span>${mesaId}</span><span style=color:#555>Libre</span></div><p style=color:#444;text-align:center;margin-top:25px;font-size:11px>Libre</p>`; grilla.appendChild(box); }); plano.appendChild(zona); });
}
function abrirResumen(){ document.getElementById('contResumen').innerHTML=resumen.length?resumen.map(r=>`<div style="background:#222;padding:8px;border-radius:6px;margin-bottom:8px;border-left:4px solid #27ae60"><div style="display:flex;justify-content:space-between"><b style="color:#ff9900">${r.mesa}</b><small>${r.hora} $${r.total.toLocaleString('es-AR')}</small></div><div style="font-size:11px">${r.items.map(it=>`• ${it.cantidad}x ${it.nombre}`).join('<br>')}</div></div>`).join(''):'<p style=color:#666>Vacío</p>'; document.getElementById('modalResumen').style.display='flex'; }
function cerrarResumen(){document.getElementById('modalResumen').style.display='none'}
saveResumen();
</script>
</body>
</html>
