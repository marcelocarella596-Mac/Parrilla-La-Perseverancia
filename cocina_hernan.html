"verTabCaja('ingresos')">💵 INGRESOS</button><button class="btn" style="flex:1;border-color:#e74c3c;color:#e74c3c" onclick="verTabCaja('egresos')">🛒 EGRESOS</button></div><div id="cajaLista" style="font-size:11px;background:#111;padding:10px;border-radius:6px;max-height:45vh;overflow-y:auto"></div><button class="btn-estado" style="background:#333;margin-top:10px" onclick="document.getElementById('modalCaja').style.display='none'">CERRAR</button></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
function limpiarKey(str){return (str||'').normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,'_').replace(/__+/g,'_').toLowerCase();}
const MAPEO={"Salón - Mesa 1":"Mesa 1","Salón - Mesa 2":"Mesa 2","Salón - Mesa 3":"Mesa 3","Salón - Mesa 4":"Mesa 4","Vereda - Mesa 5":"Mesa 5 Vereda","Vereda - Mesa 6":"Mesa 6 Vereda","Vereda - Mesa 7":"Mesa 7 Vereda","Canal - Mostrador":"Mostrador","Canal - Pickup":"Pickup","Canal - Delivery":"Delivery"};
const NOMBRES={"Mesa 1":"MESA 1","Mesa 2":"MESA 2","Mesa 3":"MESA 3","Mesa 4":"MESA 4","Mesa 5 Vereda":"MESA 5 VEREDA","Mesa 6 Vereda":"MESA 6 VEREDA","Mesa 7 Vereda":"MESA 7 VEREDA","Mostrador":"MOSTRADOR","Pickup":"PICKUP","Delivery":"DELIVERY"};
const MENU_COMPLETO=["Asado 1/2","Asado c/fritas","Vacio","Bife de chorizo","Entraña","Chorizo","Morcilla","Chinchulin","Molleja","Provoleta","Milanesa","Milanesa napolitana","Milanesa napo c/fritas","Fritas","Papas fritas","Ensalada Mixta","Ensalada Completa","Puré","Matambre","Pechuga","Suprema","Bondiola","Choripan","Morcipan"];
let comandas={},sel=null,agotadosCache={},historialCaja=[],historialEgresos=[],tabCaja='ingresos',audioCtx=null,ultimaAlarma={};
function initAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
function beep(f,d){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.value=.5;o.start();setTimeout(()=>{try{o.stop()}catch{}},d);}
function alarmaTipo(t){beep(t.includes('RECIBIDO')?600:t.includes('PREP')?900:1200, t.includes('MANOS')?600:400);}
const PARRILLA_BASE=['asado','vacio','vacío','bife','entraña','morcilla','chinchulin','chorizo','provoleta','molleja','costillar','matambre','bondiola','choripan','morcipan','parrillada','pollo'];
const AGREGADOS_COCINA=['lechuga','tomate','jamon','jamón','queso','huevo','frita','papas'];
const COCINA_PURA=['milanesa','suprema','pechuga','tortilla','buñuelo'];
function descomponerItem(nom){const n=(nom||'').toLowerCase(); if(COCINA_PURA.some(k=>n.includes(k))) return [{texto:nom, estacion:'COCINA'}]; const esParr=PARRILLA_BASE.some(k=>n.includes(k)); const tiene=AGREGADOS_COCINA.some(k=>n.includes(k)); const esSand=(n.includes('vacio')||n.includes('bondiola')||n.includes('choripan')||n.includes('morcipan')||n.includes('chorizo')||n.includes('morcilla')||n.includes('asado')||n.includes('bife'))&&tiene; if(esSand){let carne=nom,agr='';const m=n.match(/(lechuga|tomate|jamon|jamón|queso|huevo|frita|papas)/); if(m){const idx=n.indexOf(m[0]); if(idx>2){carne=nom.substring(0,idx).trim(); agr=nom.substring(idx).trim();}} if(n.includes('c/fritas')){const p=nom.split(/c\/fritas/i); carne=p[0].trim(); agr='FRITAS';} if(n.includes(' solo')) return [{texto:carne, estacion:'PARRILLA'}]; const res=[]; if(carne) res.push({texto:carne, estacion:'PARRILLA'}); if(agr) res.push({texto:agr.toUpperCase(), estacion:'COCINA', esGuarnicion:true}); return res.length?res:[{texto:nom, estacion:'PARRILLA'}];} if(esParr&&tiene){const carne=nom.split(/c\/fritas/i)[0].trim(); return [{texto:carne, estacion:'PARRILLA'}, {texto:'FRITAS', estacion:'COCINA', esGuarnicion:true}];} if(esParr) return [{texto:nom, estacion:'PARRILLA'}]; return [{texto:nom, estacion:'COCINA'}];}
function getTipo(items){let p=false,c=false;(items||[]).forEach(it=>{descomponerItem(it.nombre).forEach(s=>{if(s.estacion==='PARRILLA') p=true; else c=true;});}); if(p&&c) return 'MIXTA'; if(p) return 'PARRILLA'; return 'COCINA';}
db.ref('comandas_activas').on('value',s=>{
const data=s.val()||{};const nuevo={};
Object.values(data).forEach(cmd=>{
if(!cmd.mesa) return;const idV=MAPEO[cmd.mesa]||cmd.mesa;if(!NOMBRES[idV]) return;
if(!nuevo[idV]) nuevo[idV]={id:idV,mesa:cmd.mesa,items:[],estado:(cmd.estado||'RECIBIDO').toUpperCase(),estado_cocina:(cmd.estado_cocina||cmd.estado||'RECIBIDO').toUpperCase(),estado_parrilla:(cmd.estado_parrilla||cmd.estado||'RECIBIDO').toUpperCase(),total_cobrado:cmd.total_cobrado||0,timestamp:cmd.timestamp||Date.now(),timestamp_estado:cmd.timestamp_estado||cmd.timestamp||Date.now(),nroOrden:cmd.nroOrden||100};
(cmd.items||[]).forEach(it=>{if(!it.nombre||it.nombre.toLowerCase().includes('undefined')) return;const ex=nuevo[idV].items.find(x=>x.nombre===it.nombre);if(ex) ex.cantidad+=parseInt(it.cantidad||1);else nuevo[idV].items.push({nombre:it.nombre,cantidad:parseInt(it.cantidad||1)});});
nuevo[idV].estado=cmd.estado||nuevo[idV].estado; nuevo[idV].estado_cocina=cmd.estado_cocina||nuevo[idV].estado; nuevo[idV].estado_parrilla=cmd.estado_parrilla||nuevo[idV].estado; nuevo[idV].total_cobrado=cmd.total_cobrado||0; nuevo[idV].timestamp=cmd.timestamp||nuevo[idV].timestamp; nuevo[idV].timestamp_estado=cmd.timestamp_estado||nuevo[idV].timestamp_estado;
});
comandas=nuevo;render();checkAlarmas();
});
db.ref('platos_agotados').on('value',s=>{agotadosCache=s.val()||{};render();});
db.ref('historial_caja').on('value',s=>{historialCaja=Object.values(s.val()||{}).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));actualizarResumenCaja();});
db.ref('egresos_caja').on('value',s=>{historialEgresos=Object.values(s.val()||{}).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));actualizarResumenCaja();});
db.ref('mensajes_chat').limitToLast(50).on('value',snap=>{
const box=document.getElementById('chatMensajes'); if(!box) return; box.innerHTML='';const data=snap.val(); if(!data) return;
Object.values(data).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(m=>{
const d=document.createElement('div'); d.className=`chat-msg ${m.remitente==='Hernán'?'mio':''}`;d.innerHTML=`<strong style="color:${m.remitente==='Hernán'?'#00ff66':m.remitente==='Mariana'?'#e74c3c':'#3498db'}">${m.remitente}</strong> <small>(${m.hora||''})</small><br>${m.texto}`;box.appendChild(d);
}); box.scrollTop=box.scrollHeight;
});
function checkAlarmas(){Object.values(comandas).forEach(cmd=>{const tipo=getTipo(cmd.items); if(tipo==='PARRILLA') return; const ep=cmd.estado_parrilla||'',ec=cmd.estado_cocina||cmd.estado||'RECIBIDO'; const estadoEval=tipo==='MIXTA'?(ec.includes('MANOS')&&ep.includes('MANOS')?'MIXTA LISTA':ec):ec; const mins=(Date.now()-(cmd.timestamp_estado||cmd.timestamp))/1000/60; let debe=null; if(estadoEval==='RECIBIDO'&&mins>=5) debe='RECIBIDO'; if(estadoEval.includes('PREPARACION')&&mins>=15) debe='PREPARACION'; if((estadoEval.includes('MANOS')||estadoEval.includes('LISTA'))&&mins>=1.5) debe=estadoEval; if(debe){const k=limpiarKey(cmd.mesa)+'_'+debe; if(!ultimaAlarma[k]||Date.now()-ultimaAlarma[k]>30000){alarmaTipo(debe); ultimaAlarma[k]=Date.now(); console.log('ALARMA HERNAN',cmd.mesa,debe,mins.toFixed(1));}}});}
setInterval(checkAlarmas,5000);
document.addEventListener('click',initAudio,{once:true});
function actualizarResumenCaja(){const hoy=new Date().toDateString(); let ti=0,tk=0,te=0,ce=0;historialCaja.forEach(r=>{if(new Date(r.timestamp||Date.now()).toDateString()===hoy){ti+=Number(r.total||r.total_cobrado||0);tk++;}});historialEgresos.forEach(r=>{if(new Date(r.timestamp||Date.now()).toDateString()===hoy){te+=Number(r.monto||0);ce++;}});const el=document.getElementById('cajaTotal'); if(el){el.textContent='$'+ti; document.getElementById('cajaTickets').textContent=tk+' tickets'; document.getElementById('cajaEgresosTotal').textContent='$'+te; document.getElementById('cajaEgresosCant').textContent=ce+' compras'; document.getElementById('cajaNeto').textContent='$'+(ti-te);} if(document.getElementById('modalCaja').style.display==='flex') renderListaCaja();}
function renderListaCaja(){let html='';if(tabCaja==='ingresos'){if(historialCaja.length===0) html='Sin ingresos'; else historialCaja.slice(0,50).forEach(r=>{const f=new Date(r.timestamp||Date.now()).toLocaleString('es-AR'); html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:5px 0"><div><b style="color:#27ae60">+ $${r.total||r.total_cobrado||0}</b> ${r.mesaId||r.mesa||''}<br><small>${f}</small></div></div>`;});}else{if(historialEgresos.length===0) html='Sin egresos'; else historialEgresos.slice(0,50).forEach(r=>{const f=new Date(r.timestamp||Date.now()).toLocaleString('es-AR'); html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:5px 0"><div><b style="color:#e74c3c">- $${r.monto}</b> ${r.concepto}<br><small>${f}</small></div><button onclick="borrarEgreso('${r.id}')" style="background:none;border:1px solid #c0392b;color:#c0392b;padding:2px 6px;border-radius:3px">X</button></div>`;});} document.getElementById('cajaLista').innerHTML=html;}
function verTabCaja(t){tabCaja=t; renderListaCaja();}
function agregarEgreso(){const c=document.getElementById('egrConcepto').value.trim();const m=Number(document.getElementById('egrMonto').value);if(!c||!m){alert('Poné concepto y monto');return;}const id=Date.now();db.ref('egresos_caja/'+id).set({id:id,concepto:c,monto:m,timestamp:id,por:'Hernán'});document.getElementById('egrConcepto').value='';document.getElementById('egrMonto').value='';}
function borrarEgreso(id){if(!confirm('¿Borrar?'))return; db.ref('egresos_caja/'+id).remove();}
function render(){
const ids=Object.keys(comandas);document.getElementById('cant').textContent=ids.length;
const fifo=document.getElementById('listaFIFO');fifo.innerHTML='';
ids.sort((a,b)=>comandas[a].timestamp-comandas[b].timestamp).forEach(id=>{
const cmd=comandas[id];const tipo=getTipo(cmd.items);if(tipo==='PARRILLA') return;const nro=String(cmd.nroOrden).slice(-3);const esCobrada=cmd.estado==='COBRADA'||cmd.estado_cocina==='COBRADA';
const mins=(Date.now()-(cmd.timestamp_estado||cmd.timestamp))/1000/60; let alarmClass=''; if(!esCobrada){ if(cmd.estado==='RECIBIDO'&&mins>=5) alarmClass=' alarm-recibido'; else if((cmd.estado_cocina||'').includes('PREPARACION')&&mins>=15) alarmClass=' alarm-prep'; else if((cmd.estado_cocina||'').includes('MANOS')&&mins>=1.5) alarmClass=' alarm-manos';}
let items='';cmd.items.forEach(it=>{descomponerItem(it.nombre).forEach(s=>{let cls=''; if(s.estacion==='PARRILLA') cls='tachado'; else if(s.esGuarnicion) cls='guarnicion'; if(agotadosCache[it.nombre]) cls+=' tachado'; items+=`<div class="${cls}" style="display:flex;justify-content:space-between;font-size:12px"><span>• ${s.texto}</span><b>x${it.cantidad}</b></div>`;});});
const div=document.createElement('div');div.className=`ticket ${esCobrada?'COBRADA':cmd.estado_cocina||cmd.estado} ${alarmClass}`;div.onclick=()=>abrir(id);
div.innerHTML=`<div style="display:flex;justify-content:space-between"><span><span style="background:#000;color:#f1c40f;border:1px solid #f1c40f;padding:1px 4px;border-radius:4px;font-family:monospace">#${nro}</span> ${id}</span><span class="badge-tipo" style="color:${esCobrada?'#f1c40f':tipo==='MIXTA'?'#f1c40f':'#00ff66'}">${esCobrada?'💰 COBRADA':tipo}</span></div><div style="font-size:10px;color:#aaa;margin:4px 0">${cmd.estado_cocina||cmd.estado} - ${mins.toFixed(1)}min</div>${items}`;fifo.appendChild(div);
});
const plano=document.getElementById('plano');plano.innerHTML='<div class="plano-grid" id="g"></div>';const g=document.getElementById('g');
Object.keys(NOMBRES).forEach(id=>{
const cmd=comandas[id];if(!cmd) {const card=document.createElement('div');card.className='mesa-card';card.innerHTML=`<b>${NOMBRES[id]}</b><br><small style="color:#666">Libre</small>`;g.appendChild(card); return;}const tipo=getTipo(cmd.items);if(tipo==='PARRILLA') return;const esCobrada=cmd.estado==='COBRADA'||cmd.estado_cocina==='COBRADA';
const mins=(Date.now()-(cmd.timestamp_estado||cmd.timestamp))/1000/60; let alarmClass=''; if(!esCobrada){ if(cmd.estado==='RECIBIDO'&&mins>=5) alarmClass=' alarm-recibido'; else if((cmd.estado_cocina||'').includes('PREPARACION')&&mins>=15) alarmClass=' alarm-prep'; else if((cmd.estado_cocina||'').includes('MANOS')&&mins>=1.5) alarmClass=' alarm-manos';}
const card=document.createElement('div');card.className=`mesa-card ocupada ${alarmClass} ${esCobrada?'cobrada':''}`;card.onclick=()=>{if(cmd) abrir(id);};
if(esCobrada){card.innerHTML=`<b>${NOMBRES[id]}</b><div style="text-align:center;color:#f1c40f;font-weight:800;margin-top:8px">💰 COBRADA<br>$${cmd.total_cobrado||''}</div>`;}
else{const seg=Math.floor((Date.now()-cmd.timestamp)/1000);const mm=String(Math.floor(seg/60)).padStart(2,'0');const ss=String(seg%60).padStart(2,'0');let lista='';cmd.items.forEach(it=>{descomponerItem(it.nombre).forEach(s=>{let style='';if(s.estacion==='PARRILLA') style='text-decoration:line-through;opacity:0.4'; else if(s.esGuarnicion) style='font-weight:900;color:#fff;background:rgba(39,174,96,0.2)'; lista+=`<li style="${style}">• ${s.texto} x${it.cantidad}</li>`;});}); card.innerHTML=`<div style="display:flex;justify-content:space-between"><span><span style="color:#f1c40f">#${String(cmd.nroOrden).slice(-3)}</span> ${NOMBRES[id]}</span><span class="badge-tipo" style="color:${tipo==='MIXTA'?'#f1c40f':'#00ff66'}">${tipo}</span></div><div style="font-size:10px;color:#00ff66">${cmd.estado_cocina||cmd.estado} - ${mins.toFixed(1)}min</div><ul style="list-style:none;font-size:11px;margin:4px 0">${lista}</ul><div class="timer">${mm}:${ss}</div>`;}
g.appendChild(card);
});
}
function abrir(id){
sel=id;const cmd=comandas[id];const tipo=getTipo(cmd.items);const esCobrada=cmd.estado==='COBRADA'||cmd.estado_cocina==='COBRADA';
if(esCobrada){document.getElementById('modalTitulo').textContent=id+' - 💰 COBRADA';document.getElementById('modalDetalle').innerHTML=`COBRADA $${cmd.total_cobrado||''}<br>Espera Mariana`;document.getElementById('b1').style.display='none';document.getElementById('b2').style.display='none';document.getElementById('b3').style.display='none';document.getElementById('modal').style.display='flex';return;}
document.getElementById('b1').style.display='block';document.getElementById('b2').style.display='block';document.getElementById('b3').style.display='block';
if(tipo==='PARRILLA') return;
document.getElementById('modalTitulo').textContent=id+' - '+tipo;
let det=`<b>Estado: ${cmd.estado_cocina||cmd.estado}</b> - ${((Date.now()-(cmd.timestamp_estado||cmd.timestamp))/1000/60).toFixed(1)}min<br><br>`;cmd.items.forEach(it=>{det+=`${it.nombre} x${it.cantidad} => ${descomponerItem(it.nombre).map(s=>s.estacion+':'+s.texto).join(' + ')}<br>`;});
document.getElementById('modalDetalle').innerHTML=det;
document.getElementById('modal').style.display='flex';
}
function cerrar(){document.getElementById('modal').style.display='none';}
function setEstado(n){
if(!sel) return;const t=getTipo(comandas[sel].items);if(t==='PARRILLA') return;const esCobrada=comandas[sel].estado==='COBRADA';if(esCobrada){alert('Cobrada, espera Mariana');return;}
const idSeguro=limpiarKey(comandas[sel].mesa);
const ahora=Date.now();
db.ref('comandas_activas/'+idSeguro+'/estado_cocina').set(n);
db.ref('comandas_activas/'+idSeguro+'/timestamp_estado').set(ahora);
db.ref('comandas_activas/'+idSeguro+'/timestamp_'+n.toLowerCase()).set(ahora);
// Si es solo cocina, también actualiza estado general para Mariana
if(t==='COCINA'){ db.ref('comandas_activas/'+idSeguro+'/estado').set(n); }
cerrar();
}
function abrirResumen(){let html='';Object.keys(comandas).forEach(id=>{const c=comandas[id];html+=`• ${id} [${getTipo(c.items)}] ${c.estado_cocina||c.estado} - ${c.items.map(i=>i.nombre).join(', ')}<br>`;});document.getElementById('contenidoResumen').innerHTML=html||'Sin comandas';document.getElementById('modalResumen').style.display='flex';}
function abrirCaja(){tabCaja='ingresos';actualizarResumenCaja();renderListaCaja();document.getElementById('modalCaja').style.display='flex';}
function abrirMensajes(){document.getElementById('modalMensajes').style.display='flex';}
function enviarMensaje(){const inp=document.getElementById('inputMensaje');const txt=inp.value.trim();if(!txt)return;db.ref('mensajes_chat').push({remitente:'Hernán',texto:txt,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});inp.value='';}
function abrirAgotar(){const cont=document.getElementById('listaAgotar');cont.innerHTML='';MENU_COMPLETO.forEach(plato=>{const esta=!!agotadosCache[plato];const d=document.createElement('div');d.style.cssText=`padding:10px;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid ${esta?'#c0392b':'#333'};background:${esta?'#3a1212':'#1e1e1e'};color:${esta?'#ff6b6b':'#fff'};text-align:center`;d.textContent=(esta?'❌ ':'')+plato;d.onclick=()=>{if(esta) db.ref('platos_agotados/'+plato).remove();else db.ref('platos_agotados/'+plato).set({timestamp:Date.now(),por:'Hernán'}); setTimeout(abrirAgotar,300);};cont.appendChild(d);});document.getElementById('modalAgotar').style.display='flex';}
setInterval(render,1000);
</script>
