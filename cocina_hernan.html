<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandera Hernán (Cocina) | Parrilla La Perseverancia - FIX FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#0e0e0e;color:#fff;padding:8px}
header{background:linear-gradient(90deg,#b03a2e,#d35400);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
header h1{font-size:16px;letter-spacing:.5px}
header h1 span{font-size:11px;opacity:.8;font-weight:normal}
.header-right{display:flex;gap:6px;align-items:center}
.btn-hdr{border:none;padding:6px 10px;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer;color:#fff}
.btn-verde{background:#27ae60}.btn-naranja{background:#e67e22}.btn-negro{background:#000;border:1px solid #00ff66;color:#00ff66}
.badge-info{background:#111;border:1px solid #333;padding:4px 8px;border-radius:6px;font-size:11px}
.layout{display:grid;grid-template-columns:380px 1fr;gap:10px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}}
.panel{background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:10px}
.panel-titulo{color:#ff9900;font-size:11px;font-weight:bold;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.contenedor-tickets{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 120px);overflow-y:auto}
.item-cocina-card{background:#1c1c1c;border:1px solid #333;border-left:4px solid #2980b9;border-radius:6px;padding:8px;transition:.2s}
.item-cocina-card.estado-preparacion{border-left-color:#e67e22;background:#2a2011}
.item-cocina-card.estado-manos{border-left-color:#27ae60;background:#112a18}
.item-cocina-card.urgente-card{border-left-color:#ff0000;animation:pulse 1s infinite}
@keyframes pulse{0%{border-color:#ff0000}50%{border-color:#ff9900}100%{border-color:#ff0000}}
.item-cocina-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;border-bottom:1px solid #222;padding-bottom:4px}
.item-cocina-mesa{font-size:11px;font-weight:bold;color:#ff9900}
.badge-nro-orden{background:#000;color:#f1c40f;border:1px solid #f1c40f;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:10px;margin-right:4px}
.item-cocina-estado{font-size:9px;padding:2px 5px;border-radius:4px;background:#222;color:#fff}
.item-cocina-cuerpo{display:flex;flex-direction:column;gap:3px}
.item-cocina-nombre{display:flex;justify-content:space-between;font-size:12px;color:#ddd}
.item-cocina-cant{color:#00ff66;font-weight:bold}
.item-tachado-parrilla{text-decoration:line-through;opacity:0.35}
.item-guarnicion-activa{font-weight:900!important;color:#ffffff!important;background:rgba(39,174,96,0.15);padding:1px 4px;border-radius:3px;border-left:2px solid #27ae60}
.item-agotado-texto{color:#e74c3c;text-decoration:line-through}
.badge-agotado-tag{background:#c0392b;color:#fff;font-size:8px;padding:1px 3px;border-radius:3px;margin-left:4px}
.btn-limpiar-comanda{width:100%;margin-top:6px;background:#27ae60;border:none;color:#fff;padding:6px;border-radius:4px;font-weight:bold;cursor:pointer;font-size:11px}

/* PLANO */
.plano-header{color:#ff9900;font-size:11px;font-weight:bold;margin-bottom:8px}
.plano-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.mesa-tarjeta{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:8px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.mesa-tarjeta.ocupada{border-color:#c0392b;background:#281412}
.mesa-tarjeta.urgente{border-color:#ff0000;box-shadow:0 0 8px rgba(255,0,0,0.4)}
.mesa-hdr-info{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding-bottom:4px;margin-bottom:4px}
.mesa-nombre{font-size:11px;font-weight:bold;color:#fff}
.mesa-items-lista{list-style:none;padding:0;font-size:11px;color:#ccc;display:flex;flex-direction:column;gap:2px;max-height:70px;overflow-y:auto}
.timer-badge{margin-top:6px;background:#000;border:1px solid #00ff66;color:#00ff66;text-align:center;padding:3px;border-radius:4px;font-family:monospace;font-size:11px;font-weight:bold}
.timer-badge.alerta-roja{border-color:#ff0000;color:#ff0000;background:#2a0a0a}
.timer-badge.alerta-naranja{border-color:#e67e22;color:#e67e22}
.timer-badge.alerta-manos{border-color:#27ae60;color:#27ae60;background:#0a2a14}
.seccion-plano{margin-bottom:16px}
.seccion-plano h3{font-size:10px;color:#888;text-transform:uppercase;margin-bottom:6px}
</style>
</head>
<body>
<header>
<h1>🔥 LA PERSEVERANCIA <span>| VISTA COCINA (HERNÁN)</span></h1>
<div class="header-right">
<span class="badge-info" id="reloj">00:00:00</span>
<span class="badge-info" id="temp">18°C</span>
<span class="badge-info" id="cajaTop">$0</span>
<button class="btn-hdr btn-naranja" id="btnAlarma" onclick="toggleAlarma()">🔊 ALARMA ON</button>
<button class="btn-hdr btn-negro">📋 RESUMEN</button>
<button class="btn-hdr btn-negro">🚫 AGOTAR (86)</button>
<button class="btn-hdr btn-verde">💰 CAJA: $0</button>
<span class="badge-info" style="color:#00ff66;border-color:#00ff66">• COCINA ACTIVA</span>
</div>
</header>

<div class="layout">
<!-- IZQUIERDA FIFO -->
<div class="panel">
<div class="panel-titulo"><span>🔥 ÍTEMS DE COCINA (FIFO)</span><span id="cantComandas">0</span></div>
<div class="contenedor-tickets" id="contenedorTicketsLateral"></div>
</div>

<!-- DERECHA PLANO -->
<div class="panel">
<div class="panel-titulo"><span>📍 PLANO DE COCINA (COMANDAS EN TIEMPO REAL)</span></div>

<div class="seccion-plano">
<h3>🔥 Salón Principal</h3>
<div class="plano-grid" id="gridSalon"></div>
</div>

<div class="seccion-plano">
<h3>🌿 Vereda</h3>
<div class="plano-grid" id="gridVereda"></div>
</div>

<div class="seccion-plano">
<h3>🛍️ Mostrador / Delivery / Pickup</h3>
<div class="plano-grid" id="gridCanales"></div>
</div>

</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54",storageBucket:"parrilla-la-perseveranci-f3f54.firebasestorage.app",messagingSenderId:"899082319184",appId:"1:899082319184:web:9876161963705785efe855"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const MAPEO_NUEVO_A_VIEJO={"Salón - Mesa 1":"Mesa 1","Salón - Mesa 2":"Mesa 2","Salón - Mesa 3":"Mesa 3","Salón - Mesa 4":"Mesa 4","Vereda - Mesa 5":"Mesa 5 Vereda","Vereda - Mesa 6":"Mesa 6 Vereda","Vereda - Mesa 7":"Mesa 7 Vereda","Canal - Mostrador":"Mostrador","Canal - Pickup":"Pickup","Canal - Delivery":"Delivery"};
const NOMBRES_FIJOS={"Mesa 1":"MESA 1","Mesa 2":"MESA 2","Mesa 3":"MESA 3","Mesa 4":"MESA 4","Mesa 5 Vereda":"MESA 5 VEREDA","Mesa 6 Vereda":"MESA 6 VEREDA","Mesa 7 Vereda":"MESA 7 VEREDA","Mostrador":"🛍️ MOSTRADOR","Pickup":"🏃 PICKUP","Delivery":"🛵 DELIVERY"};

let comandasActivas={};
let platosAgotados=new Set();
let alarmaOn=true;
const palabrasClaveParrilla=['asado','vacio','bife','entraña','morcilla','chinchulin','chorizo','provoleta','molleja','parrilla','costillar','vacío','matambre','chori'];
function esItemParrilla(nombre){const t=(nombre||'').toLowerCase();return palabrasClaveParrilla.some(p=>t.includes(p));}
function esGuarnicionCocina(nombre){const t=(nombre||'').toLowerCase();return t.includes('frita')||t.includes('ensalada')||t.includes('papa')||t.includes('pure')||t.includes('puré');}

function generarNroOrden(){
  let c=parseInt(localStorage.getItem('controlOrdenesDiarias')||'0')+1;
  localStorage.setItem('controlOrdenesDiarias',c);
  return c;
}

function iniciarFirebase(){
  db.ref('comandas_activas').on('value', snap=>{
    const data=snap.val()||{};
    const nuevo={};
    Object.values(data).forEach(cmd=>{
      if(!cmd||!cmd.mesa||cmd.mesa==='undefined') return;
      if(cmd.mesa.includes('undefined')) return;
      const idViejo=MAPEO_NUEVO_A_VIEJO[cmd.mesa]||cmd.mesa;
      if(!NOMBRES_FIJOS[idViejo]) return;
      if(!nuevo[idViejo]){
        nuevo[idViejo]={id:idViejo, mesa:cmd.mesa, items:[], estado:cmd.estado||'RECIBIDO', tiempoInicio:cmd.timestamp||Date.now(), nroOrden:cmd.nroOrden||generarNroOrden(), urgente:cmd.urgente||false};
      }
      (cmd.items||[]).forEach(it=>{
        if(!it.nombre) return;
        if(it.nombre.toLowerCase().includes('undefined')) return;
        const ex=nuevo[idViejo].items.find(x=>x.nombre===it.nombre);
        if(ex) ex.cantidad+=parseInt(it.cantidad||1);
        else nuevo[idViejo].items.push({nombre:it.nombre, cantidad:parseInt(it.cantidad||1), precio:it.precio||0});
      });
    });
    comandasActivas=nuevo;
    renderizarPlanoYLateral();
  });
  db.ref('platos_agotados').on('value', s=>{ platosAgotados=new Set(Object.keys(s.val()||{})); renderizarPlanoYLateral(); });
}

function renderizarPlanoYLateral(){
  const ids=Object.keys(comandasActivas);
  document.getElementById('cantComandas').textContent=ids.length;
  const lateral=document.getElementById('contenedorTicketsLateral');

  if(ids.length===0){
    lateral.innerHTML='<p style="color:#666;font-size:13px;text-align:center;margin-top:20px;">Sin ítems pendientes.<br>Esperando a Mariana...</p>';
  } else {
    lateral.innerHTML='';
    ids.sort((a,b)=>comandasActivas[a].tiempoInicio-comandasActivas[b].tiempoInicio).forEach(id=>{
      const cmd=comandasActivas[id];
      const tieneParrilla=cmd.items.some(i=>esItemParrilla(i.nombre));
      const card=document.createElement('div');
      let clase='estado-recibido';
      if(cmd.estado==='PREPARACION') clase='estado-preparacion';
      if(cmd.estado==='MANOS') clase='estado-manos';
      card.className=`item-cocina-card ${clase} ${cmd.urgente?'urgente-card':''}`;
      let itemsHtml='';
      cmd.items.forEach(i=>{
        if(i.nombre.toLowerCase().includes('undefined')) return;
        const esParr=esItemParrilla(i.nombre);
        const esGuarn=esGuarnicionCocina(i.nombre);
        let claseExtra='';
        if(tieneParrilla){
          if(esParr &&!esGuarn) claseExtra='item-tachado-parrilla';
          if(esGuarn) claseExtra='item-guarnicion-activa';
        }
        itemsHtml+=`<div class="item-cocina-nombre ${claseExtra}"><span>${i.nombre}</span><span class="item-cocina-cant">x${i.cantidad}</span></div>`;
      });
      let btnLimpiar=cmd.estado==='MANOS'?`<button class="btn-limpiar-comanda" onclick="limpiarDesdeCocina('${id}')">✅ LIMPIAR / RETIRAR</button>`:'';
      const nroOrdenNum=String(cmd.nroOrden||0).padStart(3,'0').replace(/[^0-9]/g,'').slice(-3);
      card.innerHTML=`<div class="item-cocina-header"><span class="item-cocina-mesa"><span class="badge-nro-orden">#${nroOrdenNum}</span> 📍 ${id}</span><span class="item-cocina-estado">${cmd.estado}</span></div><div class="item-cocina-cuerpo">${itemsHtml}</div>${btnLimpiar}`;
      lateral.appendChild(card);
    });
  }

  const crearTarjetas=(contId, listaIds)=>{
    const cont=document.getElementById(contId);
    cont.innerHTML='';
    listaIds.forEach(id=>{
      const cmd=comandasActivas[id];
      const nombreFijo=NOMBRES_FIJOS[id]||id;
      const div=document.createElement('div');
      div.setAttribute('data-id',id);
      div.className=`mesa-tarjeta ${cmd?'ocupada':''}`;
      if(!cmd){
        div.innerHTML=`<div class="mesa-hdr-info"><span class="mesa-nombre">${nombreFijo}</span><small style="color:#666;">Libre</small></div><p style="color:#555;font-size:11px;text-align:center;margin:auto;">Sin comanda</p>`;
      } else {
        const tieneParrilla=cmd.items.some(i=>esItemParrilla(i.nombre));
        const seg=Math.floor((Date.now()-cmd.tiempoInicio)/1000);
        let badge='timer-badge'; let txt='';
        if(cmd.estado==='RECIBIDO'){const rest=300-seg; if(rest>=0){txt=`Recibido ${String(Math.floor(rest/60)).padStart(2,'0')}:${String(rest%60).padStart(2,'0')}`;} else {txt=`00:00`; badge+=' alerta-roja';} }
        else if(cmd.estado==='PREPARACION'){txt=`Prep. ${String(Math.floor(seg/60)).padStart(2,'0')}:${String(seg%60).padStart(2,'0')}`; if(seg>420) badge+=' alerta-naranja'; if(seg>900) badge+=' alerta-roja';}
        else if(cmd.estado==='MANOS'){const rest=60-seg; txt=rest>=0?`Manos 00:${String(rest).padStart(2,'0')}`:`00:00`; badge+=' alerta-manos';}

        let lista='<ul class="mesa-items-lista">';
        cmd.items.forEach(i=>{
          if(i.nombre.toLowerCase().includes('undefined')) return;
          const esParr=esItemParrilla(i.nombre);
          const esGuarn=esGuarnicionCocina(i.nombre);
          let style='';
          if(tieneParrilla){
            if(esParr &&!esGuarn) style='style="text-decoration:line-through;opacity:0.35;"';
            if(esGuarn) style='style="font-weight:900;color:#fff;background:rgba(39,174,96,0.2);padding:1px 3px;border-radius:3px;"';
          }
          lista+=`<li ${style}><span>• ${i.nombre}</span><strong style="color:#00ff66;">x${i.cantidad}</strong></li>`;
        });
        lista+='</ul>';
        const nroOrdenNum=String(cmd.nroOrden||0).padStart(3,'0').replace(/[^0-9]/g,'').slice(-3);
        div.innerHTML=`<div class="mesa-hdr-info"><span class="mesa-nombre"><span style="color:#f1c40f;font-family:monospace;">#${nroOrdenNum}</span> ${nombreFijo}</span><small style="color:#ff9900;">${cmd.estado}</small></div>${lista}<div class="${badge}">${txt}</div>`;
      }
      cont.appendChild(div);
    });
  };

  crearTarjetas('gridSalon',['Mesa 1','Mesa 2','Mesa 3','Mesa 4']);
  crearTarjetas('gridVereda',['Mesa 5 Vereda','Mesa 6 Vereda','Mesa 7 Vereda']);
  crearTarjetas('gridCanales',['Mostrador','Pickup','Delivery']);
}

function limpiarDesdeCocina(id){
  if(!confirm(`¿Limpiar ${id}?`)) return;
  const cmd=comandasActivas[id];
  const nombre=cmd.mesa||id;
  const idSeguro=nombre.replace(/[^a-zA-Z0-9]/g,'_');
  db.ref('comandas_activas/'+idSeguro).remove();
}

function dispararAlarma(){ if(!alarmaOn) return; try{const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=880; g.gain.value=0.1; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.2);}catch(e){} }
function toggleAlarma(){alarmaOn=!alarmaOn; document.getElementById('btnAlarma').textContent=alarmaOn?'🔊 ALARMA ON':'🔇 ALARMA OFF';}

setInterval(()=>{document.getElementById('reloj').textContent=new Date().toLocaleTimeString('es-AR'); renderizarPlanoYLateral();},1000);
window.onload=()=>{ iniciarFirebase(); };
</script>
</body>
</html>
