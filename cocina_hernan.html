<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const MAPEO={"Salón - Mesa 1":"Mesa 1","Salón - Mesa 2":"Mesa 2","Salón - Mesa 3":"Mesa 3","Salón - Mesa 4":"Mesa 4","Vereda - Mesa 5":"Mesa 5 Vereda","Vereda - Mesa 6":"Mesa 6 Vereda","Vereda - Mesa 7":"Mesa 7 Vereda","Canal - Mostrador":"Mostrador","Canal - Pickup":"Pickup","Canal - Delivery":"Delivery"};
const NOMBRES={"Mesa 1":"MESA 1","Mesa 2":"MESA 2","Mesa 3":"MESA 3","Mesa 4":"MESA 4","Mesa 5 Vereda":"MESA 5 VEREDA","Mesa 6 Vereda":"MESA 6 VEREDA","Mesa 7 Vereda":"MESA 7 VEREDA","Mostrador":"MOSTRADOR","Pickup":"PICKUP","Delivery":"DELIVERY"};
const MENU_COMPLETO=["Asado","Vacio","Bife de chorizo","Entraña","Chorizo","Morcilla","Chinchulin","Molleja","Milanesa","Papas fritas"];
let comandas={},sel=null,agotadosCache={};
function getNombre(it){return (it.n||it.nombre||it.name||'').toString().trim();}
function getPrecio(it){return it.p||it.precio||0;}
function getCant(it){return parseInt(it.cantidad||it.qty||1);}
function getEstadoItem(it){return (it.estadoItem||'PENDIENTE').toUpperCase();}
const PARRILLA_BASE=['asado','vacio','vacío','bife','entraña','morcilla','chinchulin','chorizo','provoleta','molleja','matambre','bondiola','choripan','morcipan','parrillada','pollo'];
const AGREGADOS_COCINA=['lechuga','tomate','jamon','jamón','queso','huevo','frita','papas'];
const COCINA_PURA=['milanesa','suprema','pechuga','tortilla'];
function descomponerItem(nom){const n=(nom||'').toLowerCase(); if(COCINA_PURA.some(k=>n.includes(k))) return [{texto:nom, estacion:'COCINA'}]; const esParr=PARRILLA_BASE.some(k=>n.includes(k)); const tiene=AGREGADOS_COCINA.some(k=>n.includes(k)); if(esParr&&tiene){const carne=nom.split(/c\/fritas/i)[0].trim(); return [{texto:carne, estacion:'PARRILLA'}, {texto:'FRITAS', estacion:'COCINA', esGuarnicion:true}];} if(esParr) return [{texto:nom, estacion:'PARRILLA'}]; return [{texto:nom, estacion:'COCINA'}];}
function getTipo(items){let p=false,c=false;(items||[]).forEach(it=>{descomponerItem(getNombre(it)).forEach(s=>{if(s.estacion==='PARRILLA') p=true; else c=true;});}); if(p&&c) return 'MIXTA'; if(p) return 'PARRILLA'; return 'COCINA';}

db.ref('comandas_activas').on('value',s=>{
const data=s.val()||{};const nuevo={};
Object.entries(data).forEach(([firebaseKey,cmd])=>{
 if(!cmd.items) return;
 const idV=MAPEO[cmd.mesa]||MAPEO[firebaseKey]||cmd.mesa||firebaseKey;
 if(!NOMBRES[idV]) return;
 if(!nuevo[idV]) nuevo[idV]={id:idV,firebaseKey:firebaseKey,mesa:cmd.mesa||firebaseKey,items:[],estado:(cmd.estado||'RECIBIDO').toUpperCase(),estado_cocina:(cmd.estado_cocina||cmd.estado||'RECIBIDO').toUpperCase(),estado_parrilla:(cmd.estado_parrilla||cmd.estado||'RECIBIDO').toUpperCase(),total_cobrado:cmd.total||cmd.total_cobrado||0,timestamp:cmd.timestamp||cmd.id||Date.now(),timestamp_estado:cmd.timestamp_estado||cmd.timestamp||cmd.id||Date.now(),nroOrden:cmd.id||100};
 (cmd.items||[]).forEach(it=>{
   const nom=getNombre(it);
   if(!nom||nom.toLowerCase().includes('undefined')) return;
   nuevo[idV].items.push({n:nom,nombre:nom,cantidad:getCant(it),p:getPrecio(it),estadoItem:it.estadoItem||'PENDIENTE',cat:it.cat||''});
 });
 nuevo[idV].estado=cmd.estado||nuevo[idV].estado; nuevo[idV].estado_cocina=cmd.estado_cocina||nuevo[idV].estado; nuevo[idV].estado_parrilla=cmd.estado_parrilla||nuevo[idV].estado; nuevo[idV].total_cobrado=cmd.total||nuevo[idV].total_cobrado;
});
comandas=nuevo;render();
});
db.ref('platos_agotados').on('value',s=>{agotadosCache=s.val()||{};});
db.ref('mensajes_chat').limitToLast(30).on('value',snap=>{
 const box=document.getElementById('chatMensajes'); if(!box) return; box.innerHTML=''; const data=snap.val(); if(!data) return;
 Object.values(data).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(m=>{
  const d=document.createElement('div'); d.style.cssText=`background:#222;padding:6px 8px;border-radius:4px;border-left:3px solid #3498db;margin-bottom:4px`; d.innerHTML=`<b>${m.remitente}</b> ${m.hora||''}<br>${m.texto}`; box.appendChild(d);
 }); box.scrollTop=box.scrollHeight;
});
function render(){
 const ids=Object.keys(comandas);document.getElementById('cant').textContent=ids.length;
 const fifo=document.getElementById('listaFIFO');fifo.innerHTML='';
 ids.sort((a,b)=>comandas[a].timestamp-comandas[b].timestamp).forEach(id=>{
  const cmd=comandas[id];const tipo=getTipo(cmd.items);
  const tieneCocina=cmd.items.some(i=>descomponerItem(getNombre(i)).some(s=>s.estacion==='COCINA'));
  if(!tieneCocina) return;
  const pendientesCocina=cmd.items.filter(i=>getEstadoItem(i)!=='MANOS_EN_MESA' && descomponerItem(getNombre(i)).some(s=>s.estacion==='COCINA'));
  const tieneEntregado=cmd.items.some(i=>getEstadoItem(i)==='ENTREGADO_SECTOR' && descomponerItem(getNombre(i)).some(s=>s.estacion==='COCINA'));
  if(pendientesCocina.length===0 &&!tieneEntregado) return;
  const nro=String(cmd.nroOrden).slice(-3);
  const mins=(Date.now()-(cmd.timestamp_estado||cmd.timestamp))/1000/60;
  let alarmClass=''; if(cmd.estado==='RECIBIDO'&&mins>=5) alarmClass=' alarm-recibido'; else if((cmd.estado_cocina||'').includes('PREPARACION')&&mins>=15) alarmClass=' alarm-prep'; else if(tieneEntregado&&mins>=1) alarmClass=' alarm-manos';
  let itemsHTML='';
  cmd.items.forEach(it=>{
    const est=getEstadoItem(it);
    if(est==='MANOS_EN_MESA') return;
    descomponerItem(getNombre(it)).forEach(s=>{
      if(s.estacion==='COCINA'){
        let extra=est==='ENTREGADO_SECTOR'?' entregado-sector':'';
        itemsHTML+=`<div class="item-cocina-resaltado${extra}">• ${s.texto.toUpperCase()} x${it.cantidad||1} ${est==='ENTREGADO_SECTOR'?'✋':''} <small style="font-size:9px">[${est}]</small></div>`;
      }else{
        itemsHTML+=`<div class="item-parrilla-tenue">• ${s.texto} x${it.cantidad||1} (parrilla - ref)</div>`;
      }
    });
  });
  const div=document.createElement('div');div.className=`ticket ${cmd.estado_cocina||cmd.estado} ${alarmClass}`;div.onclick=()=>abrir(id);
  div.innerHTML=`<div style="display:flex;justify-content:space-between"><span><span style="background:#000;color:#f1c40f;border:1px solid #f1c40f;padding:1px 4px;border-radius:4px;font-family:monospace">#${nro}</span> ${id}</span><span class="badge-tipo" style="color:${tipo==='MIXTA'?'#f1c40f':'#00ff66'}">${tipo}</span></div><div style="font-size:10px;color:#aaa;margin:4px 0">${cmd.estado_cocina||cmd.estado} - ${mins.toFixed(1)}min</div>${itemsHTML}`;fifo.appendChild(div);
 });
 const plano=document.getElementById('plano');plano.innerHTML='<div class="plano-grid" id="g"></div>';const g=document.getElementById('g');
 Object.keys(NOMBRES).forEach(id=>{
  const cmd=comandas[id];if(!cmd){const card=document.createElement('div');card.className='mesa-card';card.innerHTML=`<b>${NOMBRES[id]}</b><br><small style="color:#666">Libre</small>`;g.appendChild(card);return;}
  const mins=(Date.now()-(cmd.timestamp_estado||cmd.timestamp))/1000/60; let alarmClass=''; if(cmd.items.some(i=>getEstadoItem(i)==='ENTREGADO_SECTOR')&&mins>=1) alarmClass=' alarm-manos';
  const card=document.createElement('div');card.className=`mesa-card ocupada ${alarmClass}`;card.onclick=()=>abrir(id);
  let lista='';cmd.items.forEach(it=>{if(getEstadoItem(it)==='MANOS_EN_MESA') return; descomponerItem(getNombre(it)).forEach(s=>{if(s.estacion==='COCINA'){lista+=`<li class="item-cocina-resaltado" style="list-style:none">• ${s.texto} x${it.cantidad||1}</li>`;}else{lista+=`<li class="item-parrilla-tenue" style="list-style:none">• ${s.texto} (parrilla)</li>`;}});});
  card.innerHTML=`<div><span style="color:#f1c40f">#${String(cmd.nroOrden).slice(-3)}</span> ${NOMBRES[id]}</div><ul style="margin:6px 0">${lista}</ul>`;g.appendChild(card);
 });
}
function abrir(id){sel=id;const cmd=comandas[id];const tipo=getTipo(cmd.items);document.getElementById('modalTitulo').textContent=id+' - '+tipo;let det=`<b>Estado: ${cmd.estado_cocina||cmd.estado}</b><br>Key FB: ${cmd.firebaseKey}<br><br>`;cmd.items.forEach((it,idx)=>{const est=getEstadoItem(it);const esCocina=descomponerItem(getNombre(it)).some(s=>s.estacion==='COCINA');let estilo=esCocina?'class="item-cocina-resaltado"':'class="item-parrilla-tenue"';det+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span ${estilo}>${getNombre(it)} x${it.cantidad||1} [${est}]</span> ${esCocina&&est==='PENDIENTE'?`<button onclick="marcarItemEntregado(${idx})" style="background:#27ae60;color:#fff;border:none;padding:5px 10px;border-radius:4px;font-size:10px;cursor:pointer">✅ ENTREGAR</button>` : `<span style="font-size:10px;color:${est==='ENTREGADO_SECTOR'?'#f1c40f':'#888'}">${est}</span>`}</div>`;});document.getElementById('modalDetalle').innerHTML=det;document.getElementById('modal').style.display='flex';}
function cerrar(){document.getElementById('modal').style.display='none';}
function marcarItemEntregado(idx){
 if(!sel) return; const cmd=comandas[sel]; const fbKey=cmd.firebaseKey;
 db.ref('comandas_activas/'+fbKey+'/items').once('value').then(snap=>{
   const itemsFB=snap.val()||[];const nombreBuscado=cmd.items[idx].n;let realIdx=itemsFB.findIndex(i=> (i.n||i.nombre)===nombreBuscado && (i.estadoItem||'PENDIENTE')==='PENDIENTE');if(realIdx===-1) realIdx=itemsFB.findIndex(i=> (i.n||i.nombre)===nombreBuscado);
   if(realIdx>=0){db.ref('comandas_activas/'+fbKey+'/items/'+realIdx+'/estadoItem').set('ENTREGADO_SECTOR');db.ref('comandas_activas/'+fbKey+'/items/'+realIdx+'/fechaEntregadoSector').set(Date.now());db.ref('mensajes_chat').push({remitente:'Hernán',texto:`✋ ${sel} - ${nombreBuscado} ENTREGADO A MOZO`,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});}cerrar();
 });
}
function marcarTodosEntregados(){
 if(!sel) return; const fbKey=comandas[sel].firebaseKey;
 db.ref('comandas_activas/'+fbKey+'/items').once('value').then(snap=>{
   const itemsFB=snap.val()||[];let updates={};itemsFB.forEach((it,i)=>{const esCocina=descomponerItem(getNombre(it)).some(s=>s.estacion==='COCINA');if(esCocina && (it.estadoItem||'PENDIENTE')==='PENDIENTE'){updates[i+'/estadoItem']='ENTREGADO_SECTOR';updates[i+'/fechaEntregadoSector']=Date.now();}});db.ref('comandas_activas/'+fbKey+'/items').update(updates);cerrar();
 });
}
function imprimirPendientesModal(){
 if(!sel) return; const cmd=comandas[sel];
 let pendientes=cmd.items.filter(i=>{const esCocina=descomponerItem(getNombre(i)).some(s=>s.estacion==='COCINA');return esCocina && getEstadoItem(i)!=='MANOS_EN_MESA';});
 if(!pendientes.length){alert('Nada para imprimir');return;}
 let html=`<html><head><title>${sel}</title><style>body{font-family:monospace;width:80mm;font-size:14px}.resaltado{font-weight:bold;font-size:16px}.tenue{font-size:10px;color:#888}</style></head><body><h3>COCINA - ${sel}</h3><p>${new Date().toLocaleString('es-AR')}</p><hr>${pendientes.map(i=>`<div class="resaltado">${i.cantidad}x ${i.n||i.nombre} [${getEstadoItem(i)}]</div>`).join('')}<hr><div class="tenue">Ref parrilla: ${cmd.items.filter(i=>descomponerItem(getNombre(i)).some(s=>s.estacion==='PARRILLA')).map(i=>i.n).join(', ')}</div><script>window.onload=()=>{window.print();}<\/script></body></html>`;
 let w=window.open('','','width=400,height=600');w.document.write(html);w.document.close();
}
function setEstado(n){if(!sel) return; const cmd=comandas[sel]; const firebaseKey=cmd.firebaseKey; const ahora=Date.now();db.ref('comandas_activas/'+firebaseKey+'/estado_cocina').set(n);db.ref('comandas_activas/'+firebaseKey+'/timestamp_estado').set(ahora);if(getTipo(cmd.items)==='COCINA'){db.ref('comandas_activas/'+firebaseKey+'/estado').set(n);}cerrar();}
function abrirResumen(){let html='';Object.keys(comandas).forEach(id=>{const c=comandas[id];html+=`• ${id} [${getTipo(c.items)}] ${c.estado_cocina||c.estado} - ${c.items.map(i=>getNombre(i)+'['+getEstadoItem(i)+']').join(', ')}<br>`;});document.getElementById('contenidoResumen').innerHTML=html||'Sin comandas';document.getElementById('modalResumen').style.display='flex';}
function abrirCaja(){db.ref('historial_caja').once('value',s=>{let h='';Object.values(s.val()||{}).slice(0,30).forEach(r=>{h+=`$${r.total||r.total_cobrado} ${r.mesaId||r.mesa||''}<br>`;});document.getElementById('cajaLista').innerHTML=h||'Sin datos';document.getElementById('modalCaja').style.display='flex';});}
function abrirMensajes(){document.getElementById('modalMensajes').style.display='flex';}
function enviarMensaje(){const inp=document.getElementById('inputMensaje');const txt=inp.value.trim();if(!txt)return;db.ref('mensajes_chat').push({remitente:'Hernán',texto:txt,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});inp.value='';}
function abrirAgotar(){const cont=document.getElementById('listaAgotar');cont.innerHTML='';MENU_COMPLETO.forEach(plato=>{const esta=!!agotadosCache[plato];const d=document.createElement('div');d.style.cssText=`padding:10px;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid ${esta?'#c0392b':'#333'};background:${esta?'#3a1212':'#1e1e1e'};color:${esta?'#ff6b6b':'#fff'};text-align:center`;d.textContent=(esta?'❌ ':'')+plato;d.onclick=()=>{if(esta) db.ref('platos_agotados/'+plato).remove();else db.ref('platos_agotados/'+plato).set({timestamp:Date.now(),por:'Hernán'});};cont.appendChild(d);});document.getElementById('modalAgotar').style.display='flex';}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal') cerrar();});
document.addEventListener('keydown',e=>{if(e.key==='Escape') cerrar();});
setInterval(render,1000);
</script></body></html>
