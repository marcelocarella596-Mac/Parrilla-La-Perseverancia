<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCINA HERNÁN - JEFE - COMPLETO FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0e0e0e;color:#fff;padding:8px}
header{background:linear-gradient(90deg,#b03a2e,#d35400);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.btn{border:none;padding:7px 12px;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer;color:#fff;background:#000;border:1px solid #555}
.btn-rojo{background:#c0392b;border-color:#e74c3c}
.layout{display:grid;grid-template-columns:380px 1fr;gap:10px;margin-top:10px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}}
.panel{background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:10px}
.panel-titulo{color:#ff9900;font-size:11px;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between}
.ticket{background:#1c1c1c;border-left:4px solid #00ff66;border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}
.ticket.PREPARACION{border-left-color:#e67e22;background:#2a2011}
.ticket.MANOS{border-left-color:#27ae60;background:#112a18}
.ticket.RECIBIDO{border-left-color:#2980b9}
.badge-tipo{font-size:8px;padding:2px 6px;border-radius:10px;border:1px solid;font-weight:bold}
.tachado{text-decoration:line-through;opacity:0.35}
.guarnicion{background:rgba(39,174,96,0.25);border-left:3px solid #27ae60;padding:1px 5px;border-radius:3px;font-weight:900;color:#fff!important}
.solo-parrilla{opacity:0.5;border-style:dashed!important}
.plano-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.mesa-card{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:8px;min-height:130px;cursor:pointer}
.mesa-card.ocupada{border-color:#00ff66;background:#122a18}
.mesa-card.solo-parrilla{border-color:#ff3d00;background:#2a1412;opacity:0.6}
.timer{background:#000;border:1px solid #00ff66;color:#00ff66;text-align:center;padding:3px;border-radius:4px;font-family:monospace;font-size:11px;margin-top:6px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);display:none;justify-content:center;align-items:center;z-index:9999}
.modal{background:#181818;border:1px solid #444;border-radius:10px;padding:18px;width:95%;max-width:420px;text-align:center}
.btn-estado{width:100%;padding:12px;margin-bottom:8px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;color:#fff;font-size:12px}
</style>
</head>
<body>
<header>
<div><b>🔥 LA PERSEVERANCIA</b> <span style="font-size:11px;opacity:.8">| COCINA HERNÁN - JEFE</span></div>
<div style="display:flex;gap:6px">
<button class="btn" onclick="abrirResumen()">📋 RESUMEN</button>
<button class="btn btn-rojo" onclick="abrirAgotar()">🚫 AGOTAR (86)</button>
<span style="font-size:11px;color:#00ff66;border:1px solid #00ff66;padding:5px 8px;border-radius:5px">• ACTIVA - VE TODO</span>
</div>
</header>

<div class="layout">
<div class="panel">
<div class="panel-titulo"><span>ÍTEMS COCINA (FIFO) - TOCA PARA ESTADO</span><span id="cant">0</span></div>
<div id="listaFIFO"></div>
</div>
<div class="panel">
<div class="panel-titulo"><span>📍 PLANO - VE TODO (PARRILLA TACHADA INFORMATIVA)</span></div>
<div id="plano"></div>
</div>
</div>

<!-- MODAL ESTADOS -->
<div class="modal-overlay" id="modal"><div class="modal">
<h3 id="modalTitulo" style="color:#00ff66;margin-bottom:8px"></h3>
<div id="modalDetalle" style="font-size:11px;text-align:left;background:#111;padding:8px;border-radius:6px;margin-bottom:10px"></div>
<button class="btn-estado" style="background:#2980b9" onclick="setEstado('RECIBIDO')">📥 RECIBIDO</button>
<button class="btn-estado" style="background:#d35400" onclick="setEstado('PREPARACION')">🔥 PREPARACIÓN</button>
<button class="btn-estado" style="background:#27ae60" onclick="setEstado('MANOS')">🖐️ MANOS / LISTO</button>
<hr style="margin:10px 0;border-color:#333">
<button class="btn-estado" style="background:#c0392b" onclick="borrar()">🗑️ LIMPIAR / ENTREGADO</button>
<button class="btn-estado" style="background:#333" onclick="cerrar()">CANCELAR</button>
</div></div>

<!-- MODAL RESUMEN -->
<div class="modal-overlay" id="modalResumen"><div class="modal" style="max-width:550px;text-align:left">
<h3 style="color:#ff9900;margin-bottom:10px">📋 RESUMEN JEFE COCINA</h3>
<div id="contenidoResumen" style="font-size:12px;background:#111;padding:10px;border-radius:6px;max-height:60vh;overflow-y:auto"></div>
<button class="btn-estado" style="background:#333;margin-top:10px" onclick="document.getElementById('modalResumen').style.display='none'">CERRAR</button>
</div></div>

<!-- MODAL AGOTAR -->
<div class="modal-overlay" id="modalAgotar"><div class="modal" style="max-width:550px;text-align:left">
<h3 style="color:#e74c3c;margin-bottom:8px">🚫 AGOTAR STOCK (86) - JEFE</h3>
<p style="font-size:11px;color:#aaa;margin-bottom:8px">Toca para agotar. Se bloquea en Mariana y aparece tachado en cocina/parrilla.</p>
<div id="listaAgotar" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:60vh;overflow-y:auto"></div>
<button class="btn-estado" style="background:#333;margin-top:10px" onclick="document.getElementById('modalAgotar').style.display='none'">CERRAR</button>
</div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54",storageBucket:"parrilla-la-perseveranci-f3f54.firebasestorage.app",messagingSenderId:"899082319184",appId:"1:899082319184:web:9876161963705785efe855"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const MAPEO={"Salón - Mesa 1":"Mesa 1","Salón - Mesa 2":"Mesa 2","Salón - Mesa 3":"Mesa 3","Salón - Mesa 4":"Mesa 4","Vereda - Mesa 5":"Mesa 5 Vereda","Vereda - Mesa 6":"Mesa 6 Vereda","Vereda - Mesa 7":"Mesa 7 Vereda","Canal - Mostrador":"Mostrador","Canal - Pickup":"Pickup","Canal - Delivery":"Delivery"};
const NOMBRES={"Mesa 1":"MESA 1","Mesa 2":"MESA 2","Mesa 3":"MESA 3","Mesa 4":"MESA 4","Mesa 5 Vereda":"MESA 5 VEREDA","Mesa 6 Vereda":"MESA 6 VEREDA","Mesa 7 Vereda":"MESA 7 VEREDA","Mostrador":"MOSTRADOR","Pickup":"PICKUP","Delivery":"DELIVERY"};
const MENU_COMPLETO=["Asado 1/2","Asado c/fritas","Vacio","Bife de chorizo","Entraña","Chorizo","Morcilla","Chinchulin","Molleja","Provoleta","Milanesa","Milanesa napolitana","Milanesa napo c/fritas","Fritas","Papas","Papas fritas","Ensalada Mixta","Ensalada Completa","Puré","Matambre"];
let comandas={}, sel=null, agotadosCache={};
const keysParrilla=['asado','vacio','bife','entraña','morcilla','chinchulin','chorizo','provoleta','molleja','costillar','matambre','chori'];
function esParrilla(n){return keysParrilla.some(k=>n.toLowerCase().includes(k));}
function esGuarnicion(n){const t=n.toLowerCase();return t.includes('frita')||t.includes('ensalada')||t.includes('papas')||t.includes('pure');}
function getTipo(items){const p=items.some(i=>esParrilla(i.nombre)&&!esGuarnicion(i.nombre));const c=items.some(i=>!esParrilla(i.nombre)||esGuarnicion(i.nombre));if(p&&c) return 'MIXTA';if(p) return 'PARRILLA';return 'COCINA';}

db.ref('comandas_activas').on('value',s=>{
const data=s.val()||{};const nuevo={};
Object.values(data).forEach(cmd=>{
if(!cmd.mesa) return;const idV=MAPEO[cmd.mesa]||cmd.mesa;if(!NOMBRES[idV]) return;
if(!nuevo[idV]) nuevo[idV]={id:idV,mesa:cmd.mesa,items:[],estado:(cmd.estado||'RECIBIDO').toUpperCase().replace('PENDIENTE','RECIBIDO'),timestamp:cmd.timestamp||Date.now(),nroOrden:cmd.nroOrden||Math.floor(Math.random()*900+100)};
(cmd.items||[]).forEach(it=>{if(!it.nombre||it.nombre.toLowerCase().includes('undefined')) return;const ex=nuevo[idV].items.find(x=>x.nombre===it.nombre);if(ex) ex.cantidad+=parseInt(it.cantidad||1);else nuevo[idV].items.push({nombre:it.nombre,cantidad:parseInt(it.cantidad||1)});});
});
comandas=nuevo;render();
});
db.ref('platos_agotados').on('value',s=>{agotadosCache=s.val()||{};render();});

function render(){
const ids=Object.keys(comandas);document.getElementById('cant').textContent=ids.length;
const fifo=document.getElementById('listaFIFO');fifo.innerHTML='';
ids.sort((a,b)=>comandas[a].timestamp-comandas[b].timestamp).forEach(id=>{
const cmd=comandas[id];const tipo=getTipo(cmd.items);const nro=String(cmd.nroOrden).slice(-3);
let items='';cmd.items.forEach(it=>{
let cls='';let agotado=!!agotadosCache[it.nombre];
if(tipo==='PARRILLA') cls='tachado';
else if(tipo==='MIXTA'){if(esParrilla(it.nombre)&&!esGuarnicion(it.nombre)) cls='tachado';else if(esGuarnicion(it.nombre)) cls='guarnicion';}
if(agotado) cls+=' tachado';
items+=`<div class="${cls}" style="display:flex;justify-content:space-between;font-size:12px"><span>• ${it.nombre} ${agotado?'❌ AGOTADO':''} ${tipo==='PARRILLA'?'🔒':''}</span><b style="color:#00ff66">x${it.cantidad}</b></div>`;
});
const div=document.createElement('div');div.className=`ticket ${cmd.estado} ${tipo==='PARRILLA'?'solo-parrilla':''}`;div.onclick=()=>abrir(id);
div.innerHTML=`<div style="display:flex;justify-content:space-between"><span><span style="background:#000;color:#f1c40f;border:1px solid #f1c40f;padding:1px 4px;border-radius:4px;font-family:monospace">#${nro}</span> ${id}</span><span class="badge-tipo" style="color:${tipo==='PARRILLA'?'#ff3d00':tipo==='MIXTA'?'#f1c40f':'#00ff66'};border-color:${tipo==='PARRILLA'?'#ff3d00':tipo==='MIXTA'?'#f1c40f':'#00ff66'}">${tipo==='PARRILLA'?'🔒 '+tipo:tipo==='MIXTA'?'🔀 '+tipo:'🍳 '+tipo}</span></div><div style="font-size:10px;color:#aaa;margin:4px 0">${cmd.estado}</div>${items}`;
fifo.appendChild(div);
});
const plano=document.getElementById('plano');plano.innerHTML='<div class="plano-grid" id="g"></div>';const g=document.getElementById('g');
Object.keys(NOMBRES).forEach(id=>{
const cmd=comandas[id];const tipo=cmd?getTipo(cmd.items):null;
const card=document.createElement('div');card.className=`mesa-card ${cmd?'ocupada':''} ${tipo==='PARRILLA'?'solo-parrilla':''}`;card.onclick=()=>{if(cmd) abrir(id);};
if(!cmd){card.innerHTML=`<b>${NOMBRES[id]}</b><br><small style="color:#666">Libre</small>`;}
else{
const nro=String(cmd.nroOrden).slice(-3);const seg=Math.floor((Date.now()-cmd.timestamp)/1000);const mm=String(Math.floor(seg/60)).padStart(2,'0');const ss=String(seg%60).padStart(2,'0');
let lista='';cmd.items.forEach(it=>{
let style='';if(tipo==='PARRILLA') style='text-decoration:line-through;opacity:0.4';
else if(tipo==='MIXTA'&&esParrilla(it.nombre)&&!esGuarnicion(it.nombre)) style='text-decoration:line-through;opacity:0.4';
else if(esGuarnicion(it.nombre)) style='font-weight:900;color:#fff;background:rgba(39,174,96,0.2);padding:1px 3px;border-radius:3px';
if(agotadosCache[it.nombre]) style='text-decoration:line-through;color:#ff0000';
lista+=`<li style="${style}">• ${it.nombre} x${it.cantidad} ${tipo==='PARRILLA'?'🔒':''}</li>`;
});
card.innerHTML=`<div style="display:flex;justify-content:space-between"><span><span style="color:#f1c40f">#${nro}</span> ${NOMBRES[id]}</span><span class="badge-tipo" style="color:${tipo==='PARRILLA'?'#ff3d00':tipo==='MIXTA'?'#f1c40f':'#00ff66'};border-color:${tipo==='PARRILLA'?'#ff3d00':tipo==='MIXTA'?'#f1c40f':'#00ff66'}">${tipo}</span></div><div style="font-size:10px;color:#00ff66">${cmd.estado}</div><ul style="list-style:none;font-size:11px;margin:4px 0">${lista}</ul><div class="timer">${mm}:${ss}</div>`;
}
g.appendChild(card);
});
}

function abrir(id){
sel=id;const cmd=comandas[id];const tipo=getTipo(cmd.items);
if(tipo==='PARRILLA'){
document.getElementById('modalTitulo').textContent=id+' - 🔒 SOLO PARRILLA (Informativo)';
document.getElementById('modalDetalle').innerHTML=`Esta comanda es solo de parrilla.<br><br><b>Vista informativa para coordinación:</b><br>${cmd.items.map(i=>`• ${i.nombre} x${i.cantidad}`).join('<br>')}<br><br><span style="color:#ff3d00">No se puede gestionar desde cocina. La gestiona Gustavo.</span>`;
document.getElementById('modal').style.display='flex';
setTimeout(()=>{document.querySelectorAll('#modal.btn-estado').forEach(b=>{if(!b.textContent.includes('CANCELAR')) b.style.opacity='0.3';});},0);
return;
}
document.querySelectorAll('#modal.btn-estado').forEach(b=>b.style.opacity='1');
document.getElementById('modalTitulo').textContent=id+' - '+tipo;
let det=`<b>Estado: ${cmd.estado}</b><br><br>`;cmd.items.forEach(it=>{det+=`• ${it.nombre} x${it.cantidad}<br>`;});
document.getElementById('modalDetalle').innerHTML=det;
document.getElementById('modal').style.display='flex';
}
function cerrar(){document.getElementById('modal').style.display='none';}
function setEstado(n){if(!sel) return;const t=getTipo(comandas[sel].items);if(t==='PARRILLA') return;const idSeguro=comandas[sel].mesa.replace(/[^a-zA-Z0-9]/g,'_');db.ref('comandas_activas/'+idSeguro+'/estado').set(n);db.ref('comandas_activas/'+idSeguro+'/timestamp').set(Date.now());cerrar();}
function borrar(){if(!sel) return;const t=getTipo(comandas[sel].items);if(t==='PARRILLA'){alert('No podés limpiar comandas puras de parrilla desde cocina');return;}if(!confirm('¿Limpiar '+sel+'?')) return;const idSeguro=comandas[sel].mesa.replace(/[^a-zA-Z0-9]/g,'_');db.ref('comandas_activas/'+idSeguro).remove();cerrar();}

function abrirResumen(){
const ids=Object.keys(comandas);let fritas=0,ens=0,dem=0;let porTipo={COCINA:0,PARRILLA:0,MIXTA:0};let porEst={RECIBIDO:0,PREPARACION:0,MANOS:0};
ids.forEach(id=>{const cmd=comandas[id];const tipo=getTipo(cmd.items);porTipo[tipo]++;porEst[cmd.estado]++;const seg=Math.floor((Date.now()-cmd.timestamp)/1000);if(seg>900) dem++;cmd.items.forEach(it=>{if(it.nombre.toLowerCase().includes('frita')) fritas+=it.cantidad;if(it.nombre.toLowerCase().includes('ensalada')) ens+=it.cantidad;});});
let html=`<b>Total:</b> ${ids.length} | <b>🍳</b> ${porTipo.COCINA} <b>🔥</b> ${porTipo.PARRILLA} <b>🔀</b> ${porTipo.MIXTA}<br><b>Estados:</b> 📥${porEst.RECIBIDO||0} 🔥${porEst.PREPARACION||0} 🖐️${porEst.MANOS||0}<br><b>Demoradas +15:</b> <span style="color:${dem>0?'red':'#0f0'}">${dem}</span><br><b>🍟</b> ${fritas} | <b>🥗</b> ${ens}<br><br>`;
ids.sort((a,b)=>comandas[a].timestamp-comandas[b].timestamp).forEach(id=>{const c=comandas[id];const s=Math.floor((Date.now()-c.timestamp)/1000);const m=String(Math.floor(s/60)).padStart(2,'0');const ss=String(s%60).padStart(2,'0');html+=`• <b>${id}</b> [${getTipo(c.items)}] ${c.estado} ${m}:${ss} - ${c.items.map(i=>i.nombre).join(', ')}<br>`;});
if(ids.length===0) html+='Sin comandas';
document.getElementById('contenidoResumen').innerHTML=html;
document.getElementById('modalResumen').style.display='flex';
}
function abrirAgotar(){
const cont=document.getElementById('listaAgotar');cont.innerHTML='';
MENU_COMPLETO.forEach(plato=>{
const esta=!!agotadosCache[plato];
const d=document.createElement('div');
d.style.cssText=`padding:10px;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid ${esta?'#c0392b':'#333'};background:${esta?'#3a1212':'#1e1e1e'};color:${esta?'#ff6b6b':'#fff'};text-align:center`;
d.textContent=(esta?'❌ ':'')+plato;
d.onclick=()=>toggleAgotar(plato,esta);
cont.appendChild(d);
});
document.getElementById('modalAgotar').style.display='flex';
}
function toggleAgotar(plato,esta){
if(esta) db.ref('platos_agotados/'+plato).remove();
else db.ref('platos_agotados/'+plato).set({timestamp:Date.now(),por:'Hernán'});
setTimeout(abrirAgotar,300);
}
setInterval(render,1000);
</script>
</body>
</html>
