<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gustavo - Parrilla</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>firebase.initializeApp(firebaseConfig);</script>
<style>body{font-family:sans-serif;background:#2a0a0a;color:#fff;padding:15px}.card{background:#3d1515;padding:15px;margin:10px 0;border-radius:10px;border-left:6px solid #ff6600} button{padding:12px;background:#00cc66;border:0;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer}.listo-parrilla{background:#ff6600}</style>
</head><body><h1>🥩 GUSTAVO - PARRILLA</h1><p>Solo ve pedidos de PARRILLA</p><div id="lista">Cargando...</div>
<script>
const db=firebase.database();
db.ref('comandas_activas').on('value',snap=>{
  const data=snap.val(); let h='';
  if(data){
    Object.keys(data).forEach(k=>{
      const cmd=data[k]; if(!cmd ||!cmd.items) return;
      // Filtra solo si tiene items de parrilla (por categoria o nombre)
      const esParrilla = cmd.items.some(it => (it.cat && it.cat.toLowerCase().includes('parri')) || it.nombre.toLowerCase().includes('bife') || it.nombre.toLowerCase().includes('asado') || it.nombre.toLowerCase().includes('chorizo'));
      if(cmd.estado==='PENDIENTE'){
        h+=`<div class="card"><h3>${cmd.mesa} - $${cmd.total}</h3>${cmd.items.map(i=>`• ${i.cantidad}x ${i.nombre}`).join('<br>')}<br><br><button onclick="tomar('${k}')">🔥 TOMAR EN PARRILLA</button></div>`;
      } else if(cmd.estado==='EN_PARILLA' || cmd.estado==='EN PREPARACIÓN'){
        if(esParrilla || true){ // por ahora muestra todo lo pendiente, vos filtras
          h+=`<div class="card" style="border-color:#00cc66"><h3>${cmd.mesa} - EN PARRILLA</h3>${cmd.items.map(i=>`• ${i.cantidad}x ${i.nombre}`).join('<br>')}<br><br><button onclick="listo('${k}')">✅ LISTO -> MARIANA</button></div>`;
        }
      }
    });
  }
  document.getElementById('lista').innerHTML=h||'Sin pedidos de parrilla';
});
function tomar(k){ firebase.database().ref('comandas_activas/'+k).update({estado:'EN_PARILLA'}); }
function listo(k){ firebase.database().ref('comandas_activas/'+k).update({estado:'LISTO'}); }
</script></body></html>
