const PARRILLA_KEYS=['asado','vacio','vacío','bife','entraña','bondiola','chorizo','morcilla','chinchulin','molleja','matambre','pollo','costillita','ojo','tira','parrillada','riñon','riñones','choripan','morcipan'];

function descomponerItem(nom, cat){
 const n=(nom||'').toLowerCase();
 const c=(cat||'').toLowerCase();
 // 1. parrilla directa
 if(c==='parrilla') return [{texto:nom, estacion:'PARRILLA'}];
 // 2. minuta -> cocina
 if(c==='minuta') return [{texto:nom, estacion:'COCINA'}];
 // 3. sandwich
 if(c==='sandwich'){
   const esParr=PARRILLA_KEYS.some(k=>n.includes(k));
   const esMixto=MIXTO_KEYS.some(k=>n.includes(k));
   if(esParr && esMixto){
     // ej Bondiola completa, Vacío c/ jamon y queso -> mixto
     const carne=nom.split(/completa|c\/fritas|c\/jamon|c\/queso/i)[0].trim();
     return [{texto:carne||nom, estacion:'PARRILLA'}, {texto:'GUARNICION COMPLETA', estacion:'COCINA', esGuarnicion:true}];
   }
   if(esParr) return [{texto:nom, estacion:'PARRILLA'}];
   return [{texto:nom, estacion:'COCINA'}];
 }
 // 4. resto -> cocina
 if(['bebida','cerveza','vino','ensalada','guarnicion','postre','adicional'].includes(c)) return [{texto:nom, estacion:'COCINA'}];
 // fallback por nombre
 if(PARRILLA_KEYS.some(k=>n.includes(k))) return [{texto:nom, estacion:'PARRILLA'}];
 return [{texto:nom, estacion:'COCINA'}];
}
function getTipo(items){
 let p=false,c=false;
 (items||[]).forEach(it=>{
   descomponerItem(getNombre(it), it.cat).forEach(s=>{

   });
 });
 if(p&&c) return 'MIXTA'; if(p) return 'PARRILLA'; return 'COCINA';
}

   Object.entries(raw).forEach(([k,v])=>{ if(v&&v.mesa) fix[v.mesa]=v; else { const found=MESAS.find(m=>limpiarKey(m)===k); if(found) fix[found]=v; else if(MESAS.includes(k)) fix[k]=v; } });
   comandas=fix; renderPlano();
   document.getElementById('bFirebase').innerText='CONECTADO - '+Object.keys(comandas).length+' activas - 93 items';
   document.getElementById('bFirebase').className='badge green';
 });
 db.ref('mensajes').limitToLast(20).on('value', renderMsgs);
 document.addEventListener('click',initAudio,{once:true});
 setInterval(checkAlarmas,4000);
}
function renderMsgs(snap){const msgs=snap.val()||{}; const cont=document.getElementById('msgs');cont.innerHTML='';Object.values(msgs).reverse().forEach(m=>{const d=document.createElement('div');d.style.cssText='font-size:10px;padding:4px;border-left:3px solid '+(m.emisor==='Gustavo'?'#ff9900':'#c0392b')+';margin-bottom:4px;background:#111';d.innerHTML=`<b style="color:${m.emisor==='Gustavo'?'#ff9900':'#c0392b'}">${m.emisor||'?'}</b> <span style="color:#666;font-size:8px">${m.hora||''}</span><br>${m.texto}`;cont.appendChild(d);});}
function renderTabs(){const c=document.getElementById('tabs');c.innerHTML='';CATS.forEach(cat=>{const d=document.createElement('div');d.className='tab'+(filtro===cat.id?' active':'');d.innerText=cat.n;d.onclick=()=>{filtro=cat.id;renderTabs();renderMenu();};c.appendChild(d);});}
function filtrarBus(){busca=document.getElementById('bus').value.toLowerCase();renderMenu();}
function renderMenu(){const g=document.getElementById('grid');g.innerHTML='';MENU.filter(m=>{const okCat=filtro==='todos'||m.cat===filtro;const okBus=!busca||m.n.toLowerCase().includes(busca);return okCat&&okBus;}).forEach(m=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<b>${m.n}</b><i>${m.sub}</i><span>$${m.p.toLocaleString()}</span>`;d.onclick=()=>add(m);g.appendChild(d);});}
function add(m){sel.push({...m, cantidad:1});renderSel();}
function renderSel(){const cont=document.getElementById('sel');if(sel.length===0){cont.innerHTML='No hay items';document.getElementById('total').innerText='$0';return;}let tot=0,h='';sel.forEach((s,i)=>{tot+=s.p*(s.cantidad||1);h+=`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1a1a1a;font-size:11px"><span>${i+1}x ${s.n} <i style="color:#888">(${s.cat})</i></span><span style="color:#ff9900">$${s.p.toLocaleString()} <b onclick="sel.splice(${i},1);renderSel()" style="color:#c0392b;cursor:pointer;padding:0 4px">x</b></span></div>`;});cont.innerHTML=h;document.getElementById('total').innerText='$'+tot.toLocaleString();}
function limpiar(){sel=[];renderSel();}
function enviar(){
 if(sel.length===0)return;
 db.ref('comandas_activas/'+mesaSel).once('value').then(snap=>{
  const ex=snap.val();
  const nuevo=sel.map(s=>({n:s.n,nombre:s.n,cantidad:s.cantidad||1,p:s.p,precio:s.p,cat:s.cat,sub:s.sub}));
  let itemsFinal=nuevo;
  if(ex && ex.items){
    const mapa={}; ex.items.forEach(i=>{mapa[getNombre(i)]={...i, n:getNombre(i),nombre:getNombre(i),cantidad:getCant(i),p:getPrecio(i),precio:getPrecio(i),cat:i.cat||''}});
    nuevo.forEach(n=>{const nom=getNombre(n); if(mapa[nom]) mapa[nom].cantidad+=getCant(n); else mapa[nom]=n;});
    itemsFinal=Object.values(mapa);
  }
  const ahora=Date.now();
  const data={
    mesa:mesaSel,
    items:itemsFinal,
    total:itemsFinal.reduce((a,c)=>a+(getPrecio(c)*getCant(c)),0),
    total_cobrado:ex?ex.total_cobrado||ex.total:itemsFinal.reduce((a,c)=>a+(getPrecio(c)*getCant(c)),0),
    estado:ex?ex.estado:'RECIBIDO',
    estado_parrilla:ex?ex.estado_parrilla||ex.estado:'RECIBIDO',
    estado_cocina:ex?ex.estado_cocina||ex.estado:'RECIBIDO',
    emisor:'Gustavo',
    hora:new Date().toLocaleTimeString().slice(0,5),
    timestamp:ex?ex.timestamp:ahora,
    timestamp_estado:ahora,
    id:ex?ex.id:ahora
  };
  db.ref('comandas_activas/'+mesaSel).set(data);
  db.ref('mensajes').push({emisor:'Gustavo',texto:`🔥 ${mesaSel} -> ${nuevo.map(i=>i.n+'('+i.cat+')').join(', ')} $${data.total.toLocaleString()}`,hora:new Date().toLocaleTimeString().slice(0,5),ts:Date.now(),destino:'todos'});
  sel=[];renderSel();
 });
}

function renderPlano(){
 const p=document.getElementById('plano');p.innerHTML='';let act=0,mix=0;
 MESAS.forEach(nom=>{
  const c=comandas[nom];
  const ocup=!!c;
  if(ocup){act++; if(getTipo(c.items)==='MIXTA') mix++;}
  const ep=(c? (c.estado_parrilla||c.estado||'RECIBIDO') : '').toUpperCase();
  let cls='mesa '+(ocup?(c.estado==='COBRADA'?'cobrada':(getTipo(c.items||[])==='MIXTA'?'mixta':'ocupada')):'libre');
  if(c && c.estado!=='COBRADA'){
    const mins=(Date.now()-(c.timestamp_estado||c.timestamp||Date.now()))/1000/60;
    if(ep==='RECIBIDO'&&mins>=5) cls+=' alarm-recibido';
    else if(ep.includes('PREP')&&mins>=15) cls+=' alarm-prep';
    else if(ep.includes('MANOS')&&mins>=1.5) cls+=' alarm-manos';
  }
  const d=document.createElement('div'); d.className=cls;
  if(ocup){
    let html='';
    (c.items||[]).forEach(it=>{
      const des=descomponerItem(getNombre(it), it.cat);
      des.forEach(sub=>{
        if(sub.estacion==='PARRILLA'){
          html+=`<div class="tag-parrilla">🔥 ${getCant(it)}x ${sub.texto}</div>`;
        } else if(getTipo(c.items)==='MIXTA'){
          // En mixta mostramos que va a cocina pero apagado
          html+=`<div class="tag-cocina-off">🍳 ${sub.texto} -> COCINA</div>`;
        }
      });
    });
    // Si es solo cocina, mostrar que no tiene parrilla
    if(!html || getTipo(c.items)==='COCINA'){
      html=`<div class="tag-cocina-off">Solo COCINA (no parrilla)<br>${(c.items||[]).map(i=>getNombre(i)).join('<br>')}</div>`;
    }
    d.innerHTML=`<h4>${nom.toUpperCase()} <span style="font-size:8px;background:#000;padding:2px 5px;border-radius:4px">${getTipo(c.items)} - ${ep.slice(0,4)}</span></h4>${html}<div class="pr">$${(c.total_cobrado||c.total||0).toLocaleString()}</div><div style="font-size:8px;color:#888;margin-top:4px">${c.hora||''} | ${Math.floor((Date.now()-(c.timestamp||Date.now()))/1000/60)}min</div>`;
  } else {
    d.innerHTML=`<h4>${nom.toUpperCase()} <span style="color:#555">LIBRE</span></h4><p>Disponible</p>`;
  }
  d.onclick=()=>{mesaSel=nom;document.getElementById('ubic').value=nom; abrirMesa(nom);};
  p.appendChild(d);
 });
 document.getElementById('bAct').innerText='Activas: '+act;
 document.getElementById('bMix').innerText='Mixtas: '+mix;
 document.getElementById('cPend').innerText=act;
 const fifo=document.getElementById('fifo');
 const pend=Object.entries(comandas).filter(([k,v])=>{const t=getTipo(v.items||[]); return t==='PARRILLA'||t==='MIXTA';});
 if(pend.length===0) fifo.innerHTML='Sin pendientes parrilla';
 else fifo.innerHTML=pend.map(([k,v])=>{
   const soloParr=(v.items||[]).filter(it=>descomponerItem(getNombre(it),it.cat).some(s=>s.estacion==='PARRILLA')).map(i=>getNombre(i)).join('<br>');
   return `<div class="fifo-item"><b>#${(v.id||0).toString().slice(-4)} ${k} - ${v.estado_parrilla||v.estado}</b><div style="font-size:11px;font-weight:800;color:#ff9900">${soloParr}</div><div style="color:#2ecc71;font-weight:900">$${(v.total_cobrado||v.total||0).toLocaleString()}</div></div>`;
 }).join('');
}

function abrirMesa(mesa){
 mesaSel=mesa;
 const cmd=comandas[mesa];
 document.getElementById('mTitulo').textContent=mesa;
 if(!cmd){ document.getElementById('mInfo').innerHTML='Mesa libre'; document.getElementById('mItems').innerHTML=''; document.getElementById('mEstadoParr').textContent='-'; document.getElementById('modalMesa').style.display='flex'; return; }
 const ep=(cmd.estado_parrilla||cmd.estado||'RECIBIDO').toUpperCase();
 document.getElementById('mEstadoParr').innerHTML=`<b style="color:#ff9900">${ep}</b>`;
 document.getElementById('mInfo').innerHTML=`TIPO: <b>${getTipo(cmd.items)}</b> | Total: $${(cmd.total_cobrado||cmd.total||0).toLocaleString()} | ${new Date(cmd.timestamp||Date.now()).toLocaleTimeString()}<br>LOGICA: Parrilla=parrilla | Sandwich parrilla+jamón/queso/tomate/lechuga=MIXTO | Minuta=Cocina`;

 let html='';
 (cmd.items||[]).forEach(it=>{
   const des=descomponerItem(getNombre(it), it.cat);
   des.forEach(sub=>{
     if(sub.estacion==='PARRILLA'){
       if(getTipo(cmd.items)==='MIXTA' && des.length>1){
         html+=`<div class="tag-mixta">⭐ MIXTO - 🔥 ${getCant(it)}x ${sub.texto} (PARRILLA) + resto COCINA</div>`;
       } else {
         html+=`<div class="tag-parrilla">🔥 ${getCant(it)}x ${sub.texto}</div>`;
       }
     } else {
       if(getTipo(cmd.items)!=='PARRILLA') html+=`<div class="tag-cocina-off">🍳 ${sub.texto} -> COCINA</div>`;
     }
   });
 });
 document.getElementById('mItems').innerHTML=html||'Sin parrilla';
 document.getElementById('modalMesa').style.display='flex';
}

function setEstadoParrilla(nuevo){
 const cmd=comandas[mesaSel]; if(!cmd) return;
 db.ref('comandas_activas/'+mesaSel).update({estado_parrilla:nuevo, estado:nuevo, timestamp_estado:Date.now()});
 db.ref('mensajes').push({emisor:'Gustavo',texto:`🔥 ${mesaSel} PARRILLA -> ${nuevo}`,hora:new Date().toLocaleTimeString().slice(0,5),ts:Date.now(),destino:'todos'});
}

function cobrar(nom){
 if(!comandas[nom]) return alert('Sin comanda');
 const cmd=comandas[nom];
 const totalFijo=cmd.total_cobrado||cmd.total||0;
 const propStr=prompt(`COBRAR ${nom}\n\nTotal FIJO (no editable): $${totalFijo.toLocaleString()}\n\nSolo ingresá PROPINA:`, cmd.propina||0);
 if(propStr===null) return;
 const prop=parseInt(propStr||0);
 db.ref('comandas_activas/'+nom).update({estado:'COBRADA', total_cobrado:totalFijo, propina:prop, timestamp_estado:Date.now()});
 if(prop>0) db.ref('propinas_dia').push({mesa:nom,monto:prop,timestamp:Date.now(),cajero:'Gustavo'});
 db.ref('ventas').push({...cmd, cobradaEn:Date.now(), cobradaPor:'Gustavo', total_cobrado:totalFijo, propina:prop});
 db.ref('mensajes').push({emisor:'Gustavo',texto:`✅ ${nom} COBRADA $${totalFijo.toLocaleString()} Propina $${prop}`,hora:new Date().toLocaleTimeString().slice(0,5),ts:Date.now(),destino:'todos'});
 cerrarModal();
}
function cobrarSel(){if(comandas[mesaSel]) cobrar(mesaSel); else alert('Seleccioná mesa');}
function sendMsg(){const i=document.getElementById('msg');if(!i.value.trim())return;db.ref('mensajes').push({emisor:'Gustavo',texto:i.value.trim(),hora:new Date().toLocaleTimeString().slice(0,5),ts:Date.now(),destino:'todos'});i.value='';}
function toggleQR(){const p=document.getElementById('panelQR');p.style.display=p.style.display==='none'?'block':'none';generarQR();}
function generarQR(){const url=document.getElementById('inputPdfUrl').value.trim();if(!url)return;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:url,width:180,height:180,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});document.getElementById('pdfViewer').src=url;}
function descargarQR(){const c=document.querySelector('#qrcode canvas');if(!c)return alert('Generá QR');const a=document.createElement('a');a.download='qr_menu.png';a.href=c.toDataURL('image/png');a.click();}
function cerrarModal(){document.getElementById('modalMesa').style.display='none';}
function checkAlarmas(){
 Object.values(comandas).forEach(cmd=>{
  if(!cmd.mesa) return; if((cmd.estado||'').toUpperCase()==='COBRADA') return;
  const ep=(cmd.estado_parrilla||cmd.estado||'RECIBIDO').toUpperCase();
  const mins=(Date.now()-(cmd.timestamp_estado||cmd.timestamp||Date.now()))/1000/60;
  let debe=null;
  if(ep==='RECIBIDO'&&mins>=5) debe='RECIBIDO';
  else if(ep.includes('PREP')&&mins>=15) debe=ep;
  else if(ep.includes('MANOS')&&mins>=1.5) debe=ep;
  if(debe){const k=(cmd.mesa)+'_'+debe; if(!ultimaAlarma[k]||Date.now()-ultimaAlarma[k]>30000){ alarmaTipo(debe); ultimaAlarma[k]=Date.now(); }}
 });
}
document.getElementById('modalMesa').addEventListener('click',e=>{if(e.target.id==='modalMesa') cerrarModal();});
init();
</script></body></html>
