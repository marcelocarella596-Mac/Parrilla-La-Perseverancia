<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA PERSEVERANCIA | PARRILLA GUSTAVO</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#1a0f0f;color:#fff;padding:10px}
header{background:linear-gradient(90deg,#7b241c,#c0392b);padding:10px 16px;border-radius:6px;display:flex;justify-content:space-between}
.layout{display:grid;grid-template-columns:360px 1fr;gap:12px;margin-top:12px}
.panel{background:#241414;border:1px solid #3a1a1a;border-radius:8px;padding:12px}
.card{background:#2c1a1a;border:2px solid #e74c3c;border-left:6px solid #e74c3c;border-radius:6px;padding:10px;margin-bottom:10px}
.mesa-box{border:2px solid #333;background:#1a1a1a;border-radius:8px;padding:10px;min-height:90px}
.mesa-box.ocupada{border-color:#e74c3c;background:#3a1a1a}
</style>
</head>
<body>
<header><h1>🔥 PARRILLA GUSTAVO | <span id="reloj"></span></h1><span style="background:#000;color:#ff9900;padding:6px 12px;border-radius:12px;font-size:11px">• PARRILLA ACTIVA</span></header>
<div class="layout">
<aside class="panel"><div style="color:#ff9900;font-size:12px;font-weight:bold;margin-bottom:10px">🥩 PARRILLA - FIFO <span id="total">0</span></div><div id="lista"></div></aside>
<main class="panel"><div id="plano"></div></main>
</div>
<script>
const firebaseConfig = { apiKey: "AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU", authDomain: "parrilla-la-perseveranci-f3f54.firebaseapp.com", databaseURL: "https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com", projectId: "parrilla-la-perseveranci-f3f54", storageBucket: "parrilla-la-perseveranci-f3f54.firebasestorage.app", messagingSenderId: "899082319184", appId: "1:899082319184:web:9876161963705785efe855" };
firebase.initializeApp(firebaseConfig); const db = firebase.database();
setInterval(()=>document.getElementById('reloj').textContent=new Date().toLocaleTimeString('es-AR'),1000);
const FILTRO_PARRILLA = ["asado","vacío","vacio","chori","milanesa","entraña","bife","bondiola"];
db.ref('comandas_activas').on('value', snap=>{
  const data=snap.val()||{}; const porMesa={};
  Object.entries(data).forEach(([k,cmd])=>{
    if(!cmd||!cmd.mesa) return;
    const itemsParrilla = (cmd.items||[]).filter(it=>FILTRO_PARRILLA.some(p=>it.nombre.toLowerCase().includes(p)));
    if(itemsParrilla.length===0) return;
    const m=cmd.mesa; if(!porMesa[m]) porMesa[m]={mesa:m,items:[],total:0,timestamp:cmd.timestamp};
    porMesa[m].items.push(...itemsParrilla);
  });
  render(porMesa);
});
function render(porMesa){
  const lista=document.getElementById('lista'); lista.innerHTML=''; const plano=document.getElementById('plano'); plano.innerHTML='';
  const orden=Object.values(porMesa).sort((a,b)=>a.timestamp-b.timestamp); document.getElementById('total').textContent=orden.length;
  orden.forEach((g,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<b style="color:#ff9900">#${String(i+1).padStart(3,'0')} ${g.mesa}</b><div style="margin-top:6px">${g.items.map(it=>`• ${it.cantidad}x ${it.nombre}`).join('<br>')}</div>`; lista.appendChild(d); });
  if(orden.length===0) lista.innerHTML='<p style="color:#666;text-align:center;margin-top:20px">Sin pedidos de parrilla.<br>Esperando a Mariana.</p>';
  Object.values(porMesa).forEach(g=>{ const b=document.createElement('div'); b.className='mesa-box ocupada'; b.style.marginBottom='10px'; b.innerHTML=`<strong>${g.mesa}</strong><div style="margin-top:6px;font-size:12px">${g.items.map(it=>`• ${it.cantidad}x ${it.nombre}`).join('<br>')}</div>`; plano.appendChild(b); });
}
</script></body></html>
