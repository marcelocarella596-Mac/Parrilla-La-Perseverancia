<!DOCTYPE html>
<html lang="es">
<head>

<title>PARRILLA GUSTAVO - COBRO</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0e0e0e;color:#fff;padding:8px}
header{background:linear-gradient(90deg,#1a1a1a,#c0392b);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.btn{border:none;padding:7px 12px;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer;color:#fff;background:#000;border:1px solid #555}
.btn-rojo{background:#c0392b;border-color:#e74c3c}
.layout{display:grid;grid-template-columns:380px 1fr;gap:10px;margin-top:10px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}}
.panel{background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:10px;min-height:400px}
.panel-titulo{color:#ff9900;font-size:11px;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between}
.ticket{background:#1c1c1c;border-left:4px solid #c0392b;border-radius:6px;padding:8px;margin-bottom:8px}
.plano-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.mesa-card{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:10px;min-height:120px}
</style>
</head>
<body>
<header>
<div><b>🔥 LA PERSEVERANCIA</b> <span style="font-size:11px">| PARRILLA GUSTAVO - AV. ARGENTINA 5801</span></div>

<button class="btn" onclick="alert('Caja: $0 - Conecta Firebase')">💰 CAJA</button>
<button class="btn" onclick="location.href='https://v0.app/marcelocarella596'">👁️ VER MENU CLIENTE</button>
<span style="font-size:11px;color:#ff6b6b;border:1px solid #ff6b6b;padding:5px 8px;border-radius:5px">• CONECTADO</span>
</div>
</header>
<div class="layout">
<div class="panel"><div class="panel-titulo"><span>ÍTEMS PARRILLA (FIFO)</span><span id="cant">0 pedidos</span></div><div id="listaFIFO">Acá caen los pedidos del tótem McDonald's cuando el cliente toca VER PEDIDO</div></div>
<div class="panel"><div class="panel-titulo"><span>PLANO MESAS</span></div><div class="plano-grid"><div class="mesa-card">MESA 1<br><small>Libre</small></div><div class="mesa-card">MESA 2<br><small>Libre</small></div><div class="mesa-card">DELIVERY<br><small>WhatsApp Exclusivo</small></div></div></div>
</div>

</script>
</body>
</html>
