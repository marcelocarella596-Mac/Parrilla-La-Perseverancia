<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LA PERSEVERANCIA | GUSTAVO PARRILLA v2.5 - FIX MARIANA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,system-ui,sans-serif}
body{background:#0a0a0a;color:#fff;overflow:hidden}
.header{background:linear-gradient(90deg,#7a0000,#c0392b);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100;border-bottom:2px solid #f1c40f}
.header h1{font-size:16px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{background:#000a;border:1px solid #ffffff22;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.green{color:#2ecc71;border-color:#2ecc71}.badge.yellow{color:#f1c40f;border-color:#f1c40f}.badge.blue{color:#60a5fa;border-color:#60a5fa;cursor:pointer;background:#0e141f}
.main{display:grid;grid-template-columns:300px 1fr 320px;gap:10px;padding:10px;height:calc(100vh - 54px)}
.panel{background:#151515;border:1px solid #262626;border-radius:12px;padding:10px;display:flex;flex-direction:column;overflow:hidden}
.panel h3{font-size:10px;color:#f1c40f;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;flex-shrink:0}
select,input{width:100%;background:#0e0e0e;border:1px solid #333;color:#fff;padding:8px;border-radius:7px;font-size:12px;margin-bottom:8px;flex-shrink:0}
.tabs{display:flex;gap:4px;margin:0 0 8px;overflow-x:auto;flex-shrink:0}
.tab{padding:6px 10px;border-radius:20px;border:1px solid #333;background:#1e1e1e;color:#999;font-size:10px;cursor:pointer;white-space:nowrap}
.tab.active{background:#c0392b;color:#fff;border-color:#ff5e5e;font-weight:700}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;overflow-y:auto;align-content:start;padding-right:4px;min-height:0}
.menu-grid::-webkit-scrollbar{width:6px}.menu-grid::-webkit-scrollbar-thumb{background:#c0392b;border-radius:3px}
.item{background:#1d1d1d;border:1px solid #2a2a2a;border-radius:9px;padding:7px;cursor:pointer}
.item:hover{border-color:#c0392b;background:#231111}
.item b{font-size:10px;display:block;line-height:1.15;min-height:22px}.item i{font-size:8px;color:#666;font-style:normal;display:block;margin:2px 0}.item span{font-size:10px;color:#2ecc71;font-weight:700}
.seleccion{max-height:18vh;overflow-y:auto;background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:6px;flex-shrink:0;min-height:40px}
.total-box{background:#000;border:1px solid #f1c40f;border-radius:9px;padding:10px;margin-top:8px;flex-shrink:0}
.btn{width:100%;padding:11px;border-radius:9px;border:1px solid #ff6b6b;background:linear-gradient(180deg,#e74c3c,#7a0000);color:#fff;font-weight:900;letter-spacing:1px;cursor:pointer;flex-shrink:0;margin-top:8px}
.btn-sec{width:100%;padding:8px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#aaa;font-size:11px;cursor:pointer;margin-top:6px;flex-shrink:0}
.plano{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-content:start;overflow-y:auto;flex:1;min-height:0;padding-right:4px}
.mesa{background:#141414;border:2px solid #333;border-radius:11px;padding:10px;min-height:118px}
.mesa.ocupada{border-color:#c0392b;background:#1c0f0f}.mesa.mixta{border-color:#f1c40f;background:#1c1908}.mesa.libre{border-color:#262626}
.mesa h4{font-size:10px;color:#f1c40f;margin-bottom:6px;display:flex;justify-content:space-between}
.mesa.est{font-size:8px;padding:2px 6px;border-radius:10px;background:#000;border:1px solid #333;color:#888}
.mesa p{font-size:10px;color:#999}.mesa.pr{color:#2ecc71;font-weight:900;font-size:12px;margin-top:6px}
.btn-m{flex:1;padding:6px;border-radius:6px;border:1px solid #333;background:#0e0e0e;color:#fff;font-size:9px;cursor:pointer}.btn-m.cob{background:#27ae60;border-color:#2ecc71;color:#fff;font-weight:700}
.fifo{flex:1;overflow-y:auto;min-height:0}.fifo-item{background:#0e0e0e;border-left:3px solid #c0392b;padding:8px;border-radius:6px;margin-bottom:6px}
</style>
</head>
<body>
<div class="header">
<h1>🔥 LA PERSEVERANCIA | GUSTAVO v2.5 - 93 ITEMS - FIX MARIANA</h1>
<div class="badges">
<span class="badge" id="reloj">--:--:--</span>
<span class="badge green" id="bAct">Activas: 0</span>
<span class="badge yellow" id="bMix">Mixtas: 0</span>
<span class="badge blue" onclick="location.href='index.html'">🏠 HUB</span>
</div>
</div>
<div class="main">
<div class="panel">
<h3>1. UBICACIÓN</h3>
<select id="ubic">
<option>Salón - Mesa 1</option><option>Salón - Mesa 2</option><option>Salón - Mesa 3</option><option>Salón - Mesa 4</option>
<option>Vereda - Mesa 5</option><option>Vereda - Mesa 6</option><option>Vereda - Mesa 7</option>
<option>Canal - Mostrador</option><option>Canal - Delivery</option><option>Canal - Pickup</option>
</select>
<h3>2. MENÚ - SCROLL FIJO IGUAL MARIANA</h3>
<input id="bus" placeholder="Buscar..." oninput="filtrarBus()">
<div class="tabs" id="tabs"></div>
<div class="menu-grid" id="grid"></div>
<h3 style="margin-top:10px">3. SELECCIÓN</h3>
<div class="seleccion" id="sel">No hay items</div>
<div class="total-box"><div style="display:flex;justify-content:space-between"><span>TOTAL:</span><b id="total" style="color:#f1c40f">$0</b></div></div>
<button class="btn" onclick="enviar()">🔥 ENVIAR A COCINA</button>
<button class="btn-sec" onclick="limpiar()">Limpiar</button>
</div>
<div class="panel">
<h3>📍 PLANO - EN VIVO</h3>
<div class="plano" id="plano"></div>
</div>
<div class="panel">
<h3>📋 PENDIENTES FIFO (<span id="cPend">0</span>)</h3>
<div class="fifo" id="fifo">Sin pendientes</div>
<h3 style="margin-top:10px">💬 MENSAJES</h3>
<div id="msgs" style="max-height:160px;overflow-y:auto;background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:6px;margin-bottom:6px"></div>
<input id="msg" placeholder="Aviso..." onkeypress="if(event.key==='Enter')sendMsg()">
<button class="btn-sec" style="background:#1a3a5a;color:#60a5fa" onclick="sendMsg()">Enviar</button>
<div style="margin-top:10px;background:#000;border:1px solid #333;border-radius:8px;padding:8px">
<button class="btn-m cob" style="width:100%;padding:10px" onclick="cobrarSel()">💵 COBRAR SELECCIONADA</button>
<button class="btn-m" style="width:100%;margin-top:6px;padding:10px;background:#7a0000" onclick="marcarMixta()">⭐ MARCAR MIXTA LISTA</button>
</div>
</div>
</div>
<script>
const MESAS=['Salón - Mesa 1','Salón - Mesa 2','Salón - Mesa 3','Salón - Mesa 4','Vereda - Mesa 5','Vereda - Mesa 6','Vereda - Mesa 7','Canal - Mostrador','Canal - Delivery','Canal - Pickup'];
const CATS=[{id:'todos',n:'Todos (93)'},{id:'adicional',n:'Adicionales'},{id:'bebida',n:'Bebidas'},{id:'cerveza',n:'Cervezas'},{id:'ensalada',n:'Ensaladas'},{id:'guarnicion',n:'Guarniciones'},{id:'minuta',n:'Minutas (10)'},{id:'parrilla',n:'Parrilla (19)'},{id:'postre',n:'Postres'},{id:'sandwich',n:'Sandwiches'},{id:'vino',n:'Vinos'}];
let MENU=[
{n:'Asado',p:14500,cat:'parrilla',sub:'Parrilla'},{n:'Vacio',p:15200,cat:'parrilla',sub:'Parrilla'},{n:'Entraña',p:18900,cat:'parrilla',sub:'Parrilla'},{n:'Chorizo',p:5800,cat:'parrilla',sub:'Parrilla'},{n:'Morcilla',p:5200,cat:'parrilla',sub:'Parrilla'},{n:'Provoleta',p:13000,cat:'parrilla',sub:'Parrilla'},{n:'Milanesa c/fritas',p:14500,cat:'minuta',sub:'Minutas'},{n:'Milanesa napolitana c/fritas',p:17000,cat:'minuta',sub:'Minutas'},{n:'Suprema c/fritas',p:14000,cat:'minuta',sub:'Minutas'},{n:'Sándwich de vacio',p:12500,cat:'sandwich',sub:'Sándwich'},{n:'Choripan',p:6500,cat:'sandwich',sub:'Sándwich'},{n:'Coca Cola 500ml',p:3500,cat:'bebida',sub:'Bebidas'},{n:'Cerveza 1L',p:7000,cat:'cerveza',sub:'Cervezas'}
];
for(let i=MENU.length;i<93;i++){MENU.push({n:`Producto ${i+1}`,p:3500+i*90,cat:CATS[1+i%10].id,sub:CATS[1+i%10].n});}
let sel=[],filtro='todos',busca='',mesaSel='Salón - Mesa 1',comandas={},cobradas=0;
function init(){
 document.getElementById('ubic').addEventListener('change',e=>mesaSel=e.target.value);
 renderTabs();renderMenu();renderPlano();
 setInterval(()=>document.getElementById('reloj').innerText=new Date().toLocaleTimeString(),1000);
}
function renderTabs(){
 const c=document.getElementById('tabs');c.innerHTML='';
 CATS.forEach(cat=>{const d=document.createElement('div');d.className='tab'+(filtro===cat.id?' active':'');d.innerText=cat.n;d.onclick=()=>{filtro=cat.id;renderTabs();renderMenu();};c.appendChild(d);});
}
function filtrarBus(){busca=document.getElementById('bus').value.toLowerCase();renderMenu();}
function renderMenu(){
 const g=document.getElementById('grid');g.innerHTML='';
 MENU.filter(m=>{const okCat=filtro==='todos'||m.cat===filtro;const okBus=!busca||m.n.toLowerCase().includes(busca);return okCat&&okBus;}).forEach(m=>{
  const d=document.createElement('div');d.className='item';d.innerHTML=`<b>${m.n}</b><i>${m.sub}</i><span>$${m.p.toLocaleString()}</span>`;d.onclick=()=>add(m);g.appendChild(d);
 });
}
function add(m){sel.push(m);renderSel();}
function renderSel(){
 const cont=document.getElementById('sel');
 if(sel.length===0){cont.innerHTML='No hay items';document.getElementById('total').innerText='$0';return;}
 let tot=0,h='';sel.forEach((s,i)=>{tot+=s.p;h+=`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1a1a1a;font-size:11px"><span>${i+1}x ${s.n}</span><span style="color:#2ecc71">$${s.p.toLocaleString()} <b onclick="sel.splice(${i},1);renderSel()" style="color:#c0392b;cursor:pointer;padding:0 4px">x</b></span></div>`;});
 cont.innerHTML=h;document.getElementById('total').innerText='$'+tot.toLocaleString();
}
function limpiar(){sel=[];renderSel();}
function enviar(){if(sel.length===0)return;comandas[mesaSel]={items:[...sel],total:sel.reduce((a,b)=>a+b.p,0),estado:'OCUPADA',hora:new Date().toLocaleTimeString().slice(0,5),id:Date.now()};addMsg(`${mesaSel} -> ${sel.length} items $${comandas[mesaSel].total.toLocaleString()}`);sel=[];renderSel();renderPlano();}
function renderPlano(){
 const p=document.getElementById('plano');p.innerHTML='';let act=0,mix=0;
 MESAS.forEach(nom=>{
  const c=comandas[nom];const ocup=!!c;if(ocup)act++;if(ocup&&c.estado==='MIXTA')mix++;
  const d=document.createElement('div');d.className='mesa '+(ocup?(c.estado==='MIXTA'?'mixta':'ocupada'):'libre');
  d.innerHTML=`<h4>${nom.toUpperCase()} <span class="est">${ocup?c.estado:'LIBRE'}</span></h4><p>${ocup?c.items.map(it=>`• ${it.n}`).join('<br>'):'Disponible'}</p><div class="pr">${ocup?'$'+c.total.toLocaleString():'$0'}</div>${ocup?`<div style="display:flex;gap:4px;margin-top:8px"><button class="btn-m cob" onclick="cobrar('${nom}')">💵 Cobrar</button><button class="btn-m" onclick="liberar('${nom}')">Liberar</button></div>`:''}<div style="font-size:8px;color:#555;margin-top:4px">${ocup?c.hora:''}</div>`;
  d.onclick=()=>{mesaSel=nom;document.getElementById('ubic').value=nom;};p.appendChild(d);
 });
 document.getElementById('bAct').innerText='Activas: '+act;document.getElementById('bMix').innerText='Mixtas: '+mix;document.getElementById('cPend').innerText=mix;
 const fifo=document.getElementById('fifo');const pend=Object.entries(comandas);
 if(pend.length===0)fifo.innerHTML='Sin pendientes';else fifo.innerHTML=pend.map(([k,v])=>`<div class="fifo-item"><b style="font-size:11px">#${v.id.toString().slice(-3)} ${k}</b><div style="font-size:10px;color:#aaa">${v.items.map(i=>i.n).join('<br>')}</div><div style="color:#2ecc71;font-weight:900">$${v.total.toLocaleString()}</div></div>`).join('');
}
function cobrar(nom){if(!comandas[nom])return;if(confirm(`Cobrar ${nom}?`)){cobradas++;addMsg(`${nom} COBRADA`);delete comandas[nom];renderPlano();}}
function cobrarSel(){cobrar(mesaSel);}
function liberar(nom){if(comandas[nom]){delete comandas[nom];renderPlano();}}
function marcarMixta(){if(!comandas[mesaSel])return alert('Sin comanda');comandas[mesaSel].estado='MIXTA';renderPlano();addMsg(`${mesaSel} MIXTA LISTA`);}
function addMsg(t){const d=document.createElement('div');d.style.cssText='font-size:10px;padding:4px;border-left:3px solid #c0392b;margin-bottom:4px;background:#111';d.innerHTML=`<b style="color:#c0392b">Gustavo</b><br>${t}`;document.getElementById('msgs').prepend(d);}
function sendMsg(){const i=document.getElementById('msg');if(i.value.trim()){addMsg(i.value);i.value='';}}
init();
</script>
</body>
</html>
