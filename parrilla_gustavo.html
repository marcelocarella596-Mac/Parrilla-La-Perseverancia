<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARRILLA GUSTAVO - FINAL COBRO</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0e0e0e;color:#fff;padding:8px}
header{background:linear-gradient(90deg,#1a1a1a,#c0392b);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.btn{border:none;padding:7px 12px;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer;color:#fff;background:#000;border:1px solid #555}
.btn-rojo{background:#c0392b;border-color:#e74c3c}
.btn-verde{background:#000;border:1px solid #27ae60;color:#27ae60}
.btn-caja{background:#000;border:1px solid #f1c40f;color:#f1c40f}
.btn-msj{background:#000;border:1px solid #3498db;color:#3498db}
.layout{display:grid;grid-template-columns:380px 1fr;gap:10px;margin-top:10px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}}
.panel{background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:10px}
.panel-titulo{color:#ff9900;font-size:11px;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between}
.ticket{background:#1c1c1c;border-left:4px solid #c0392b;border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}
.ticket.PREPARACION{border-left-color:#e67e22;background:#2a2011}
.ticket.MANOS{border-left-color:#27ae60;background:#112a18}
.ticket.RECIBIDO{border-left-color:#2980b9}
.ticket.COBRADA{border-left-color:#f1c40f;background:#1a1a00;opacity:0.6}
.badge-tipo{font-size:8px;padding:2px 6px;border-radius:10px;border:1px solid;font-weight:bold}
.tachado-cocina{text-decoration:line-through;opacity:0.35}
.guarnicion{background:rgba(39,174,96,0.25);border-left:3px solid #27ae60;padding:1px 5px;border-radius:3px;font-weight:900}
.plano-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.mesa-card{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:8px;min-height:130px;cursor:pointer}
.mesa-card.ocupada{border-color:#c0392b;background:#2a1414}
.mesa-card.cobrada{border-color:#f1c40f;background:#1a1a00;opacity:0.7}
.timer{background:#000;border:1px solid #c0392b;color:#ff6b6b;text-align:center;padding:3px;border-radius:4px;font-family:monospace;font-size:11px;margin-top:6px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);display:none;justify-content:center;align-items:center;z-index:9999}
.modal{background:#181818;border:1px solid #444;border-radius:10px;padding:18px;width:95%;max-width:650px;text-align:center}
.btn-estado{width:100%;padding:12px;margin-bottom:8px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;color:#fff;font-size:12px}
.chat-box{background:#111;border:1px solid #333;border-radius:6px;height:300px;overflow-y:auto;padding:8px;font-size:11px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.chat-msg{background:#222;padding:6px 8px;border-radius:4px;border-left:3px solid #3498db}
.chat-msg.mio{border-left-color:#c0392b}
</style>
</head>
<body>
<header>
<div><b>🔥 LA PERSEVERANCIA</b> <span style="font-size:11px;opacity:.8">| PARRILLA GUSTAVO</span></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn btn-caja" onclick="abrirCaja()">💰 CAJA / ARQUEO</button>
<button class="btn btn-msj" onclick="abrirMensajes()">💬 MENSAJES</button>
<button class="btn" onclick="abrirResumen()">📋 RESUMEN</button>
<span style="font-size:11px;color:#ff6b6b;border:1px solid #ff6b6b;padding:5px 8px;border-radius:5px">• PARRILLA - COBRA</span>
</div>
</header>
<div class="layout">
<div class="panel"><div class="panel-titulo"><span>ÍTEMS PARRILLA (FIFO)</span><span id="cant">0</span></div><div id="listaFIFO"></div></div>
<div class="panel"><div class="panel-titulo"><span>📍 PLANO</span></div><div id="plano"></div></div>
</div>

<div class="modal-overlay" id="modal"><div class="modal" style="max-width:420px">
<h3 id="modalTitulo" style="color:#ff6b6b;margin-bottom:8px"></h3>
<div id="modalDetalle" style="font-size:11px;text-align:left;background:#111;padding:8px;border-radius:6px;margin-bottom:10px"></div>
<button id="b1" class="btn-estado" style="background:#2980b9" onclick="setEstado('RECIBIDO')">📥 RECIBIDO</button>
<button id="b2" class="btn-estado" style="background:#d35400" onclick="setEstado('PREPARACION')">🔥 PREPARACIÓN</button>
<button id="b3" class="btn-estado" style="background:#27ae60" onclick="setEstado('MANOS')">🖐️ MANOS / LISTO</button>
<hr style="margin:10px 0;border-color:#333">
<div style="background:#1a1a00;border:1px solid #f1c40f;border-radius:6px;padding:8px;margin-bottom:8px">
<div style="font-size:10px;color:#f1c40f;font-weight:bold;margin-bottom:4px">💰 COBRAR MESA (Gustavo)</div>
<div style="display:flex;gap:4px">
<input id="totalCobro" type="number" placeholder="$ Total" style="flex:1;padding:8px;background:#000;border:1px solid #f1c40f;color:#f1c40f;border-radius:4px">
<button onclick="cobrarMesa()" style="background:#f1c40f;color:#000;border:none;padding:8px 12px;border-radius:4px;font-weight:900;cursor:pointer">💰 COBRAR</button>
</div>
</div>
<button class="btn-estado" style="background:#333" onclick="cerrar()">CANCELAR</button>
</div></div>

<div class="modal-overlay" id="modalResumen"><div class="modal" style="max-width:550px;text-align:left"><h3 style="color:#ff9900;margin-bottom:10px">📋 RESUMEN</h3><div id="contenidoResumen" style="font-size:12px;background:#111;padding:10px;border-radius:6px;max-height:60vh;overflow-y:auto"></div><button class="btn-estado" style="background:#333;margin-top:10px" onclick="document.getElementById('modalResumen').style.display='none'">CERRAR</button></div></div>

<div class="modal-overlay" id="modalCaja"><div class="modal" style="text-align:left"><h3 style="color:#f1c40f;margin-bottom:10px">💰 CAJA / ARQUEO</h3><div style="display:flex;gap:6px;margin-bottom:10px"><div style="flex:1;background:#000;border:1px solid #27ae60;padding:8px;border-radius:6px;text-align:center"><div style="font-size:9px;color:#aaa">INGRESOS HOY</div><div id="cajaTotal" style="font-size:16px;font-weight:900;color:#27ae60">$0</div><small id="cajaTickets" style="color:#666">0 tickets</small></div><div style="flex:1;background:#000;border:1px solid #c0392b;padding:8px;border-radius:6px;text-align:center"><div style="font-size:9px;color:#aaa">EGRESOS HOY</div><div id="cajaEgresosTotal" style="font-size:16px;font-weight:900;color:#e74c3c">$0</div><small id="cajaEgresosCant" style="color:#666">0 compras</small></div><div style="flex:1;background:#111;border:2px solid #f1c40f;padding:8px;border-radius:6px;text-align:center"><div style="font-size:9px;color:#aaa">NETO</div><div id="cajaNeto" style="font-size:18px;font-weight:900;color:#f1c40f">$0</div></div></div><div id="cajaLista" style="font-size:11px;background:#111;padding:10px;border-radius:6px;max-height:50vh;overflow-y:auto"></div><button class="btn-estado" style="background:#333;margin-top:10px" onclick="document.getElementById('modalCaja').style.display='none'">CERRAR</button></div></div>

<div class="modal-overlay" id="modalMensajes"><div class="modal" style="text-align:left"><h3 style="color:#3498db;margin-bottom:10px">💬 MENSAJES</h3><div class="chat-box" id="chatMensajes"></div><input type="text" id="inputMensaje" placeholder="Aviso a cocina..." style="width:100%;padding:10px;background:#111;border:1px solid #444;color:#fff;border-radius:6px" onkeypress="if(event.key==='Enter')enviarMensaje()"><button style="margin-top:8px;width:100%;padding:10px;background:#c0392b;border:none;color:#fff;border-radius:6px;font-weight:bold" onclick="enviarMensaje()">📤 ENVIAR</button><button class="btn-estado" style="background:#333;margin-top:8px" onclick="document.getElementById('modalMensajes').style.display='none'">CERRAR</button></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54",storageBucket:"parrilla-la-perseveranci-f3f54.firebasestorage.app",messagingSenderId:"899082319184",appId:"1:899082319184:web:9876161963705785efe855"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const MAPEO={"Salón - Mesa 1":"Mesa 1","Salón - Mesa 2":"Mesa 2","Salón - Mesa 3":"Mesa 3","Salón - Mesa 4":"Mesa 4","Vereda - Mesa 5":"Mesa 5 Vereda","Vereda - Mesa 6":"Mesa 6 Vereda","Vereda - Mesa 7":"Mesa 7 Vereda","Canal - Mostrador":"Mostrador","Canal - Pickup":"Pickup","Canal - Delivery":"Delivery"};
const NOMBRES={"Mesa 1":"MESA 1","Mesa 2":"MESA 2","Mesa 3":"MESA 3","Mesa 4":"MESA 4","Mesa 5 Vereda":"MESA 5 VEREDA","Mesa 6 Vereda":"MESA 6 VEREDA","Mesa 7 Vereda":"MESA 7 VEREDA","Mostrador":"MOSTRADOR","Pickup":"PICKUP","Delivery":"DELIVERY"};
let comandas={}, sel=null, historialCaja=[], historialEgresos=[];
const PARRILLA_BASE=['asado','vacio','vacío','bife','entraña','morcilla','chinchulin','chorizo','provoleta','molleja','costillar','matambre','bondiola','choripan','morcipan','parrillada','pollo'];
const AGREGADOS_COCINA=['lechuga','tomate','jamon','jamón','queso','huevo','frita','papas'];
const COCINA_PURA=['milanesa','suprema','pechuga','tortilla','buñuelo'];
function descomponerItem(n){const l=(n||'').toLowerCase();if(COCINA_PURA.some(k=>l.includes(k)))return[{texto:n,estacion:'COCINA'}];const base=PARRILLA_BASE.some(k=>l.includes(k));const agr=AGREGADOS_COCINA.some(k=>l.includes(k));const sand=(l.includes('vacio')||l.includes('bondiola')||l.includes('choripan')||l.includes('morcipan')||l.includes('chorizo')||l.includes('morcilla')||l.includes('asado')||l.includes('bife'))&&agr;if(sand){let carne=n;let agregado='';const m=l.match(/(lechuga|tomate|jamon|jamón|queso|huevo|frita|papas)/);if(m){const idx=l.indexOf(m[0]);if(idx>2){carne=n.substring(0,idx).trim();agregado=n.substring(idx).trim();}}if(l.includes('c/fritas')){const p=n.split(/c\/fritas/i);carne=p[0].trim();agregado='FRITAS';}if(l.includes(' solo'))return[{texto:carne,estacion:'PARRILLA'}];const res=[];if(carne)res.push({texto:carne,estacion:'PARRILLA'});if(agregado)res.push({texto:agregado.toUpperCase(),estacion:'COCINA',esGuarnicion:true});return res.length?res:[{texto:n,estacion:'PARRILLA'}];}if(base&&agr){const carne=n.split(/c\/fritas/i)[0].trim();return[{texto:carne,estacion:'PARRILLA'},{texto:'FRITAS',estacion:'COCINA',esGuarnicion:true}];}if(base)return[{texto:n,estacion:'PARRILLA'}];return[{texto:n,estacion:'COCINA'}];}
function getTipo(items){let p=false,c=false;(items||[]).forEach(it=>{descomponerItem(it.nombre).forEach(s=>{if(s.estacion==='PARRILLA')p=true;else c=true;});});if(p&&c)return'MIXTA';if(p)return'PARRILLA';return'COCINA';}
db.ref('comandas_activas').on('value',s=>{
const data=s.val()||{};const nuevo={};
Object.values(data).forEach(cmd=>{
if(!cmd.mesa)return;const idV=MAPEO[cmd.mesa]||cmd.mesa;if(!NOMBRES[idV])return;
if(!nuevo[idV])nuevo[idV]={id:idV,mesa:cmd.mesa,items:[],estado:(cmd.estado||'RECIBIDO').toUpperCase(),estado_cocina:(cmd.estado_cocina||cmd.estado||'RECIBIDO').toUpperCase(),estado_parrilla:(cmd.estado_parrilla||cmd.estado||'RECIBIDO').toUpperCase(),total_cobrado:cmd.total_cobrado||0,timestamp:cmd.timestamp||Date.now(),nroOrden:cmd.nroOrden||Math.floor(Math.random()*900+100)};
(cmd.items||[]).forEach(it=>{if(!it.nombre)return;const ex=nuevo[idV].items.find(x=>x.nombre===it.nombre);if(ex)ex.cantidad+=parseInt(it.cantidad||1);else nuevo[idV].items.push({nombre:it.nombre,cantidad:parseInt(it.cantidad||1)});});
nuevo[idV].estado=cmd.estado||nuevo[idV].estado; nuevo[idV].estado_parrilla=cmd.estado_parrilla||nuevo[idV].estado; nuevo[idV].total_cobrado=cmd.total_cobrado||0;
});
comandas=nuevo;render();
});
db.ref('historial_caja').on('value',s=>{const data=s.val()||{};historialCaja=Object.values(data).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));actualizarCaja();});
db.ref('egresos_caja').on('value',s=>{const data=s.val()||{};historialEgresos=Object.values(data).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));actualizarCaja();});
db.ref('mensajes_chat').limitToLast(50).on('value',snap=>{const box=document.getElementById('chatMensajes');if(!box)return;box.innerHTML='';const data=snap.val();if(!data)return;Object.values(data).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(m=>{const d=document.createElement('div');d.className=`chat-msg ${m.remitente==='Gustavo'?'mio':''}`;d.innerHTML=`<strong style="color:${m.remitente==='Gustavo'?'#ff6b6b':m.remitente==='Hernán'?'#00ff66':'#3498db'}">${m.remitente}</strong> <small>(${m.hora||''})</small><br>${m.texto}`;box.appendChild(d);});box.scrollTop=box.scrollHeight;});
function actualizarCaja(){const hoy=new Date().toDateString();let ing=0,tick=0,egr=0,cegr=0;historialCaja.forEach(r=>{if(new Date(r.timestamp).toDateString()===hoy){ing+=Number(r.total||0);tick++;}});historialEgresos.forEach(r=>{if(new Date(r.timestamp).toDateString()===hoy){egr+=Number(r.monto||0);cegr++;}});document.getElementById('cajaTotal').textContent='$'+ing;document.getElementById('cajaTickets').textContent=tick+' tickets';document.getElementById('cajaEgresosTotal').textContent='$'+egr;document.getElementById('cajaEgresosCant').textContent=cegr+' compras';document.getElementById('cajaNeto').textContent='$'+(ing-egr);}
function render(){const ids=Object.keys(comandas);document.getElementById('cant').textContent=ids.length;const fifo=document.getElementById('listaFIFO');fifo.innerHTML='';ids.sort((a,b)=>comandas[a].timestamp-comandas[b].timestamp).forEach(id=>{const cmd=comandas[id];const tipo=getTipo(cmd.items);if(tipo==='COCINA')return;const esCobrada=cmd.estado==='COBRADA';let items='';cmd.items.forEach(it=>{descomponerItem(it.nombre).forEach(s=>{let cls='';if(s.estacion==='COCINA')cls='tachado-cocina';else if(s.esGuarnicion)cls='guarnicion';items+=`<div class="${cls}" style="display:flex;justify-content:space-between;font-size:12px"><span>• ${s.texto}</span><b style="color:${esCobrada?'#f1c40f':'#ff6b6b'}">x${it.cantidad}</b></div>`;});});const div=document.createElement('div');div.className=`ticket ${esCobrada?'COBRADA':cmd.estado_parrilla}`;div.onclick=()=>abrir(id);div.innerHTML=`<div style="display:flex;justify-content:space-between"><span>#${String(cmd.nroOrden).slice(-3)} ${id}</span><span class="badge-tipo" style="color:${esCobrada?'#f1c40f':'#ff6b6b'};border-color:${esCobrada?'#f1c40f':'#ff6b6b'}">${esCobrada?'COBRADA':tipo}</span></div><div style="font-size:10px;color:${esCobrada?'#f1c40f':'#aaa'}">${cmd.estado_parrilla} ${esCobrada?'$'+cmd.total_cobrado:''}</div>${items}`;fifo.appendChild(div);});const plano=document.getElementById('plano');plano.innerHTML='<div class="plano-grid" id="g"></div>';const g=document.getElementById('g');Object.keys(NOMBRES).forEach(id=>{const cmd=comandas[id];const tipo=cmd?getTipo(cmd.items):null;const esCobrada=cmd&&cmd.estado==='COBRADA';const card=document.createElement('div');card.className=`mesa-card ${cmd?'ocupada':''} ${esCobrada?'cobrada':''}`;card.onclick=()=>{if(cmd)abrir(id);};if(!cmd){card.innerHTML=`<b>${NOMBRES[id]}</b><br><small style="color:#666">Libre</small>`;}else{if(tipo==='COCINA')return;if(esCobrada){card.innerHTML=`<b>${NOMBRES[id]}</b><div style="text-align:center;color:#f1c40f;font-weight:800;margin-top:8px">💰 COBRADA<br>$${cmd.total_cobrado}<br><small style="color:#fff">Espera Mariana</small></div>`;}else{const nro=String(cmd.nroOrden).slice(-3);const seg=Math.floor((Date.now()-cmd.timestamp)/1000);const mm=String(Math.floor(seg/60)).padStart(2,'0');const ss=String(seg%60).padStart(2,'0');let lista='';cmd.items.forEach(it=>{descomponerItem(it.nombre).forEach(s=>{let style='';if(s.estacion==='COCINA')style='text-decoration:line-through;opacity:0.4';lista+=`<li style="${style}">• ${s.texto} x${it.cantidad}</li>`;});});card.innerHTML=`<div style="display:flex;justify-content:space-between"><span><span style="color:#f1c40f">#${nro}</span> ${NOMBRES[id]}</span><span class="badge-tipo" style="color:#ff6b6b;border-color:#ff6b6b">${tipo}</span></div><div style="font-size:10px;color:#ff6b6b">${cmd.estado_parrilla}</div><ul style="list-style:none;font-size:11px;margin:4px 0">${lista}</ul><div class="timer">${mm}:${ss}</div>`;}}g.appendChild(card);});}
function abrir(id){sel=id;const cmd=comandas[id];const esCobrada=cmd.estado==='COBRADA';document.getElementById('modalTitulo').textContent=id+' - '+(esCobrada?'💰 COBRADA':'PARRILLA');document.getElementById('modalDetalle').innerHTML=`<b>Estado: ${cmd.estado_parrilla}</b><br><br>${cmd.items.map(i=>`${i.nombre} x${i.cantidad}`).join('<br>')}<br><br>${esCobrada?'<b style="color:#f1c40f">Ya cobrada $'+cmd.total_cobrado+'</b>':''}`;document.getElementById('modal').style.display='flex';}
function cerrar(){document.getElementById('modal').style.display='none';}
function setEstado(n){if(!sel)return;if(comandas[sel].estado==='COBRADA'){alert('Ya está cobrada, espera Mariana');return;}const idSeguro=comandas[sel].mesa.replace(/[^a-zA-Z0-9]/g,'_');db.ref('comandas_activas/'+idSeguro+'/estado_parrilla').set(n);db.ref('comandas_activas/'+idSeguro+'/estado').set(n);db.ref('comandas_activas/'+idSeguro+'/timestamp').set(Date.now());cerrar();}
function cobrarMesa(){if(!sel)return;const cmd=comandas[sel];if(cmd.estado==='COBRADA'){alert('Ya cobrada');return;}const total=Number(document.getElementById('totalCobro').value);if(!total){alert('Poné total');return;}const idSeguro=cmd.mesa.replace(/[^a-zA-Z0-9]/g,'_');const ahora=Date.now();db.ref('comandas_activas/'+idSeguro+'/estado').set('COBRADA');db.ref('comandas_activas/'+idSeguro+'/estado_cocina').set('COBRADA');db.ref('comandas_activas/'+idSeguro+'/estado_parrilla').set('COBRADA');db.ref('comandas_activas/'+idSeguro+'/total_cobrado').set(total);db.ref('comandas_activas/'+idSeguro+'/cobradoPor').set('Gustavo');db.ref('comandas_activas/'+idSeguro+'/timestamp_cobro').set(ahora);db.ref('historial_caja/'+ahora).set({mesaId:sel, mesa:cmd.mesa, items:cmd.items, total:total, total_cobrado:total, cobradoPor:'Gustavo', timestamp:ahora, fecha:new Date().toLocaleString('es-AR')});document.getElementById('totalCobro').value='';cerrar();alert('Mesa '+sel+' cobrada $'+total+' - Esperando Mariana libere');}
function abrirResumen(){const ids=Object.keys(comandas);let html='';ids.forEach(id=>{const c=comandas[id];html+=`• ${id} [${getTipo(c.items)}] ${c.estado_parrilla} ${c.estado==='COBRADA'?'💰 $'+c.total_cobrado:''} - ${c.items.map(i=>i.nombre).join(', ')}<br>`;});document.getElementById('contenidoResumen').innerHTML=html||'Sin comandas';document.getElementById('modalResumen').style.display='flex';}
function abrirCaja(){actualizarCaja();let html='';const lista=[...historialCaja].sort((a,b)=>b.timestamp-a.timestamp).slice(0,30);if(lista.length===0)html='<div style="color:#666">Sin movimientos</div>';else lista.forEach(r=>{const f=new Date(r.timestamp).toLocaleString('es-AR');html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:5px 0"><div><b style="color:#27ae60">+ $${r.total}</b> ${r.mesaId} <br><small style="color:#aaa">${f}</small></div></div>`;});document.getElementById('cajaLista').innerHTML=html;document.getElementById('modalCaja').style.display='flex';}
function abrirMensajes(){document.getElementById('modalMensajes').style.display='flex';}
function enviarMensaje(){const inp=document.getElementById('inputMensaje');const txt=inp.value.trim();if(!txt)return;db.ref('mensajes_chat').push({remitente:'Gustavo',texto:txt,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});inp.value='';}
setInterval(render,1000);
</script>
</body>
</html>
