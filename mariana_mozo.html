  <style>
    /* --- ESTILOS VISUALES (Mismo diseño) --- */
    :root {
      --color-fondo: #1a1a1a;
      --color-barra-sup: #333333;
      --color-texto: #ffffff;
      --color-acento-rojo: #b71c1c;
      --color-acento-amarillo: #fbc02d;
      --color-verde-disponible: #2e7d32;
      --color-rojo-ocupado: #c62828;
      --color-gris-tarjeta: #2d2d2d;
      --fuente-principal: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--fuente-principal); }
    body { background-color: var(--color-fondo); color: var(--color-texto); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 14px; }

    .header-sup { background-color: var(--color-barra-sup); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--color-acento-rojo); height: 50px;}
    .header-sup h1 { font-size: 1.1rem; font-weight: bold; text-transform: uppercase; color: var(--color-texto); letter-spacing: 0.5px;}
    .user-info { display: flex; align-items: center; gap: 15px; font-weight: bold;}
    .user-icon { font-size: 1rem; color: var(--color-acento-amarillo); }
    .status-live { font-size: 0.7rem; color: #4caf50; border: 1px solid #4caf50; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;}

    .main-layout { display: flex; flex-grow: 1; gap: 10px; padding: 10px; overflow: hidden; }
    .panel { background-color: #212121; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333;}
    .panel-gestion { width: 37%; min-width: 400px; }
    .panel-mesas { width: 35%; min-width: 350px; }
    .panel-pendientes { width: 28%; min-width: 300px; }

    .sec-titulo { font-size: 0.85rem; font-weight: bold; color: var(--color-acento-amarillo); margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 2px;}
    
    .ubicacion-row { display: flex; gap: 8px; margin-bottom: 12px; }
    select { flex: 1; padding: 6px; background-color: var(--color-fondo); color: var(--color-texto); border: 1px solid #444; border-radius: 4px; font-size: 0.9rem;}
    select optgroup { background-color: #333; color: #ffc107; font-weight: bold;}

    .cat-contenedor { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
    .btn-cat { flex: 1; min-width: 70px; text-align: center; padding: 6px 4px; background-color: var(--color-gris-tarjeta); color: var(--color-texto); border: 1px solid #444; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .btn-cat:hover { opacity: 0.9; background-color: #444;}
    .btn-cat.activo { background-color: var(--color-acento-rojo); border-color: #b71c1c; color: white;}

    .prod-grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; margin-bottom: 10px; align-content: start; padding: 2px;}
    .prod-card { background-color: var(--color-gris-tarjeta); border: 1px solid #444; border-radius: 5px; padding: 6px; cursor: pointer; text-align: center; height: 65px; display: flex; flex-direction: column; justify-content: center; transition: 0.1s;}
    .prod-card:hover { border-color: var(--color-acento-amarillo); box-shadow: 0 0 4px rgba(251, 192, 45, 0.4); background-color: #383838;}
    .prod-card .nombre { font-size: 0.7rem; font-weight: bold; line-height: 1.1; margin-bottom: 3px; color: #eee;}
    .prod-card .precio { font-size: 0.8rem; font-weight: bold; color: var(--color-acento-amarillo); }

    .resumen-container { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;}
    .resumen-lista { flex-grow: 1; overflow-y: auto; margin-bottom: 8px; border: 1px solid #444; padding: 4px; background-color: #111; border-radius: 4px;}
    .resumen-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 5px; border-bottom: 1px solid #333; font-size: 0.8rem;}
    .resumen-item:last-child { border-bottom: none;}
    .item-info { display: flex; flex-direction: column; }
    .item-nombre { font-weight: bold; color: #f5f5f5;}
    .item-precio { color: var(--color-acento-amarillo); font-weight: bold; font-size: 0.75rem;}
    .item-controles { display: flex; align-items: center; gap: 4px; }
    .btn-qty { width: 20px; height: 20px; background-color: #555; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 0.9rem; line-height: 1; display: flex; align-items: center; justify-content: center;}
    .btn-qty:hover { background-color: #777; }
    .item-cant { font-weight: bold; width: 18px; text-align: center; font-size: 0.85rem;}
    
    .resumen-total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 5px; border-top: 2px solid #444; margin-bottom: 8px;}
    .total-label { font-weight: bold; font-size: 0.9rem; color: #aaa; text-transform: uppercase;}
    .total-monto { font-weight: bold; font-size: 1.2rem; color: var(--color-acento-amarillo);}
    
    .btn-enviar { width: 100%; padding: 10px; background-color: var(--color-rojo-ocupado); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;}
    .btn-enviar:hover { background-color: #b71c1c; }
    .btn-enviar:active { transform: translateY(1px);}

    .mesas-grilla { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; overflow-y: auto; align-content: start; padding: 2px;}
    .mesa-card { background-color: var(--color-gris-tarjeta); border: 2px solid var(--color-verde-disponible); border-radius: 6px; padding: 8px; cursor: pointer; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; position: relative;}
    .mesa-card.ocupada { border-color: var(--color-rojo-ocupado); background-color: #261111; }
    .mesa-card.estado-PENDIENTE { border-color: var(--color-rojo-ocupado); background-color: #261111; }
    .mesa-card.estado-PREPARANDO { border-color: #fbc02d; background-color: #333300; }
    .mesa-card.estado-LISTO { border-color: var(--color-verde-disponible); background-color: #113822; }
    
    .mesa-card:hover:not(.ocupada):not(.estado-PENDIENTE):not(.estado-PREPARANDO):not(.estado-LISTO) { border-color: var(--color-acento-amarillo); box-shadow: 0 0 6px rgba(251, 192, 45, 0.6);}

    .mesa-hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #555; padding-bottom: 2px; margin-bottom: 4px;}
    .mesa-nombre { font-weight: bold; font-size: 0.9rem; color: var(--color-acento-amarillo); }
    .mesa-status { font-size: 0.6rem; font-weight: bold; padding: 1px 5px; border-radius: 3px; background-color: var(--color-verde-disponible); color: #fff; text-transform: uppercase;}
    .mesa-card.ocupada .mesa-status, .mesa-card.estado-PENDIENTE .mesa-status { background-color: var(--color-rojo-ocupado); }
    .mesa-card.estado-PREPARANDO .mesa-status { background-color: #fbc02d; color: #111;}
    .mesa-card.estado-LISTO .mesa-status { background-color: var(--color-verde-disponible);}
    
    .mesa-info-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #bbb; margin-bottom: 4px;}
    
    .mesa-preview { flex-grow: 1; font-size: 0.7rem; color: #ddd; overflow-y: auto; max-height: 50px; margin-bottom: 4px; line-height: 1.1;}
    .mesa-preview div { padding: 1px 0;}
    
    .mesa-footer { border-top: 1px solid #555; padding-top: 2px; display: flex; justify-content: space-between; align-items: center;}
    .mesa-total { font-weight: bold; font-size: 0.8rem; color: var(--color-acento-amarillo);}
    .mesa-timer { font-size: 0.65rem; color: #aaa; font-style: italic; font-weight: bold;}
    .mesa-card.ocupada .mesa-timer { color: #ef9a9a;}

    .pendientes-container { display: flex; flex-direction: column; height: 100%; gap: 10px;}
    .lista-pendientes { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 2px;}
    .pendiente-card { background-color: #111; border-left: 3px solid #ffc107; padding: 6px; border-radius: 4px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center;}
    .pendiente-card.estado-LISTO { border-left-color: #4caf50;}
    .pend-info { display: flex; flex-direction: column; gap: 1px;}
    .pend-mesa { font-weight: bold; color: var(--color-acento-amarillo); font-size: 0.8rem;}
    .pend-card.estado-LISTO .pend-mesa { color: #81c784;}
    .pend-items { color: #ccc;}
    .pend-status { font-weight: bold; text-align: right;}
    .pend-estado-PENDIENTE { color: #ffc107;}
    .pend-estado-PREPARANDO { color: #64b5f6;}
    .pend-estado-LISTO { color: #81c784;}

    .chat-section { display: flex; flex-direction: column; height: 45%; min-height: 150px; }
    .chat-box { flex-grow: 1; background-color: #111; border: 1px solid #444; border-radius: 4px; padding: 6px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px;}
    .chat-msg { font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; background-color: #333; max-width: 90%; align-self: flex-start; line-height: 1.2;}
    .chat-msg.mio { background-color: #555; align-self: flex-end; border-right: 3px solid var(--color-acento-rojo); }
    .chat-msg strong { color: var(--color-acento-amarillo); margin-right: 4px;}
    .chat-msg.mio strong { color: #e57373; }
    .chat-msg-tiempo { color: #aaa; font-size: 0.65rem; margin-left: 5px;}
    .chat-input-row { display: flex; gap: 5px; }
    input[type="text"] { flex-grow: 1; padding: 6px; background-color: var(--color-fondo); color: var(--color-texto); border: 1px solid #444; border-radius: 4px; font-size: 0.9rem;}
    .btn-chat { padding: 6px 12px; background-color: #0277bd; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; text-transform: uppercase;}
