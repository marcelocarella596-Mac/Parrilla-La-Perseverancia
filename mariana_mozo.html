function escucharAgotados(){db.ref('platos_agotados').on('value',s=>{agotados=s.val()||{};renderGrilla(categoriaActiva);});}
function construirBotonesCategorias(){
  const c=document.getElementById('contenedorCategorias');
  const orden=["Todos","Parrilla","Minutas","Sándwiches","Guarniciones","Ensaladas","Bebidas","Cervezas","Vinos","Postres","Adicionales"];
  const catsPresentes = new Set(MENU.map(i=>i.cat));
  const cats = orden.filter(cat=> cat==="Todos" || catsPresentes.has(cat));
  c.innerHTML='';
  cats.forEach(cat=>{
    const count = cat==="Todos"? MENU.length : MENU.filter(m=>m.cat===cat).length;
    const b=document.createElement('button');
    b.className=`btn-cat ${cat===categoriaActiva?'activo':''}`;
    b.textContent=`${cat} (${count})`;
    b.onclick=()=>{categoriaActiva=cat;document.querySelectorAll('.btn-cat').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');renderGrilla(cat);};
    c.appendChild(b);
  });
}
function renderGrilla(cat){const cont=document.getElementById('grillaProductos');cont.innerHTML='';const filtrados=cat==='Todos'?MENU:MENU.filter(m=>m.cat===cat);filtrados.forEach(prod=>{const agot=!!agotados[prod.nombre];const card=document.createElement('div');card.className=`card-prod ${agot?'agotado':''}`;card.onclick=()=>{if(agot){alert('AGOTADO');return;}const ex=carrito.find(i=>i.id===prod.id);if(ex)ex.cantidad++;else carrito.push({...prod,cantidad:1});renderCarrito();};card.innerHTML=`<div style="font-size:11px;font-weight:bold">${prod.nombre}</div><div style="color:#2ecc71;font-size:11px">$${prod.precio}</div>`;cont.appendChild(card);});}
function renderCarrito(){const cont=document.getElementById('resumenComanda');const tot=document.getElementById('totalMonto');cont.innerHTML='';if(!carrito.length){cont.innerHTML='<p style="color:#666;font-size:11px">No hay ítems</p>';tot.textContent='$0';return;}let total=0;carrito.forEach(it=>{total+=it.precio*it.cantidad;const r=document.createElement('div');r.style.cssText='display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #222';r.innerHTML=`<span>${it.cantidad}x ${it.nombre}</span><span>$${it.precio*it.cantidad}</span>`;cont.appendChild(r);});tot.textContent=`$${total}`;}
function evaluarCanalSeleccionado(){document.getElementById('boxDelivery').style.display=document.getElementById('selectUbicacion').value.includes('Delivery')?'block':'none';}
function enviarOActualizarComanda(){
 if(!carrito.length){alert("Seleccioná productos");return;}
 const destino=document.getElementById('selectUbicacion').value;
 db.ref('comandas_activas/'+destino).once('value').then(snap=>{
  const ex=snap.val();
  let itemsFinal=[];
  const nuevoItems = carrito.map(c=>({n:c.nombre, nombre:c.nombre, cantidad:c.cantidad, p:c.precio, precio:c.precio, cat:c.cat, estadoItem:'PENDIENTE'}));
  if(ex && ex.items){
    const mapa={};
    ex.items.forEach(i=>{mapa[getNombre(i)]={...i, n:getNombre(i), nombre:getNombre(i), cantidad:getCant(i), p:getPrecio(i), precio:getPrecio(i), estadoItem:i.estadoItem||'PENDIENTE'}});
    nuevoItems.forEach(n=>{
      const nom=getNombre(n);
      if(mapa[nom] && mapa[nom].estadoItem!=='MANOS_EN_MESA'){
        mapa[nom].cantidad+=getCant(n);
      } else if(mapa[nom] && mapa[nom].estadoItem==='MANOS_EN_MESA'){
        // si ya estaba en manos y piden de nuevo, es nuevo pedido -> PENDIENTE
        mapa[nom+'_'+Date.now()]=n;
      } else {
        mapa[nom]=n;
      }
    });
    itemsFinal=Object.values(mapa);
  } else {
    itemsFinal=nuevoItems;
  }
  const totalFinal=itemsFinal.reduce((a,c)=>a+(getPrecio(c)*getCant(c)),0);
  const ahora=Date.now();
  const data={
    mesa:destino,
    items:itemsFinal,
    total:totalFinal,
    total_cobrado:ex? (ex.total_cobrado||ex.total||totalFinal) : totalFinal,
    estado:ex? (ex.estado==='OCUPADA_SILENCIOSA'?'RECIBIDO':ex.estado) :'RECIBIDO',
    estado_parrilla:ex? (ex.estado_parrilla==='MANOS_EN_MESA'?'RECIBIDO':ex.estado_parrilla) : 'RECIBIDO',
    estado_cocina:ex? (ex.estado_cocina==='MANOS_EN_MESA'?'RECIBIDO':ex.estado_cocina) : 'RECIBIDO',
    emisor:'Mariana',
    hora:new Date().toLocaleTimeString().slice(0,5),
    timestamp:ex?ex.timestamp:ahora,
    timestamp_estado:ahora,
    id:ex?ex.id:ahora,
    nroOrden:ex?ex.nroOrden:ahora
  };
  db.ref('comandas_activas/'+destino).set(data);
  carrito=[];renderCarrito();
  db.ref('mensajes_chat').push({remitente:'Mariana',texto:`${destino} -> ${itemsFinal.filter(i=>getEstadoItem(i)==='PENDIENTE').map(i=>getNombre(i)).join(', ')}`,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});
 });
}
function escucharOrdenesFirebase(){
 db.ref('comandas_activas').on('value',snap=>{
  const data=snap.val()||{}; comandasCache=data;
  listadoMesasBase.forEach(id=>{const m=mesasDOM[id];if(m){m.card.className='card-mesa-grid';m.badge.textContent='LIBRE';m.preview.textContent='Sin comanda';m.total.textContent='$0';m.timer.textContent='--:--';}});
  let pend=0,ocup=0,esperandoMozo=0,cobr=0;
  const lista=document.getElementById('listaPendientesKDS');lista.innerHTML='';
  Object.entries(data).forEach(([fbKey,cmd])=>{
   if(!cmd||!cmd.mesa) return;
   const mesaReal = cmd.mesa || fbKey;
   const m=mesasDOM[mesaReal] || mesasDOM[fbKey];
   if(!m) return;
   const items = cmd.items||[];
   const tienePendiente = items.some(i=>getEstadoItem(i)==='PENDIENTE' || getEstadoItem(i)==='EN_COCINA');
   const tieneEsperando = items.some(i=>getEstadoItem(i)==='ENTREGADO_SECTOR');
   const todoEnManos = items.length>0 && items.every(i=>getEstadoItem(i)==='MANOS_EN_MESA');
   const esCobrada=(cmd.estado||'').toUpperCase()==='COBRADA';
   ocup++;
   const ts=cmd.timestamp_estado||cmd.timestamp||Date.now();
   const seg=Math.floor((Date.now()-(cmd.timestamp||Date.now()))/1000);
   const mm=String(Math.floor(seg/60)).padStart(2,'0'); const ss=String(seg%60).padStart(2,'0');
   if(!esCobrada && (tienePendiente||tieneEsperando)) pend++;
   if(tieneEsperando) esperandoMozo++;
   if(esCobrada){cobr++; m.card.classList.add('cobrada'); m.badge.textContent=`💰 COBRADA $${cmd.total_cobrado||cmd.total}`; m.badge.style.background='#f1c40f'; m.badge.style.color='#000'; m.preview.innerHTML=`💰 $${cmd.total_cobrado||cmd.total}<br>${items.map(i=>getNombre(i)).join(', ')}`;}
   else if(todoEnManos){
     m.card.classList.add('manos-ok');
     m.badge.textContent=`OCUPADA - MANOS OK`;
     m.badge.style.background='#555'; m.badge.style.color='#fff';
     m.preview.innerHTML=items.map(i=>`<span class="tachado">• ${getCant(i)}x ${getNombre(i)}</span>`).join('<br>') + '<br><small style="color:#888">Esperando nuevo pedido o cierre</small>';
   } else if(tieneEsperando){
     m.card.classList.add('ocupada'); m.card.classList.add('esperando-mozo');
     m.badge.textContent=`✋ ENTREGADO - ESPERA MOZO`;
     m.badge.style.background='#f1c40f'; m.badge.style.color='#000';
     m.preview.innerHTML=items.map(i=>{
       if(getEstadoItem(i)==='MANOS_EN_MESA') return `<span class="tachado">• ${getCant(i)}x ${getNombre(i)}</span>`;
       if(getEstadoItem(i)==='ENTREGADO_SECTOR') return `<span class="entregado-sector">• ${getCant(i)}x ${getNombre(i)} ✋</span>`;
       return `• ${getCant(i)}x ${getNombre(i)}`;
     }).join('<br>');
   } else {
     m.card.classList.add('ocupada');
     m.badge.textContent=`${getTipo(items)} P:${cmd.estado_parrilla||cmd.estado} C:${cmd.estado_cocina||cmd.estado}`;
     m.preview.innerHTML=items.map(i=>{
       if(getEstadoItem(i)==='MANOS_EN_MESA') return `<span class="tachado">• ${getCant(i)}x ${getNombre(i)}</span>`;
       return `• ${getCant(i)}x ${getNombre(i)}`;
     }).join('<br>');
   }
   m.total.textContent=`$${cmd.total_cobrado||cmd.total||0}`; m.timer.textContent=`${mm}:${ss}`;
   if(!esCobrada &&!todoEnManos){
     const d=document.createElement('div'); d.style.cssText="background:#222;padding:6px;border-radius:4px;margin-bottom:4px";
     d.innerHTML=`<strong>${mesaReal}</strong> ${getTipo(items)} ${tieneEsperando?'✋ ESPERA MOZO':''} - ${items.filter(i=>getEstadoItem(i)!=='MANOS_EN_MESA').map(i=>getNombre(i)).join(', ')}`;
     lista.appendChild(d);
   }
  });
  document.getElementById('contadorPendientes').textContent=pend; document.getElementById('contadorMesasAtendidas').textContent=ocup; document.getElementById('contadorMixtas').textContent=esperandoMozo; document.getElementById('contadorCobradas').textContent=cobr;
 });
}
function escucharMensajesFirebase(){db.ref('mensajes_chat').limitToLast(20).on('value',snap=>{const box=document.getElementById('chatMensajes');box.innerHTML='';const data=snap.val();if(!data)return;Object.values(data).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(m=>{const d=document.createElement('div');d.className='chat-msg';d.innerHTML=`<strong>${m.remitente}</strong> (${m.hora||''})<br>${m.texto}`;box.appendChild(d);});box.scrollTop=box.scrollHeight;});}
function checkAlarmas(){Object.values(comandasCache).forEach(cmd=>{if(!cmd.mesa)return;const items=cmd.items||[];const tieneEsperando=items.some(i=>getEstadoItem(i)==='ENTREGADO_SECTOR');const tienePend=items.some(i=>getEstadoItem(i)==='PENDIENTE');if(tieneEsperando || tienePend){const ts=cmd.timestamp_estado||cmd.timestamp||Date.now();const mins=(Date.now()-ts)/1000/60;let debe=null;if(tieneEsperando && mins>=1) debe='ESPERA_MOZO'; else if(tienePend && mins>=5) debe='RECIBIDO'; if(debe){const k=(cmd.mesa)+'_'+debe;if(!ultimaAlarma[k]||Date.now()-ultimaAlarma[k]>30000){alarmaTipo(debe);ultimaAlarma[k]=Date.now();}}}});}
function clickUbicacion(id){
  idMesaGestion=id;
  const cmd=comandasCache[id] || Object.values(comandasCache).find(c=>c.mesa===id);
  document.getElementById('tituloOpcionesMesa').textContent=`Gestionar: ${id}`;
  document.getElementById('btnsExtras').innerHTML='';
  if(cmd){
    const items = cmd.items||[];
    let itemsHtml = items.map(i=>{
      let est = getEstadoItem(i);
      let cls = est==='MANOS_EN_MESA'? 'tachado' : (est==='ENTREGADO_SECTOR'? 'entregado-sector' : '');
      return `<div class="${cls}">• ${getCant(i)}x ${getNombre(i)} $${getPrecio(i)} <small style="color:#f1c40f">[${est}]</small></div>`;
    }).join('');
    let tieneEsperandoMozo = items.some(i=>getEstadoItem(i)==='ENTREGADO_SECTOR');
    let pendientesParaImprimir = items.filter(i=>getEstadoItem(i)!=='MANOS_EN_MESA');
    document.getElementById('detalleEstadosSeparados').innerHTML=`${getTipo(items)}<br>P: ${cmd.estado_parrilla||cmd.estado} C: ${cmd.estado_cocina||cmd.estado}<br><br>${itemsHtml}<br><br>Total $${cmd.total_cobrado||cmd.total}`;
    let extraBtns='';
    if(tieneEsperandoMozo){
      extraBtns+=`<button class="btn-manos" onclick="marcarManosEnMesa('${id}')">✋ MANOS EN MESA - APAGAR ALARMA</button>`;
    }
    if(pendientesParaImprimir.length>0){
      extraBtns+=`<button class="btn-print" onclick="imprimirSoloPendientes('${id}')">🖨️ IMPRIMIR SOLO PENDIENTES (${pendientesParaImprimir.length})</button>`;
    } else {
      extraBtns+=`<button class="btn-print" disabled style="opacity:0.4">🖨️ NADA PARA IMPRIMIR - TODO EN MANOS</button>`;
    }
    document.getElementById('btnsExtras').innerHTML=extraBtns;
    document.getElementById('btnAgregar').style.display=(cmd.estado==='COBRADA')?'none':'block';
  }else{
    document.getElementById('detalleEstadosSeparados').innerHTML='Mesa libre';
    document.getElementById('btnAgregar').style.display='none';
  }
  document.getElementById('modalOpcionesMesa').style.display='flex';
}
function seleccionarMesaParaAgregar(){document.getElementById('selectUbicacion').value=idMesaGestion;cerrarModal('modalOpcionesMesa');}
function verDetalleMesaModal(){const cmd=comandasCache[idMesaGestion]||Object.values(comandasCache).find(c=>c.mesa===idMesaGestion);alert(cmd?`${cmd.mesa} $${cmd.total_cobrado||cmd.total}\n${(cmd.items||[]).map(i=>`${getNombre(i)} [${getEstadoItem(i)}]`).join('\n')}`:'Libre');}
function cobrarMesa(){
 if(!idMesaGestion) return;
 const cmd=comandasCache[idMesaGestion] || Object.values(comandasCache).find(c=>c.mesa===idMesaGestion);
 if(!cmd || (cmd.estado||'').toUpperCase()!=='COBRADA'){alert('Solo se puede liberar cuando está COBRADA por Gustavo'); return;}
 if(!confirm(`Liberar ${idMesaGestion}? Se borra de comandas_activas`)) return;
 db.ref('comandas_activas/'+idMesaGestion).remove();
 cerrarModal('modalOpcionesMesa');
}
function marcarManosEnMesa(mesaId){
  const cmd = comandasCache[mesaId];
  if(!cmd ||!cmd.items) return;
  let nuevosItems = cmd.items.map(it=>{
    if(getEstadoItem(it)==='ENTREGADO_SECTOR'){
      return {...it, estadoItem:'MANOS_EN_MESA', fechaManos:Date.now()};
    }
    return it;
  });
  db.ref('comandas_activas/'+mesaId+'/items').set(nuevosItems).then(()=>{
    let quedaAlgo = nuevosItems.some(i=> getEstadoItem(i)!=='MANOS_EN_MESA');
    if(!quedaAlgo){
      db.ref('comandas_activas/'+mesaId).update({
        estado:'OCUPADA_SILENCIOSA',
        estado_parrilla:'MANOS_EN_MESA',
        estado_cocina:'MANOS_EN_MESA',
        timestamp_estado:Date.now()
      });
    }
  });
  cerrarModal('modalOpcionesMesa');
}
function imprimirSoloPendientes(mesaId){
  const cmd = comandasCache[mesaId];
  if(!cmd) return;
  let pendientes = (cmd.items||[]).filter(i=> getEstadoItem(i)!=='MANOS_EN_MESA');
  if(!pendientes.length){ alert('Nada para imprimir, todo ya está en MANOS'); return; }
  let html = `
    <html><head><title>Comanda ${mesaId}</title>
    <style>body{font-family:monospace;font-size:14px;width:80mm} h3{text-align:center;margin:0}.tachado{text-decoration:line-through}</style>
    </head><body>
      <h3>LA PERSEVERANCIA</h3>
      <p style="text-align:center">${mesaId} - ${new Date().toLocaleString('es-AR')}</p>
      <hr>
      <strong>SOLO PENDIENTES / POR ENTREGAR:</strong><br><br>
      ${pendientes.map(i=>`${getCant(i)}x ${getNombre(i)} - $${getPrecio(i)} [${getEstadoItem(i)}]`).join('<br>')}
      <hr>
      <p>TOTAL MESA: $${cmd.total_cobrado||cmd.total}</p>
      <p style="font-size:10px">Impresion inteligente - No incluye items en MANOS (${(cmd.items||[]).filter(i=>getEstadoItem(i)==='MANOS_EN_MESA').length} tachados)</p>
      <script>window.onload=()=>{window.print(); setTimeout(()=>window.close(),500)}<\/script>
    </body></html>
  `;
  let w = window.open('','','width=400,height=600');
  w.document.write(html);
  w.document.close();
}
function enviarMensajeChat(){const inp=document.getElementById('inputMensaje');if(!inp.value.trim())return;db.ref('mensajes_chat').push({remitente:'Mariana',texto:inp.value,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});inp.value='';}
function cerrarModal(id){document.getElementById(id).style.display='none';}
function abrirPropinas(){
  document.getElementById('modalPropinas').style.display='flex';
  db.ref('propinas_dia').once('value').then(s=>{
    let tot=0, html='', count=0;
    Object.values(s.val()||{}).forEach(r=>{tot+=parseInt(r.monto||0); count++; html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:6px 0"><span>${new Date(r.timestamp).toLocaleTimeString()} - ${r.mesa||''}</span><b style="color:#3498db">$${r.monto}</b></div>`;});
    document.getElementById('tPropHoy').innerText='$'+tot; document.getElementById('tMesasCob').innerText=count; document.getElementById('listaPropinasDet').innerHTML=html||'Sin propinas hoy';
  });
}
