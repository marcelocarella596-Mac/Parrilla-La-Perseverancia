<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comandera Mariana | La Perseverancia</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
    body{background:#121212;color:#fff;padding:10px}
    header{background:#8b0000;padding:12px 18px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
    header h1{font-size:1.2rem;font-weight:bold;text-transform:uppercase;color:#fff}
   .header-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
   .btn-top{background:#2c3e50;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer}
   .info-widget{background:rgba(0,0,0,.3);padding:5px 10px;border-radius:4px;font-size:11px;font-weight:bold;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.1)}
   .badge-live{background:#000;color:#2ecc71;font-size:11px;font-weight:bold;padding:4px 10px;border-radius:4px;border:1px solid #2ecc71}
   .layout-principal{display:grid;grid-template-columns:340px 1fr 300px;gap:15px}
    @media(max-width:1200px){.layout-principal{grid-template-columns:320px 1fr}.panel-derecho{grid-column:1/-1}}
   .panel-formulario{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;height:fit-content}
   .seccion-titulo{font-size:11px;font-weight:bold;color:#ffc107;text-transform:uppercase;margin-bottom:4px}
   .row-ubicacion{display:grid;grid-template-columns:2fr 1fr;gap:8px}
    select,input{width:100%;padding:8px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;font-size:12px;outline:none}
   .box-delivery{background:#1a1a1a;border:1px dashed #e67e22;padding:8px;border-radius:5px;display:flex;flex-direction:column;gap:6px}
   .contenedor-categorias{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px}
   .btn-cat{background:#222;border:1px solid #444;color:#ccc;padding:6px 10px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap}
   .btn-cat.activo{background:#8b0000;color:#fff;border-color:#e74c3c}
   .grilla-productos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:220px;overflow-y:auto;background:#121212;padding:8px;border-radius:6px;border:1px solid #222}
   .card-prod{background:#252525;border:1px solid #444;border-radius:5px;padding:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:60px}
   .card-prod.nombre{font-size:11px;font-weight:bold;color:#fff;line-height:1.2}
   .card-prod.precio{font-size:11px;font-weight:bold;color:#2ecc71;margin-top:4px}
   .resumen-box{background:#111;border:1px solid #333;border-radius:6px;padding:8px;min-height:100px;max-height:130px;overflow-y:auto}
   .item-carrito{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #222;font-size:11px}
   .cnt-ctrls{display:flex;align-items:center;gap:5px}
   .btn-qty{background:#444;color:#fff;border:none;width:18px;height:18px;border-radius:3px;cursor:pointer;font-weight:bold}
   .total-bar{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:14px;padding:4px 0;color:#ffc107}
   .btn-enviar{width:100%;background:#e74c3c;border:none;color:#fff;padding:10px;font-size:12px;font-weight:bold;border-radius:6px;cursor:pointer;text-transform:uppercase}
   .panel-produccion{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:15px}
   .mapa-contenedor{background:#121212;border:1px dashed #444;border-radius:8px;padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;min-height:520px;align-content:start}
   .card-mesa-grid{background:#1a1a1a;border:2px solid #8b0000;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;min-height:140px;cursor:pointer}
   .card-mesa-grid.ocupada{border-color:#27ae60;background:#17202a}
   .mesa-hdr-grid{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:4px;margin-bottom:6px}
   .mesa-title-grid{font-size:12px;font-weight:bold;color:#ffc107}
   .mesa-status-badge{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:bold;background:#333;color:#aaa}
   .card-mesa-grid.ocupada.mesa-status-badge{background:#27ae60;color:#fff}
   .mesa-body-preview{font-size:10px;color:#ccc;flex-grow:1;overflow-y:auto;max-height:70px}
   .mesa-footer-grid{border-top:1px solid #333;padding-top:4px;margin-top:4px;display:flex;justify-content:space-between;font-size:11px;font-weight:bold;color:#2ecc71}
   .panel-derecho{display:flex;flex-direction:column;gap:15px}
   .box-kds-mini,.box-mensajes{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:12px}
   .lista-pendientes{max-height:180px;overflow-y:auto;font-size:11px;color:#ccc;margin-top:8px}
   .chat-box{background:#111;border:1px solid #333;border-radius:6px;height:160px;overflow-y:auto;padding:8px;font-size:11px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
   .chat-msg{background:#222;padding:5px 8px;border-radius:4px;border-left:3px solid #2980b9}
   .chat-msg.mio{border-left-color:#e74c3c}
   .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:1000}
   .modal-contenido{background:#1e1e1e;border:1px solid #444;border-radius:8px;padding:20px;width:90%;max-width:450px}
   .modal-hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:15px}
   .btn-cerrar-modal{background:none;border:none;color:#999;font-size:18px;cursor:pointer}
   .btn-opcion-mesa{width:100%;padding:10px;margin-bottom:8px;border:none;border-radius:5px;font-weight:bold;font-size:12px;cursor:pointer}
  </style>
</head>
<body>
  <header>
    <h1>🔥 LA PERSEVERANCIA | COMANDERA MARIANA 🔥</h1>
    <div class="header-btns">
      <div class="info-widget" id="relojWidget">🕒 --:--:--</div>
      <div class="info-widget">🪑 Activas: <span id="contadorMesasAtendidas">0</span></div>
      <span class="badge-live">• EN VIVO</span>
    </div>
  </header>
  <div class="layout-principal">
    <aside class="panel-formulario">
      <div class="seccion-titulo">1. Ubicación y Cliente</div>
      <div class="row-ubicacion">
        <select id="selectUbicacion" onchange="evaluarCanalSeleccionado()">
          <optgroup label="Salón"><option>Salón - Mesa 1</option><option>Salón - Mesa 2</option><option>Salón - Mesa 3</option><option>Salón - Mesa 4</option></optgroup>
          <optgroup label="Vereda"><option>Vereda - Mesa 5</option><option>Vereda - Mesa 6</option><option>Vereda - Mesa 7</option></optgroup>
          <optgroup label="Canales"><option>Mostrador</option><option>Delivery</option><option>Pickup</option></optgroup>
        </select>
        <select id="selectComensales"><option value="1">1 Pers.</option><option value="2" selected>2 Pers.</option><option value="4">4 Pers.</option></select>
      </div>
      <div id="boxDelivery" class="box-delivery" style="display:none;"><div style="font-size:10px;color:#ffc107;font-weight:bold;">🛵 DATOS DELIVERY</div><input id="delivNombre" placeholder="Nombre"><input id="delivDireccion" placeholder="Dirección"><input id="delivTelefono" placeholder="Tel"></div>
      <div class="seccion-titulo">2. Menú (RTDB)</div>
      <div class="contenedor-categorias" id="contenedorCategorias"><button class="btn-cat activo" onclick="filtrarCategoria('Todos',this)">Todos</button></div>
      <div class="grilla-productos" id="grillaProductos"><div style="color:#666;font-size:11px;text-align:center;grid-column:span 2;margin-top:20px;">Cargando menú...</div></div>
      <div class="seccion-titulo">3. Selección Actual</div>
      <div class="resumen-box" id="resumenComanda"><p style="color:#666;font-size:11px;text-align:center;margin-top:15px;">No hay ítems.</p></div>
      <div class="total-bar"><span>TOTAL:</span><span id="totalMonto">$0</span></div>
      <button class="btn-enviar" onclick="enviarOActualizarComanda()">🚀 ENVIAR COMANDA</button>
    </aside>
    <main class="panel-produccion"><div class="seccion-titulo" style="margin-bottom:10px;">📍 PLANO DE MESAS</div><div class="mapa-contenedor" id="mapaMesasGrid"></div></main>
    <aside class="panel-derecho">
      <div class="box-kds-mini"><div class="seccion-titulo">📋 PENDIENTES (<span id="contadorPendientes">0</span>)</div><div class="lista-pendientes" id="listaPendientesKDS"></div></div>
      <div class="box-mensajes"><div class="seccion-titulo">💬 MENSAJES</div><div class="chat-box" id="chatMensajes"></div><input id="inputMensaje" placeholder="Escribir aviso..." onkeypress="if(event.key==='Enter') enviarMensajeChat()"><button class="btn-top" style="margin-top:6px;width:100%;padding:8px;background:#2980b9;" onclick="enviarMensajeChat()">Enviar</button></div>
    </aside>
  </div>
  <div class="modal-overlay" id="modalOpcionesMesa"><div class="modal-contenido"><div class="modal-hdr"><h3 id="tituloOpcionesMesa" style="color:#ffc107;font-size:14px;">Gestionar</h3><button class="btn-cerrar-modal" onclick="cerrarModal('modalOpcionesMesa')">✕</button></div><button class="btn-opcion-mesa" style="background:#27ae60;color:#fff;" onclick="seleccionarMesaParaAgregar()">➕ AGREGAR ÍTEMS</button><button class="btn-opcion-mesa" style="background:#444;color:#fff;" onclick="cerrarModal('modalOpcionesMesa')">CANCELAR</button></div></div>
<script>
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.database();
let MENU=[], categoriaActiva='Todos', carrito=[], comandasActivas={}, idMesaGestion=null;
const listadoMesasBase=["Salón - Mesa 1","Salón - Mesa 2","Salón - Mesa 3","Salón - Mesa 4","Vereda - Mesa 5","Vereda - Mesa 6","Vereda - Mesa 7","Mostrador","Delivery","Pickup"];
let mesasDOM={};
window.onload=()=>{ inicializarMapaMesas(); escucharMenuFirebase(); escucharOrdenesFirebase(); escucharMensajesFirebase(); setInterval(()=>{ document.getElementById('relojWidget').textContent='🕒 '+new Date().toLocaleTimeString(); },1000); };
function inicializarMapaMesas(){ const c=document.getElementById('mapaMesasGrid'); c.innerHTML=''; mesasDOM={}; listadoMesasBase.forEach(id=>{ const key=id.replace(/\s+/g,'_').replace(/-/g,'_'); const card=document.createElement('div'); card.className='card-mesa-grid'; card.id='mesa_card_'+key; card.onclick=()=>clickUbicacion(id); card.innerHTML=`<div class=mesa-hdr-grid><span class=mesa-title-grid>${id.toUpperCase()}</span><span class=mesa-status-badge id=badge_${key}>LIBRE</span></div><div class=mesa-body-preview id=preview_${key}>Sin comanda</div><div class=mesa-footer-grid><span>Total:</span><span id=total_${key}>$0</span></div>`; c.appendChild(card); mesasDOM[id]={card,badge:document.getElementById(`badge_${key}`),preview:document.getElementById(`preview_${key}`),total:document.getElementById(`total_${key}`)}; }); }
function escucharMenuFirebase(){ db.ref('menu').on('value',s=>{ const data=s.val(); if(!data) return; MENU=Object.keys(data).map(k=>{ const item=data[k]; if(!item) return null; return{id:k,nombre:item.nombre||k,cat:item.cat||item.categoria||'General',precio:Number(item.precio||0)}}).filter(Boolean); construirBotonesCategorias(); renderGrilla(categoriaActiva); }); }
function construirBotonesCategorias(){ const c=document.getElementById('contenedorCategorias'); const cats=['Todos',...new Set(MENU.map(i=>i.cat))]; c.innerHTML=''; cats.forEach(cat=>{ const b=document.createElement('button'); b.className=`btn-cat ${cat===categoriaActiva?'activo':''}`; b.textContent=cat; b.onclick=()=>filtrarCategoria(cat,b); c.appendChild(b); }); }
function filtrarCategoria(cat,btn){ categoriaActiva=cat; document.querySelectorAll('.btn-cat').forEach(b=>b.classList.remove('activo')); if(btn) btn.classList.add('activo'); renderGrilla(cat); }
function renderGrilla(cat){ const c=document.getElementById('grillaProductos'); c.innerHTML=''; const f=(cat==='Todos')?MENU:MENU.filter(m=>m.cat===cat); if(!f.length){ c.innerHTML='<p style="color:#666;font-size:11px;text-align:center;grid-column:span 2;">Sin productos.</p>'; return; } f.forEach(prod=>{ const card=document.createElement('div'); card.className='card-prod'; card.onclick=()=>agregarAlCarrito(prod); card.innerHTML=`<div class=nombre>${prod.nombre}</div><div class=precio>$${prod.precio.toLocaleString('es-AR')}</div>`; c.appendChild(card); }); }
function agregarAlCarrito(prod){ const e=carrito.find(i=>i.id===prod.id); if(e) e.cantidad++; else carrito.push({...prod,cantidad:1}); renderCarrito(); }
function cambiarCantidad(id,d){ const it=carrito.find(i=>i.id===id); if(it){ it.cantidad+=d; if(it.cantidad<=0) carrito=carrito.filter(i=>i.id!==id); } renderCarrito(); }
function renderCarrito(){ const cont=document.getElementById('resumenComanda'); const tot=document.getElementById('totalMonto'); cont.innerHTML=''; if(!carrito.length){ cont.innerHTML='<p style="color:#666;font-size:11px;text-align:center;margin-top:15px;">No hay ítems.</p>'; tot.textContent='$0'; return; } let t=0; carrito.forEach(i=>{ t+=i.precio*i.cantidad; const row=document.createElement('div'); row.className='item-carrito'; row.innerHTML=`<div><strong>${i.nombre}</strong><br><small style="color:#2ecc71;">$${i.precio}</small></div><div class=cnt-ctrls><button class=btn-qty onclick="cambiarCantidad('${i.id}',-1)">-</button><span>${i.cantidad}</span><button class=btn-qty onclick="cambiarCantidad('${i.id}',1)">+</button></div>`; cont.appendChild(row); }); tot.textContent=`$${t.toLocaleString('es-AR')}`; }
function evaluarCanalSeleccionado(){ const canal=document.getElementById('selectUbicacion').value; document.getElementById('boxDelivery').style.display=canal.includes('Delivery')?'flex':'none'; }
function enviarOActualizarComanda(){
 if(!carrito.length){ alert("Seleccioná producto"); return; }
 const destino=document.getElementById('selectUbicacion').value;
 const total=carrito.reduce((a,c)=>a+(c.precio*c.cantidad),0);
 const orden={mesa:destino,items:carrito,total,estado:'PENDIENTE',emisor:'Mariana',timestamp:Date.now()};
 // USA PUSH PARA NO PISAR - FIX CRITICO
 db.ref('comandas_activas').push(orden, err=>{
  if(!err){ alert(`✅ Enviada ${destino}`); carrito=[]; renderCarrito(); } else alert(err.message);
 });
}
function escucharOrdenesFirebase(){
 db.ref('comandas_activas').on('value',s=>{
  const data=s.val();
  listadoMesasBase.forEach(id=>{ const m=mesasDOM[id]; if(m){ m.card.classList.remove('ocupada'); m.badge.textContent='LIBRE'; m.preview.textContent='Sin comanda'; m.total.textContent='$0'; } });
  const lista=document.getElementById('listaPendientesKDS'); lista.innerHTML=''; let pend=0,ocup=0;
  if(data){
   Object.keys(data).forEach(k=>{
    const cmd=data[k]; if(!cmd) return;
    if(cmd.estado==='PENDIENTE'){ pend++; const div=document.createElement('div'); div.style.cssText="background:#222;padding:6px;border-radius:4px;margin-bottom:4px;border-left:3px solid #ffc107;"; div.innerHTML=`<strong>${cmd.mesa}</strong> (${cmd.estado})<br><small>${(cmd.items||[]).length} ítems - $${cmd.total||0}</small>`; lista.appendChild(div); }
    if(cmd.mesa && mesasDOM[cmd.mesa]){ const m=mesasDOM[cmd.mesa]; if(!m.card.classList.contains('ocupada')) ocup++; m.card.classList.add('ocupada'); m.badge.textContent=cmd.estado; m.preview.innerHTML=(cmd.items||[]).map(i=>`• ${i.cantidad}x ${i.nombre}`).join('<br>'); m.total.textContent=`$${(cmd.total||0).toLocaleString('es-AR')}`; }
   });
  }
  document.getElementById('contadorPendientes').textContent=pend;
  document.getElementById('contadorMesasAtendidas').textContent=ocup;
  if(pend===0) lista.innerHTML='<div style="color:#666;text-align:center;padding:10px;">Sin pendientes.</div>';
 });
}
function clickUbicacion(id){ idMesaGestion=id; document.getElementById('tituloOpcionesMesa').textContent=`Gestionar: ${id}`; document.getElementById('modalOpcionesMesa').style.display='flex'; }
function seleccionarMesaParaAgregar(){ document.getElementById('selectUbicacion').value=idMesaGestion; evaluarCanalSeleccionado(); cerrarModal('modalOpcionesMesa'); }
function enviarMensajeChat(){ const inp=document.getElementById('inputMensaje'); const txt=inp.value.trim(); if(!txt) return; db.ref('mensajes').push({emisor:'Mariana',texto:txt,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()}, err=>{ if(!err) inp.value=''; }); }
function escucharMensajesFirebase(){ db.ref('mensajes').limitToLast(20).on('value',s=>{ const box=document.getElementById('chatMensajes'); box.innerHTML=''; const data=s.val(); if(!data) return; Object.keys(data).forEach(k=>{ const m=data[k]; const div=document.createElement('div'); div.className=`chat-msg ${m.emisor==='Mariana'?'mio':''}`; div.innerHTML=`<strong>${m.emisor}</strong> <small>(${m.hora})</small><br>${m.texto}`; box.appendChild(div); }); box.scrollTop=box.scrollHeight; }); }
function cerrarModal(id){ document.getElementById(id).style.display='none'; }
</script>
</body></html>
