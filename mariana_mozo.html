<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comandera Mariana (Mozo) | Parrilla La Perseverancia</title>
  
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0e0e0e;
      color: #ffffff;
      padding: 10px;
    }

    header {
      background: linear-gradient(90deg, #34495e, #2c3e50);
      padding: 10px 18px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    header h1 {
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-top-accion {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-top-accion:hover { filter: brightness(1.2); }
    .btn-mjes { background-color: #8e44ad; }

    .badge-live {
      background-color: #000;
      color: #00ff66;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #00ff66;
    }

    /* LAYOUT PRINCIPAL DE 3 COLUMNAS */
    .layout-principal {
      display: grid;
      grid-template-columns: 420px 1fr 340px;
      gap: 12px;
      align-items: start;
    }

    @media(max-width: 1400px) {
      .layout-principal { grid-template-columns: 420px 1fr; }
    }

    /* PANEL IZQUIERDO */
    .panel-formulario {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .seccion-titulo {
      font-size: 11px;
      font-weight: bold;
      color: #3498db;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .row-ubicacion {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    select, input, textarea {
      width: 100%;
      padding: 8px;
      background-color: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    .box-delivery {
      background-color: #1a1a1a;
      border: 1px dashed #e67e22;
      padding: 8px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .contenedor-categorias {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .btn-cat {
      background-color: #222;
      border: 1px solid #444;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .btn-cat:hover, .btn-cat.activo {
      background-color: #2980b9;
      color: #fff;
      border-color: #3498db;
    }

    .grilla-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
      background-color: #0d0d0d;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #222;
    }

    .card-prod {
      background-color: #1c1c1c;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 65px;
      transition: transform 0.1s, border-color 0.2s;
    }

    .card-prod:hover {
      border-color: #3498db;
      transform: scale(1.02);
    }

    .card-prod .nombre { font-size: 11px; font-weight: bold; color: #ffffff; line-height: 1.2; }
    .card-prod .precio { font-size: 11px; font-weight: bold; color: #00ff66; margin-top: 4px; }

    .resumen-box {
      background-color: #111;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 10px;
      min-height: 100px;
      max-height: 130px;
      overflow-y: auto;
    }

    .item-carrito {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #222;
      font-size: 12px;
    }

    .cnt-ctrls { display: flex; align-items: center; gap: 6px; }

    .btn-qty {
      background-color: #333;
      color: #fff;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }

    .total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 15px;
      padding: 4px 0;
      color: #3498db;
    }

    .btn-enviar {
      width: 100%;
      background: linear-gradient(180deg, #3498db, #2980b9);
      border: none;
      color: white;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
    }

    .btn-enviar:hover { background: linear-gradient(180deg, #5dade2, #3498db); }

    /* PANEL CENTRAL (PLANO DE MESAS) */
    .panel-produccion {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
    }

    .mapa-contenedor {
      background-color: #0b0b0b;
      border: 1px dashed #333;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 10px;
      min-height: 530px;
      align-content: start;
    }

    .mesa-card-ampliada {
      background-color: #1b1b1b;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 135px;
      transition: 0.2s;
      position: relative;
    }

    .mesa-card-ampliada:hover { border-color: #3498db; transform: translateY(-2px); }
    .mesa-card-ampliada.ocupada { background-color: #152a3a; border-color: #2980b9; }
    .mesa-card-ampliada.lista { background-color: #113822; border-color: #27ae60; }

    .mesa-header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
      margin-bottom: 5px;
    }

    .mesa-nombre { font-size: 12px; font-weight: bold; color: #3498db; }
    .mesa-estado-badge { font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 4px; background: #222; color: #aaa; }
    .ocupada .mesa-estado-badge { background: #2980b9; color: #fff; }
    .lista .mesa-estado-badge { background: #27ae60; color: #fff; }

    .mesa-items-preview {
      font-size: 11px;
      color: #ddd;
      max-height: 55px;
      overflow-y: auto;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    /* ESTILOS DE DESTACADO PARA PARRILLA */
    .item-parrilla-destacado {
      color: #ff3d00 !important;
      font-weight: 900 !important;
      font-size: 11.5px !important;
      background: rgba(255, 61, 0, 0.18);
      padding: 2px 4px;
      border-radius: 3px;
      border-left: 3px solid #ff3d00;
      margin: 2px 0;
      display: block;
      text-transform: uppercase;
    }

    .mesa-footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: bold;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 4px;
      color: #00ff66;
    }

    /* PANEL DERECHO LATERAL (KDS Y MENSAJES) */
    .panel-lateral-derecho {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-kds-box, .panel-chat-box {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
    }

    .contenedor-kds-tarjetas {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .tarjeta-kds-flotante {
      background-color: #222;
      border: 1px solid #444;
      border-left: 4px solid #e67e22;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tarjeta-kds-flotante:hover { border-color: #ff6600; }
    .tarjeta-kds-flotante.alerta-amarilla { border-left-color: #f1c40f; background: #2c2811; }
    .tarjeta-kds-flotante.alerta-naranja { border-left-color: #e67e22; background: #331f11; }
    .tarjeta-kds-flotante.alerta-verde { border-left-color: #27ae60; background: #11331c; }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-contenido {
      background-color: #181818;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
    }

    .modal-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .btn-cerrar-modal { background: none; border: none; color: #999; font-size: 18px; cursor: pointer; }
