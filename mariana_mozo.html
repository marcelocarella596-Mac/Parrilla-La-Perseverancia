<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA PERSEVERANCIA | MARIANA - MOZOS</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0e0e0e;color:#fff;padding:10px}
header{background:linear-gradient(90deg,#ff9900,#e67e22);color:#000;padding:12px 16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
header small{font-size:11px;background:#000;color:#00ff66;padding:4px 10px;border-radius:12px;border:1px solid #00ff66}
.layout{display:grid;grid-template-columns:210px 1fr 360px;gap:12px;margin-top:12px}
.panel{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px}
.titulo{color:#ff9900;font-size:12px;font-weight:bold;margin-bottom:10px}
.mesa-btn{width:100%;padding:12px;margin-bottom:8px;background:#242424;border:2px solid #333;border-radius:8px;color:#fff;cursor:pointer;font-weight:bold;text-align:left;font-size:13px}
.mesa-btn.activa{background:#ff9900;color:#000;border-color:#ff9900}
.mesa-btn.ocupada{border-color:#c0392b;background:#2e1a1a}
.mesa-btn.ocupada::after{content:' ● OCUPADA';color:#ff5555;font-size:10px;float:right}
.prod{display:flex;justify-content:space-between;padding:10px;background:#252525;margin-bottom:6px;border-radius:8px;cursor:pointer;border:1px solid #333}
.prod:hover{border-color:#ff9900}
.prod b{color:#00ff66}
.item-carrito{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px dashed #333}
.btn-enviar{width:100%;background:#27ae60;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px}
.btn-cobrar{width:100%;background:#c0392b;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer}
.total-box{background:#000;border:1px solid #333;border-radius:8px;padding:12px;margin-top:10px;text-align:center}
.total-box span{color:#00ff66;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<header><span>🔥 MARIANA - MOZOS</span><small id="estado">● CONECTADA A PARRILLA Y COCINA</small></header>
<div class="layout">
<div class="panel"><div class="titulo">📍 Mesas</div><div id="listaMesas"></div></div>
<div class="panel"><div class="titulo">🍽️ Productos</div><div id="listaProd"></div></div>
<div class="panel"><div class="titulo">🧾 <span id="mesaActiva">-</span></div><div id="carrito" style="min-height:180px"></div><div class="total-box">TOTAL<br><span>$<span id="total">0</span></span></div><button class="btn-enviar" id="btnEnviar" onclick="enviarACocina()">📤 ENVIAR A COCINA / PARRILLA</button><button class="btn-cobrar" onclick="cerrarMesa()">💰 COBRAR Y CERRAR MESA</button></div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",
  authDomain: "parrilla-la-perseveranci-f3f54.firebaseapp.com",
  databaseURL: "https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",
  projectId: "parrilla-la-perseveranci-f3f54",
  storageBucket: "parrilla-la-perseveranci-f3f54.firebasestorage.app",
  messagingSenderId: "899082319184",
  appId: "1:899082319184:web:9876161963705785efe855"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const MESAS = ["Salón - Mesa 1","Salón - Mesa 2","Salón - Mesa 3","Salón - Mesa 4","Vereda - Mesa 5","Vereda - Mesa 6","Vereda - Mesa 7","Canal - Mostrador","Canal - Pickup","Canal - Delivery"];
const PRODUCTOS = [
{nombre:"Asado c/fritas",precio:8500},{nombre:"Asado 1/2",precio:6000},{nombre:"Vacío c/fritas",precio:8800},{nombre:"Vacío 1/2",precio:6200},{nombre:"Milanesa c/fritas",precio:5500},{nombre:"Milanesa c/fritas x2",precio:5500},{nombre:"Milanesa Napolitana",precio:6500},{nombre:"Chori c/fritas",precio:4000},{nombre:"Fritas grandes",precio:2500},{nombre:"Papas Fritas",precio:2200},{nombre:"Ensalada",precio:2000},{nombre:"Gaseosa 1.5L",precio:1800}
];
let mesaActual = MESAS[0];
let carritos = JSON.parse(localStorage.getItem('carritos_mariana_v4')||'{}');
let comandasActivas = {};
function idSeguro(n){return n.replace(/[^a-zA-Z0-9]/g,"_");}
db.ref('comandas_activas').on('value', snap=>{ comandasActivas = snap.val()||{}; renderMesas(); });
function renderMesas(){
  const div=document.getElementById('listaMesas'); div.innerHTML='';
  MESAS.forEach(m=>{
    const ocupada=!!comandasActivas[idSeguro(m)];
    const b=document.createElement('button'); b.className='mesa-btn'+(m===mesaActual?' activa':'')+(ocupada?' ocupada':''); b.textContent=m;
    b.onclick=()=>{mesaActual=m; renderTodo();}; div.appendChild(b);
  });
}
function renderProd(){
  const div=document.getElementById('listaProd'); div.innerHTML='';
  PRODUCTOS.forEach(p=>{
    const d=document.createElement('div'); d.className='prod'; d.innerHTML=`<span>${p.nombre}</span><b>$${p.precio.toLocaleString('es-AR')}</b>`;
    d.onclick=()=>{ if(!carritos[mesaActual]) carritos[mesaActual]=[]; const ex=carritos[mesaActual].find(x=>x.nombre===p.nombre); if(ex) ex.cantidad++; else carritos[mesaActual].push({nombre:p.nombre,precio:p.precio,cantidad:1}); localStorage.setItem('carritos_mariana_v4',JSON.stringify(carritos)); renderCarrito(); };
    div.appendChild(d);
  });
}
function renderCarrito(){
  const div=document.getElementById('carrito'); const items=carritos[mesaActual]||[]; div.innerHTML=''; let tot=0;
  if(items.length===0) div.innerHTML='<p style="color:#555;text-align:center;margin-top:30px">Mesa vacía</p>';
  items.forEach((it,i)=>{ tot+=it.precio*it.cantidad; const d=document.createElement('div'); d.className='item-carrito'; d.innerHTML=`<span>${it.cantidad}x ${it.nombre}</span><span>$${(it.precio*it.cantidad).toLocaleString('es-AR')} <b onclick="borrarItem(${i})" style="color:#ff4444;cursor:pointer">✕</b></span>`; div.appendChild(d); });
  document.getElementById('total').textContent=tot.toLocaleString('es-AR'); document.getElementById('mesaActiva').textContent=mesaActual; document.getElementById('btnEnviar').disabled=items.length===0;
}
function borrarItem(i){ carritos[mesaActual].splice(i,1); localStorage.setItem('carritos_mariana_v4',JSON.stringify(carritos)); renderCarrito(); }
function renderTodo(){ renderMesas(); renderProd(); renderCarrito(); }
function enviarACocina(){
  const items=carritos[mesaActual]||[]; if(items.length===0) return alert('Mesa vacía');
  let total=0; items.forEach(it=>total+=it.precio*it.cantidad);
  db.ref('comandas_activas/'+idSeguro(mesaActual)).set({mesa:mesaActual,items:items,total:total,estado:'PENDIENTE',timestamp:Date.now()}).then(()=>{ document.getElementById('estado').textContent='✅ ENVIADO'; setTimeout(()=>document.getElementById('estado').textContent='● CONECTADA A PARRILLA Y COCINA',2000); });
}
function cerrarMesa(){
  if(!confirm('¿Cobrar y cerrar '+mesaActual+'?')) return;
  db.ref('comandas_activas/'+idSeguro(mesaActual)).remove();
  carritos[mesaActual]=[]; localStorage.setItem('carritos_mariana_v4',JSON.stringify(carritos)); renderTodo();
}
renderTodo();
</script>
</body>
</html>
