<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comandera Mariana (Mozo) | Parrilla La Perseverancia</title>
  
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 10px;
    }

    header {
      background: #8b0000;
      padding: 12px 18px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-top {
      background-color: #2c3e50;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-top:hover { opacity: 0.85; }
    .btn-sonido-top { background-color: #d35400; }
    .btn-sonido-top.silenciado { background-color: #7f8c8d; }

    .info-widget {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .badge-live {
      background-color: #000;
      color: #2ecc71;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #2ecc71;
    }

    /* LAYOUT PRINCIPAL DE 3 COLUMNAS */
    .layout-principal {
      display: grid;
      grid-template-columns: 340px 1fr 300px;
      gap: 15px;
    }
    @media (max-width: 1200px) {
      .layout-principal { grid-template-columns: 320px 1fr; }
      .panel-derecho { grid-column: 1 / -1; }
    }

    /* PANEL IZQUIERDO: POS / FORMULARIO */
    .panel-formulario {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: fit-content;
    }

    .seccion-titulo {
      font-size: 11px;
      font-weight: bold;
      color: #ffc107;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .row-ubicacion {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      background-color: #111;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    .box-delivery {
      background-color: #1a1a1a;
      border: 1px dashed #e67e22;
      padding: 8px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* CATEGORÍAS */
    .contenedor-categorias {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .btn-cat {
      background-color: #222;
      border: 1px solid #444;
      color: #ccc;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .btn-cat:hover, .btn-cat.activo {
      background-color: #8b0000;
      color: #fff;
      border-color: #e74c3c;
    }

    /* GRILLA DE PRODUCTOS */
    .grilla-productos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      background-color: #121212;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #222;
    }

    .card-prod {
      background-color: #252525;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 60px;
      transition: transform 0.1s, border-color 0.2s;
    }
    .card-prod:hover { border-color: #ffc107; transform: scale(1.02); }
    .card-prod .nombre { font-size: 11px; font-weight: bold; color: #ffffff; line-height: 1.2; }
    .card-prod .precio { font-size: 11px; font-weight: bold; color: #2ecc71; margin-top: 4px; }

    /* RESUMEN DE COMANDA */
    .resumen-box {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      min-height: 100px;
      max-height: 130px;
      overflow-y: auto;
    }

    .item-carrito {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #222;
      font-size: 11px;
    }

    .cnt-ctrls { display: flex; align-items: center; gap: 5px; }

    .btn-qty {
      background-color: #444;
      color: #fff;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }

    .total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      padding: 4px 0;
      color: #ffc107;
    }

    .btn-enviar {
      width: 100%;
      background: #e74c3c;
      border: none;
      color: white;
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 8px rgba(231, 76, 60, 0.3);
    }
    .btn-enviar:hover { background: #c0392b; }

    /* PANEL CENTRAL: PLANO DE MESAS */
    .panel-produccion {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
    }

    .mapa-contenedor {
      background-color: #121212;
      border: 1px dashed #444;
      border-radius: 8px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      min-height: 520px;
      align-content: start;
    }

    .card-mesa-grid {
      background-color: #1a1a1a;
      border: 2px solid #8b0000;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card-mesa-grid:hover { border-color: #ffc107; box-shadow: 0 0 10px rgba(255,193,7,0.3); }
    .card-mesa-grid.ocupada { border-color: #27ae60; background-color: #17202a; }

    .mesa-hdr-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .mesa-title-grid { font-size: 12px; font-weight: bold; color: #ffc107; }
    .mesa-status-badge { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: bold; background: #333; color: #aaa; }
    .card-mesa-grid.ocupada .mesa-status-badge { background: #27ae60; color: #fff; }

    .mesa-body-preview {
      font-size: 10px;
      color: #ccc;
      flex-grow: 1;
      overflow-y: auto;
      max-height: 70px;
      line-height: 1.2;
    }

    .mesa-footer-grid {
      border-top: 1px solid #333;
      padding-top: 4px;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: bold;
      color: #2ecc71;
    }

    /* PANEL DERECHO: PENDIENTES & MENSAJES */
    .panel-derecho {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .box-kds-mini, .box-mensajes {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }

    .lista-pendientes {
      max-height: 180px;
      overflow-y: auto;
      font-size: 11px;
      color: #ccc;
      margin-top: 8px;
    }

    .chat-box {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 6px;
      height: 160px;
      overflow-y: auto;
      padding: 8px;
      font-size: 11px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-msg {
      background: #222;
      padding: 5px 8px;
      border-radius: 4px;
      border-left: 3px solid #2980b9;
    }
    .chat-msg.mio { border-left-color: #e74c3c; }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-contenido {
      background-color: #1e1e1e;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
    }

    .modal-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
