<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#121212;color:#fff;padding:10px}
header{background:#8b0000;padding:12px 18px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.btn-top{background:#2c3e50;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer}
.info-widget{background:rgba(0,0,0,.3);padding:5px 10px;border-radius:4px;font-size:11px;font-weight:bold;border:1px solid rgba(255,255,255,.1)}
.badge-live{background:#000;color:#2ecc71;font-size:11px;font-weight:bold;padding:4px 10px;border-radius:4px;border:1px solid #2ecc71}
.layout-principal{display:grid;grid-template-columns:340px 1fr 320px;gap:15px}
.panel-formulario,.panel-produccion,.box-kds-mini,.box-mensajes{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:12px}
.seccion-titulo{font-size:11px;font-weight:bold;color:#ffc107;text-transform:uppercase;margin-bottom:4px}
select,input{width:100%;padding:8px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;font-size:12px}
.contenedor-categorias{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px}
.btn-cat{background:#222;border:1px solid #444;color:#ccc;padding:6px 10px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap}
.btn-cat.activo{background:#8b0000;color:#fff}
.grilla-productos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:260px;overflow-y:auto;background:#121212;padding:8px;border-radius:6px;border:1px solid #222}
.card-prod{background:#252525;border:1px solid #444;border-radius:5px;padding:8px;cursor:pointer;min-height:60px}
.card-prod.agotado{background:#3a1212;border-color:#c0392b;opacity:0.5;cursor:not-allowed}
.mapa-contenedor{background:#121212;border:1px dashed #444;border-radius:8px;padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;min-height:520px;align-content:start}
.card-mesa-grid{background:#1a1a1a;border:2px solid #8b0000;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;min-height:140px;cursor:pointer}
.card-mesa-grid.ocupada{border-color:#27ae60;background:#17202a}
.card-mesa-grid.cobrada{border-color:#f1c40f;background:#000;box-shadow:0 0 20px rgba(241,196,15,.4);animation:parpadeo 1s infinite}
.card-mesa-grid.lista-completa{border-color:#f1c40f;background:#2a2411;animation:parpadeo 1s infinite}
.card-mesa-grid.alarm-recibido{box-shadow:0 0 12px #e67e22;border-color:#e67e22}
.card-mesa-grid.alarm-prep{box-shadow:0 0 18px #c0392b;border-color:#c0392b;animation:parpadeo 1s infinite}
.card-mesa-grid.alarm-manos{box-shadow:0 0 22px #f1c40f;border-color:#f1c40f;animation:parpadeo.4s infinite}
@keyframes parpadeo{0%,100%{border-color:#f1c40f}50%{border-color:#fff}}
.mesa-hdr-grid{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:4px;margin-bottom:6px}
.mesa-title-grid{font-size:12px;font-weight:bold;color:#ffc107}
.mesa-status-badge{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:bold;background:#333;color:#aaa}
.badge-tipo{font-size:8px;padding:2px 5px;border-radius:8px;border:1px solid}
.chat-box{background:#111;border:1px solid #333;border-radius:6px;height:180px;overflow-y:auto;padding:8px;font-size:11px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.chat-msg{background:#222;padding:5px 8px;border-radius:4px;border-left:3px solid #2980b9}
.chat-msg.mio{border-left-color:#e74c3c}
.chat-msg.sistema{background:#331f11;border-left-color:#f1c40f;color:#f1c40f;font-weight:bold}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:1000}
.modal-contenido{background:#1e1e1e;border:1px solid #444;border-radius:8px;padding:20px;width:90%;max-width:550px;max-height:90vh;overflow:auto}
.timer-badge{font-family:monospace;font-size:10px;background:#000;padding:2px 5px;border-radius:4px;color:#ccc}
</style>
</head>
<body>
<header>

<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">

</aside>
</div>
<div class="modal-overlay" id="modalOpcionesMesa"><div class="modal-contenido"><h3 id="tituloOpcionesMesa" style="color:#ffc107"></h3><div id="detalleEstadosSeparados" style="background:#111;padding:8px;border-radius:4px;font-size:11px;margin:10px 0"></div><button id="btnAgregar" style="width:100%;padding:10px;background:#27ae60;color:#fff;border:none;border-radius:5px;font-weight:bold;margin-bottom:6px" onclick="seleccionarMesaParaAgregar()">➕ AGREGAR ITEMS</button><button style="width:100%;padding:10px;background:#2980b9;color:#fff;border:none;border-radius:5px;font-weight:bold;margin-bottom:6px" onclick="verDetalleMesaModal()">👁️ VER DETALLE</button><button id="btnCobrar" style="width:100%;padding:10px;background:#f1c40f;color:#000;border:none;border-radius:5px;font-weight:bold" onclick="cobrarMesa()">💰 LIBERAR</button><button style="width:100%;margin-top:8px;background:#333;color:#fff;border:none;padding:8px;border-radius:4px" onclick="cerrarModal('modalOpcionesMesa')">CERRAR</button></div></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0">
<div style="background:#111;padding:12px;border-radius:8px">Propinas hoy: <b id="tPropHoy" style="color:#3498db;font-size:20px">$0</b></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let MENU=[],categoriaActiva='Todos',carrito=[],idMesaGestion=null,sonidoHabilitado=true,mesasDOM={},agotados={},comandasCache={};
const listadoMesasBase=["Salón - Mesa 1","Salón - Mesa 2","Salón - Mesa 3","Salón - Mesa 4","Vereda - Mesa 5","Vereda - Mesa 6","Vereda - Mesa 7","Canal - Mostrador","Canal - Delivery","Canal - Pickup"];
function limpiarKey(str){return (str||'').normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,'_').replace(/__+/g,'_').toLowerCase();}
const PARRILLA_BASE=['asado','vacio','bife','entraña','morcilla','chorizo','provoleta','bondiola','choripan','morcipan'];
const AGREGADOS_COCINA=['lechuga','tomate','jamon','queso','huevo','frita','papas'];
const COCINA_PURA=['milanesa','suprema','pechuga','tortilla'];
function descomponerItem(n){n=(n||'').toLowerCase(); if(COCINA_PURA.some(k=>n.includes(k))) return [{estacion:'COCINA'}]; if(PARRILLA_BASE.some(k=>n.includes(k))) return AGREGADOS_COCINA.some(k=>n.includes(k))?[{estacion:'PARRILLA'},{estacion:'COCINA'}]:[{estacion:'PARRILLA'}]; return [{estacion:'COCINA'}];}
function getTipo(items){let p=false,c=false;(items||[]).forEach(it=>{descomponerItem(it.nombre).forEach(s=>{if(s.estacion==='PARRILLA') p=true; else c=true;});}); if(p&&c) return 'MIXTA'; if(p) return 'PARRILLA'; return 'COCINA';}
let audioCtx=null, ultimaAlarma={};
function initAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
function beep(f,d){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.value=.5;o.start();setTimeout(()=>{try{o.stop()}catch{}},d);}
function alarmaTipo(t){if(!sonidoHabilitado) return; if(t==='RECIBIDO') beep(600,400); else if(t.includes('PREP')){beep(900,300); setTimeout(()=>beep(900,300),400);} else {beep(1200,200); setTimeout(()=>beep(1200,200),250); setTimeout(()=>beep(1500,700),500);}}
window.onload=()=>{inicializarMapaMesas();escucharMenuFirebase();escucharOrdenesFirebase();escucharMensajesFirebase();escucharAgotados();iniciarReloj(); setInterval(checkAlarmas,5000); document.addEventListener('click',initAudio,{once:true}); if(new URLSearchParams(location.search).has('propinas')) setTimeout(abrirPropinas,800);};
function iniciarReloj(){setInterval(()=>{document.getElementById('relojWidget').textContent=`🕒 ${new Date().toLocaleTimeString()}`;},1000);}
function toggleSonido(){sonidoHabilitado=!sonidoHabilitado;document.getElementById('btnSonido').textContent=sonidoHabilitado?'🔔 SONIDO: ON':'🔕 SONIDO: OFF';}
function inicializarMapaMesas(){const cont=document.getElementById('mapaMesasGrid');cont.innerHTML='';mesasDOM={};listadoMesasBase.forEach(id=>{const key=limpiarKey(id);const card=document.createElement('div');card.className='card-mesa-grid';card.id=`mesa_card_${key}`;card.onclick=()=>clickUbicacion(id);card.innerHTML=`<div class="mesa-hdr-grid"><span class="mesa-title-grid">${id.toUpperCase()}</span><span class="mesa-status-badge" id="badge_${key}">LIBRE</span></div><div id="preview_${key}" style="font-size:10px;color:#ccc">Sin comanda</div><div style="font-size:11px;color:#2ecc71;font-weight:bold;margin-top:4px" id="total_${key}">$0</div><div class="timer-badge" id="timer_${key}">--:--</div>`;cont.appendChild(card);mesasDOM[id]={card,badge:document.getElementById(`badge_${key}`),preview:document.getElementById(`preview_${key}`),total:document.getElementById(`total_${key}`),timer:document.getElementById(`timer_${key}`)};});}
function escucharAgotados(){db.ref('platos_agotados').on('value',s=>{agotados=s.val()||{};renderGrilla(categoriaActiva);});}
function escucharMenuFirebase(){db.ref('menu').on('value',snap=>{const data=snap.val();if(!data)return;MENU=Object.keys(data).map(k=>{const it=data[k];return{id:k,nombre:it.nombre||k,cat:it.cat||it.categoria||'General',precio:Number(it.precio||0)}}).filter(Boolean);construirBotonesCategorias();renderGrilla(categoriaActiva);});}
function construirBotonesCategorias(){const c=document.getElementById('contenedorCategorias');const cats=['Todos',...new Set(MENU.map(i=>i.cat))];c.innerHTML='';cats.forEach(cat=>{const b=document.createElement('button');b.className=`btn-cat ${cat===categoriaActiva?'activo':''}`;b.textContent=cat;b.onclick=()=>{categoriaActiva=cat;document.querySelectorAll('.btn-cat').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');renderGrilla(cat);};c.appendChild(b);});}
function renderGrilla(cat){const cont=document.getElementById('grillaProductos');cont.innerHTML='';const filtrados=cat==='Todos'?MENU:MENU.filter(m=>m.cat===cat);filtrados.forEach(prod=>{const agot=!!agotados[prod.nombre];const card=document.createElement('div');card.className=`card-prod ${agot?'agotado':''}`;card.onclick=()=>{if(agot){alert('AGOTADO');return;}const ex=carrito.find(i=>i.id===prod.id);if(ex)ex.cantidad++;else carrito.push({...prod,cantidad:1});renderCarrito();};card.innerHTML=`<div style="font-size:11px;font-weight:bold">${prod.nombre}</div><div style="color:#2ecc71;font-size:11px">$${prod.precio}</div>`;cont.appendChild(card);});}
function renderCarrito(){const cont=document.getElementById('resumenComanda');const tot=document.getElementById('totalMonto');cont.innerHTML='';if(!carrito.length){cont.innerHTML='<p style="color:#666;font-size:11px">No hay ítems</p>';tot.textContent='$0';return;}let total=0;carrito.forEach(it=>{total+=it.precio*it.cantidad;const r=document.createElement('div');r.style.cssText='display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #222';r.innerHTML=`<span>${it.cantidad}x ${it.nombre}</span><span>$${it.precio*it.cantidad}</span>`;cont.appendChild(r);});tot.textContent=`$${total}`;}
function evaluarCanalSeleccionado(){document.getElementById('boxDelivery').style.display=document.getElementById('selectUbicacion').value.includes('Delivery')?'block':'none';}
function enviarOActualizarComanda(){if(!carrito.length){alert("Seleccioná productos");return;}const destino=document.getElementById('selectUbicacion').value;const idSeguro=limpiarKey(destino);db.ref('comandas_activas/'+idSeguro).once('value').then(snap=>{const ex=snap.val();let itemsFinal=[...carrito];let totalFinal=carrito.reduce((a,c)=>a+(c.precio*c.cantidad),0);let nro=ex?ex.nroOrden:Date.now();if(ex&&ex.items){const mapa={};ex.items.forEach(i=>{mapa[i.nombre]=i;});carrito.forEach(n=>{if(mapa[n.nombre])mapa[n.nombre].cantidad+=n.cantidad;else mapa[n.nombre]=n;});itemsFinal=Object.values(mapa);totalFinal=itemsFinal.reduce((a,c)=>a+(c.precio*c.cantidad),0);}const ahora=Date.now();db.ref('comandas_activas/'+idSeguro).set({mesa:destino,items:itemsFinal,total:totalFinal,estado:ex?ex.estado:'RECIBIDO',estado_parrilla:ex?ex.estado_parrilla||ex.estado:'RECIBIDO',estado_cocina:ex?ex.estado_cocina||ex.estado:'RECIBIDO',emisor:'Mariana',timestamp:ex?ex.timestamp:ahora,timestamp_estado:ahora,nroOrden:nro});carrito=[];renderCarrito();});}
function escucharOrdenesFirebase(){db.ref('comandas_activas').on('value',snap=>{const data=snap.val()||{};comandasCache=data;listadoMesasBase.forEach(id=>{const m=mesasDOM[id];if(m){m.card.className='card-mesa-grid';m.badge.textContent='LIBRE';m.preview.textContent='Sin comanda';m.total.textContent='$0';m.timer.textContent='--:--';}});let pend=0,ocup=0,mixtas=0,cobr=0;const lista=document.getElementById('listaPendientesKDS');lista.innerHTML='';Object.values(data).forEach(cmd=>{if(!cmd||!cmd.mesa)return;const tipo=getTipo(cmd.items);const ep=(cmd.estado_parrilla||cmd.estado||'RECIBIDO').toUpperCase();const ec=(cmd.estado_cocina||cmd.estado||'RECIBIDO').toUpperCase();const esCobrada=cmd.estado==='COBRADA';const m=mesasDOM[cmd.mesa];if(!m)return;ocup++;const ts=cmd.timestamp_estado||cmd.timestamp||Date.now();const mins=(Date.now()-ts)/1000/60;const seg=Math.floor((Date.now()-(cmd.timestamp||Date.now()))/1000);const mm=String(Math.floor(seg/60)).padStart(2,'0');const ss=String(seg%60).padStart(2,'0');if(!esCobrada){pend++;const d=document.createElement('div');d.style.cssText="background:#222;padding:6px;border-radius:4px;margin-bottom:4px";d.innerHTML=`<strong>${cmd.mesa}</strong> ${tipo} P:${ep} C:${ec}`;lista.appendChild(d);} if(esCobrada){cobr++;m.card.classList.add('cobrada');m.badge.textContent=`💰 COBRADA $${cmd.total_cobrado||cmd.total}`;m.badge.style.background='#f1c40f';m.badge.style.color='#000';m.preview.innerHTML=`💰 $${cmd.total_cobrado||cmd.total}<br>${(cmd.items||[]).map(i=>i.nombre).join(', ')}`;} else {m.card.classList.add('ocupada');m.badge.textContent=`${tipo} P:${ep} C:${ec}`;m.preview.innerHTML=(cmd.items||[]).map(i=>`• ${i.cantidad}x ${i.nombre}`).join('<br>');if(tipo==='MIXTA'&&(ep.includes('MANOS')&&ec.includes('MANOS'))){m.card.classList.add('lista-completa');mixtas++;}} m.total.textContent=`$${cmd.total_cobrado||cmd.total}`;m.timer.textContent=`${mm}:${ss} | ${mins.toFixed(1)}min`;});document.getElementById('contadorPendientes').textContent=pend;document.getElementById('contadorMesasAtendidas').textContent=ocup;document.getElementById('contadorMixtas').textContent=mixtas;document.getElementById('contadorCobradas').textContent=cobr;});}
function escucharMensajesFirebase(){db.ref('mensajes_chat').limitToLast(20).on('value',snap=>{const box=document.getElementById('chatMensajes');box.innerHTML='';const data=snap.val();if(!data)return;Object.values(data).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(m=>{const d=document.createElement('div');d.className='chat-msg';d.innerHTML=`<strong>${m.remitente}</strong> (${m.hora||''})<br>${m.texto}`;box.appendChild(d);});box.scrollTop=box.scrollHeight;});}
function checkAlarmas(){Object.values(comandasCache).forEach(cmd=>{if(!cmd.mesa)return;const ts=cmd.timestamp_estado||cmd.timestamp||Date.now();const mins=(Date.now()-ts)/1000/60;const ep=(cmd.estado_parrilla||'RECIBIDO').toUpperCase();let debe=null;if(ep==='RECIBIDO'&&mins>=5) debe='RECIBIDO';else if(ep.includes('PREP')&&mins>=15) debe=ep;else if(ep.includes('MANOS')&&mins>=1.5) debe=ep;if(debe){const k=limpiarKey(cmd.mesa)+'_'+debe;if(!ultimaAlarma[k]||Date.now()-ultimaAlarma[k]>30000){alarmaTipo(debe);ultimaAlarma[k]=Date.now();}}});}
function clickUbicacion(id){idMesaGestion=id;const cmd=Object.values(comandasCache).find(c=>c.mesa===id);document.getElementById('tituloOpcionesMesa').textContent=`Gestionar: ${id}`;if(cmd){document.getElementById('detalleEstadosSeparados').innerHTML=`${getTipo(cmd.items)}<br>P: ${cmd.estado_parrilla||cmd.estado} C: ${cmd.estado_cocina||cmd.estado}<br><br>${cmd.items.map(i=>`• ${i.cantidad}x ${i.nombre}`).join('<br>')}<br><br>Total $${cmd.total_cobrado||cmd.total}`;document.getElementById('btnAgregar').style.display=cmd.estado==='COBRADA'?'none':'block';}else{document.getElementById('detalleEstadosSeparados').innerHTML='Mesa libre';document.getElementById('btnAgregar').style.display='none';}document.getElementById('modalOpcionesMesa').style.display='flex';}
function seleccionarMesaParaAgregar(){document.getElementById('selectUbicacion').value=idMesaGestion;cerrarModal('modalOpcionesMesa');}
function verDetalleMesaModal(){const cmd=Object.values(comandasCache).find(c=>c.mesa===idMesaGestion);alert(cmd?`${cmd.mesa} $${cmd.total_cobrado||cmd.total}\n${cmd.items.map(i=>i.nombre).join('\n')}`:'Libre');}
function cobrarMesa(){if(!idMesaGestion)return;const cmd=Object.values(comandasCache).find(c=>c.mesa===idMesaGestion);if(!cmd||cmd.estado!=='COBRADA'){alert('Solo Gustavo cobra');return;}if(!confirm(`Liberar ${idMesaGestion}?`))return;db.ref('comandas_activas/'+limpiarKey(cmd.mesa)).remove();cerrarModal('modalOpcionesMesa');}
function enviarMensajeChat(){const inp=document.getElementById('inputMensaje');if(!inp.value.trim())return;db.ref('mensajes_chat').push({remitente:'Mariana',texto:inp.value,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});inp.value='';}
function cerrarModal(id){document.getElementById(id).style.display='none';}
function abrirPropinas(){
  document.getElementById('modalPropinas').style.display='flex';
  db.ref('propinas_dia').once('value').then(s=>{
    let tot=0, html='', count=0;
    Object.values(s.val()||{}).forEach(r=>{
      tot+=parseInt(r.monto||0); count++;
      html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:6px 0"><span>${new Date(r.timestamp).toLocaleTimeString()} - ${r.mesa||''}</span><b style="color:#3498db">$${r.monto}</b></div>`;
    });
    document.getElementById('tPropHoy').innerText='$'+tot;
    document.getElementById('tMesasCob').innerText=count;
    document.getElementById('listaPropinasDet').innerHTML=html||'Sin propinas hoy';
  });
}
</script>
