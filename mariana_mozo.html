<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comandera Mariana (Mozo) | Parrilla La Perseverancia</title>
  
  <!-- Firebase SDKs (Compat) v9.23.0 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --color-fondo: #121212;
      --color-texto: #ffffff;
      --color-primario: #8b0000; /* Rojo Oscuro */
      --color-secundario: #ffc107; /* Amarillo Oro */
      --color-exito: #2ecc71; /* Verde */
      --color-peligro: #e74c3c; /* Rojo Claro */
      --color-gris-fondo: #1e1e1e;
      --color-gris-tarjeta: #252525;
      --color-borde: #444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--color-fondo);
      color: var(--color-texto);
      padding: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--color-primario);
      padding: 10px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .info-widget {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .badge-live {
      background-color: #000;
      color: var(--color-exito);
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--color-exito);
    }

    .btn-top {
      background-color: #333;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-top:hover { opacity: 0.85; }
    .btn-sonido { background-color: #d35400; }
    .btn-sonido.silenciado { background-color: #7f8c8d; }

    /* Main Layout */
    .layout-principal {
      display: grid;
      grid-template-columns: 350px 1fr 310px;
      gap: 10px;
      flex-grow: 1;
      overflow: hidden;
    }

    @media (max-width: 1200px) {
      .layout-principal { grid-template-columns: 330px 1fr; }
      .panel-derecho { grid-column: 1 / -1; display: flex; gap: 10px; }
      .box-kds-mini { flex: 1; }
      .box-mensajes { flex: 1; margin-top: 0 !important;}
    }

    .panel {
      background-color: var(--color-gris-fondo);
      border: 1px solid var(--color-borde);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .seccion-titulo {
      font-size: 10px;
      font-weight: bold;
      color: var(--color-secundario);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    /* Panel Izquierdo */
    .row-ubicacion {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    select, input {
      width: 100%;
      padding: 6px;
      background-color: #111;
      border: 1px solid var(--color-borde);
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--color-secundario); }

    .box-delivery {
      background-color: #1a1a1a;
      border: 1px dashed #e67e22;
      padding: 6px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    /* Categorías */
    .contenedor-categorias {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .contenedor-categorias::-webkit-scrollbar { height: 4px; }
    .contenedor-categorias::-webkit-scrollbar-thumb { background: #333; border-radius: 2px;}

    .btn-cat {
      background-color: #222;
      color: #ccc;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
      border: 1px solid var(--color-borde);
    }
    .btn-cat:hover { background-color: #333; color: #fff; }
    .btn-cat.activo {
      background-color: var(--color-primario);
      color: #fff;
      border-color: var(--color-peligro);
    }

    /* Grilla Productos */
    .grilla-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 6px;
      max-height: 180px; /* Ajustado para pantallas chicas */
      overflow-y: auto;
      background-color: #121212;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #222;
      margin-bottom: 8px;
    }
    .grilla-productos::-webkit-scrollbar { width: 4px; }

    .card-prod {
      background-color: var(--color-gris-tarjeta);
      border: 1px solid var(--color-borde);
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 55px;
      transition: all 0.1s;
      text-align: center;
    }
    .card-prod:hover { border-color: var(--color-secundario); transform: scale(1.03); background-color: #333; }
    .card-prod .nombre { font-size: 10px; font-weight: bold; color: #fff; line-height: 1.1; margin-bottom: 2px; }
    .card-prod .precio { font-size: 10px; font-weight: bold; color: var(--color-exito); }

    /* Resumen Comanda */
    .resumen-box {
      background-color: #111;
      border: 1px solid var(--color-borde);
      border-radius: 6px;
      padding: 6px;
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
    }
    .resumen-box::-webkit-scrollbar { width: 4px; }

    .item-carrito {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px solid #222;
      font-size: 10px;
    }

    .cnt-ctrls { display: flex; align-items: center; gap: 4px; }

    .btn-qty {
      background-color: #444;
      color: #fff;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-qty:hover { background-color: #666; }
    .btn-qty.minus { background-color: #555; }
    .btn-qty.plus { background-color: #777; }

    .total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 12px;
      padding: 4px 0;
      color: var(--color-secundario);
      border-top: 1px solid var(--color-borde);
      margin-top: auto;
    }

    .btn-enviar {
      width: 100%;
      background-color: var(--color-peligro);
      border: none;
      color: white;
      padding: 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(231, 76, 60, 0.3);
      transition: 0.2s;
    }
    .btn-enviar:hover { background-color: #c0392b; }
    .btn-enviar:active { transform: translateY(1px); }

    /* Panel Central (Plano Mesas) */
    .mapa-contenedor {
      background-color: #121212;
      border: 1px dashed var(--color-borde);
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      overflow-y: auto;
      align-content: start;
    }
    .mapa-contenedor::-webkit-scrollbar { width: 6px; }

    .card-mesa-grid {
      background-color: var(--color-gris-tarjeta);
      border: 2px solid #666; /* Color base mesa libre */
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card-mesa-grid:hover { border-color: var(--color-secundario); box-shadow: 0 0 8px rgba(255,193,7,0.2); transform: translateY(-2px);}
    
    /* ESTILOS DE ESTADO (Basados en nodo 'orders') */
    .card-mesa-grid.estado-PENDIENTE { border-color: var(--color-peligro); background-color: #2a1212; } /* Rojo */
    .card-mesa-grid.estado-EN_PREPARACION { border-color: var(--color-secundario); background-color: #333300; } /* Amarillo */
    .card-mesa-grid.estado-LISTO { border-color: var(--color-exito); background-color: #113822; } /* Verde */

    .mesa-hdr-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 3px;
      margin-bottom: 4px;
    }
    .mesa-title-grid { font-size: 10px; font-weight: bold; color: var(--color-secundario); }
    .mesa-status-badge { font-size: 8px; padding: 2px 4px; border-radius: 3px; font-weight: bold; background: #555; color: #fff; text-transform: uppercase;}
    
    /* Colores de badge según estado */
    .card-mesa-grid.estado-PENDIENTE .mesa-status-badge { background: var(--color-peligro); }
    .card-mesa-grid.estado-EN_PREPARACION .mesa-status-badge { background: var(--color-secundario); color: #000; }
    .card-mesa-grid.estado-LISTO .mesa-status-badge { background: var(--color-exito); }

    .mesa-body-preview {
      font-size: 9px;
      color: #ccc;
      flex-grow: 1;
      overflow-y: auto;
      max-height: 50px;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .mesa-body-preview::-webkit-scrollbar { width: 3px; }

    .mesa-footer-grid {
      border-top: 1px solid #444;
      padding-top: 2px;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      font-weight: bold;
      color: var(--color-exito);
    }

    /* Panel Derecho */
    .panel-derecho { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .box-kds-mini, .box-mensajes { background-color: var(--color-gris-fondo); border: 1px solid var(--color-borde); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; }
