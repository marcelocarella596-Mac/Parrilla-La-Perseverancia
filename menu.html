<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Perseverancia - Carta</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<header class="bg-red-800 text-white p-4 sticky top-0 z-10">
  <h1 class="font-bold">PARRILLA LA PERSEVERANCIA</h1>
  <p id="mesa" class="text-xs opacity-80"></p>
</header>
<div id="menu" class="p-4 pb-32">Cargando...</div>

<div id="carrito" class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t shadow-xl flex justify-between items-center">
  <div><span id="total">$0</span> - <span id="count">0</span> productos</div>
  <button onclick="pedir()" class="bg-green-600 text-white px-6 py-3 rounded-full font-bold">Pedir por WhatsApp</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const params = new URLSearchParams(location.search);
const mesa = params.get('mesa') || 'MOSTRADOR';
document.getElementById('mesa').textContent = mesa.replaceAll('_',' ');

let productos = [];
let carrito = [];

async function load(){
  const snap = await getDocs(collection(db, "productos"));
  productos = snap.docs.map(d=>({id:d.id, ...d.data()}));
  let html = '';
  productos.forEach(p=>{
    html += `<div class="bg-white rounded-lg p-3 mb-3 flex justify-between">
      <div><b>${p.nombre}</b><br><small>${p.descripcion||''}</small><br><b class="text-red-700">$${p.precio}</b></div>
      <button onclick="add('${p.id}')" class="bg-red-700 text-white w-10 h-10 rounded-full">+</button>
    </div>`;
  });
  document.getElementById('menu').innerHTML = html;
}
window.add = (id)=>{
  const p = productos.find(x=>x.id==id);
  carrito.push(p);
  document.getElementById('count').textContent = carrito.length;
  const t = carrito.reduce((s,x)=>s+Number(x.precio),0);
  document.getElementById('total').textContent = '$'+t;
}
window.pedir = ()=>{
  if(carrito.length==0) return alert('Carrito vacío');
  let txt = `*PEDIDO ${mesa}*%0A`;
  carrito.forEach(p=>txt+=`- ${p.nombre} $${p.precio}%0A`);
  window.open(`https://wa.me/5491150000000?text=${txt}`,'_blank');
}
load();
</script>
</body>
</html>
