    window.subirDatosOficiales = async () => {
      const log = document.getElementById("log");
      log.innerHTML = "⏳ Limpiando base de datos vieja...<br>";

      try {
        const querySnapshot = await getDocs(collection(db, "menu_items"));
        for (const docSnap of querySnapshot.docs) {
          await deleteDoc(doc(db, "menu_items", docSnap.id));
        }
        log.innerHTML += "✅ Base de datos limpia.<br><br>🚀 Cargando productos del PDF...<br>";

        for (const item of productosPDF) {
          await addDoc(collection(db, "menu_items"), item);
          log.innerHTML += `✔️ Cargado: ${item.nombre} ($${item.precio}) - [${item.categoria}]<br>`;
        }

        log.innerHTML += "<br><strong>🎉 ¡Carga completa del Menú PDF exitosa!</strong>";
      } catch (error) {
        log.innerHTML += `<br>❌ Error: ${error.message}`;
      }
